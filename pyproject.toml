[tool.setuptools.exclude-package-data]
"worldfoundry" = ["training/*", "training/**/*"]
"worldfoundry.cli" = ["training.py", "training_commands/*", "training_commands/**/*"]
"*" = [
    "**/test_*.py", "**/*_test.py", "**/test_*.cpp", "**/*_test.cpp",
    "**/test/*", "**/test/**/*", "**/tests/*", "**/tests/**/*",
    "**/testing/*", "**/testing/**/*", "**/conftest.py", "**/pytest.ini",
    "assets/vendor/**/*",
    "**/__pycache__/*",
    "**/*.pyc",
    "**/*.pyo",
]
# Package excludes do not stop include-package-data from treating files below
# excluded namespace packages as data of the nearest retained parent. Keep a
# second, per-parent barrier for every license-gated subtree.
