[tool.setuptools_scm]

[tool.pytest.ini_options]
# A CPU gate that runs in a public checkout with the test extra. Select other
# suites explicitly; they can require model-specific or local-only resources.
testpaths = [
    "tests/synthesis/test_inspatio_v15_catalog.py",
    "tests/core/test_core_module_boundaries.py",
    "tests/core/execution/test_overlap_lifecycle.py",
    "tests/core/test_process_logging.py",
    "tests/runtime/test_device_pool.py",
    "tests/runtime/test_geometry_regression.py",
    "tests/runtime/test_geometry_regression_impact.py",
    "tests/runtime/test_geometry_regression_relocations.py",
    "tests/runtime/test_geometry_regression_suite.py",
    "tests/runtime/test_geometry_regression_schedule.py",
    "tests/runtime/test_video_regression.py",
    "tests/runtime/test_inference_regression_gate.py",
    "tests/runtime/test_local_checkpoint_cache.py",
    "tests/runtime/test_jobs_store_persistence.py",
    "tests/runtime/test_jobs_logging.py",
    "tests/runtime/test_in_tree_cli.py",
    "tests/studio/test_runtime_catalog_defaults.py",
    "tests/studio/test_conda_dispatch.py",
    "tests/studio/test_inference_lifecycle.py",
    "tests/studio/test_module_boundaries.py",
    "tests/studio/test_workspace_app_subprocess_safety.py",
    "tests/studio/test_execution_pipeline_cleanup.py",
    "tests/studio/test_job_store_shutdown.py",
    "tests/eval_core/test_packaging_license_gate.py",
    "tests/eval_core/test_kandinsky6_license_bundle.py",
    "tests/eval_core/test_native_license_sdist.py",
    "tests/synthesis/test_visual_generation_layout.py",
    "tests/synthesis/test_base_synthesis_lazy_import.py",
    "tests/studio/test_pipeline_cache.py",
    "tests/studio/test_resident_workers.py",
]
addopts = "--import-mode=importlib"
norecursedirs = [".*", "__pycache__", "build", "dist", "manual", "stream"]
markers = [
    "fast_eval_core: evaluation framework contracts",
    "unit: focused unit tests",
    "gpu: requires a CUDA device and model-specific dependencies",
]

[tool.ty.environment]
python-version = "3.10"
extra-paths = [".", "docs/fumadocs/scripts"]

[tool.ty.src]
exclude = [
    "thirdparty/**",
    "worldfoundry/base_models/**",
    "worldfoundry/synthesis/**",
    "worldfoundry/evals/tasks/execution/runners/*/runtime/**",
    "worldfoundry/evals/tasks/execution/runners/*/official/**",
    "worldfoundry/evals/tasks/metrics/*/vendor/**",
]

[tool.ty.analysis]
# Triton's JIT DSL (`tl.constexpr` parameters, launch grids and version-gated
# builtins) has no Python typing, and the light quality job does not install
# Triton; analyse Triton imports as dynamic in every environment.
replace-imports-with-any = ["triton.**"]
# Optional runtime extras that the light `Python quality` job does not install.
# Environments that install them still resolve and type-check these imports.
allowed-unresolved-imports = [
    "aiohttp.**",
    "aiortc.**",
    "av.**",
    "dashscope.**",
    "decord.**",
    "diffusers.**",
    "flash_attn.**",
    "imageio_ffmpeg.**",
    "jaxtyping.**",
    "lpips.**",
    "matplotlib.**",
    "msgspec.**",
    "omegaconf.**",
    "onnxruntime.**",
    "open3d.**",
    "pandas.**",
    "plyfile.**",
    "pycg.**",
    "pyexr.**",
    "PyNvVideoCodec.**",
    "rerun.**",
    "rich.**",
    "safetensors.**",
    "scipy.**",
    "seaborn.**",
    "skimage.**",
    "textual.**",
    "textual_image.**",
    "transformers.**",
    "trimesh.**",
    "viser.**",
    "wan.**",
    # Official runtime sources that setup fetches into these git-ignored packages.
    "worldfoundry.synthesis.visual_generation.hunyuan_world.hunyuan_world_voyager.**",
    "worldfoundry.synthesis.visual_generation.hunyuan_world.hy_world_2p0_panogen_runtime.**",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# Root-level artifact and vendor directories. The ./ prefix anchors each name to the repository
# root, so same-named source packages such as worldfoundry/core/attention/cache stay linted.
extend-exclude = [
    "./thirdparty",
    "./cache",
    "./tmp",
    "./outputs",
    "./runs",
    "./benchmark_results",
    "./inspatio_world_output",
    "docs/fumadocs/.next",
    "docs/fumadocs/node_modules",
    "docs/fumadocs/out",
    "./apps",
    # License-gated runtimes that setup fetches into these Git-ignored directories. They are
    # not repository sources; every tracked worldfoundry file is linted.
    "worldfoundry/base_models/three_dimensions/depth/dvlt/dvlt_runtime",
    "worldfoundry/base_models/three_dimensions/depth/unik3d",
    "worldfoundry/base_models/three_dimensions/general_3d/dust3r",
    "worldfoundry/base_models/three_dimensions/general_3d/four_d_gaussians",
    "worldfoundry/base_models/three_dimensions/general_3d/mast3r",
    "worldfoundry/base_models/three_dimensions/general_3d/monst3r",
    "worldfoundry/base_models/three_dimensions/general_3d/stable_virtual_camera",
    "worldfoundry/base_models/three_dimensions/point_clouds/gaussian_splatting",
    "worldfoundry/base_models/three_dimensions/point_clouds/pi3",
    "worldfoundry/base_models/three_dimensions/slam/mega_sam_runtime/UniDepth",
    "worldfoundry/synthesis/visual_generation/hunyuan_world/hunyuan_game_craft",
    "worldfoundry/synthesis/visual_generation/hunyuan_world/hunyuan_world_voyager",
    "worldfoundry/synthesis/visual_generation/hunyuan_world/hy_world_2p0_panogen_runtime",
    "worldfoundry/synthesis/visual_generation/hunyuan_world/hy_world_2p0_worldgen_runtime",
    "worldfoundry/synthesis/visual_generation/krea_realtime/realtime_video_runtime",
    "worldfoundry/synthesis/visual_generation/vmem/vmem_runtime/extern/CUT3R",
    "worldfoundry/synthesis/visual_generation/wonderworld/wonderworld_runtime",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RUF",
]
ignore = [
    # Line length is left to the formatter.
    "E501",
    # Deprecated in Ruff.
    "UP038",
    # Full-width CJK punctuation in strings, docstrings and comments is intentional.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests, scripts, benchmarks and documentation tooling keep the E4/E7/E9/F/I rule set.
"tests/**" = ["UP", "B", "SIM", "C4", "PIE", "RUF"]
"scripts/**" = ["UP", "B", "SIM", "C4", "PIE", "RUF"]
"benchmarks/**" = ["UP", "B", "SIM", "C4", "PIE", "RUF"]
"docs/**" = ["UP", "B", "SIM", "C4", "PIE", "RUF"]

[tool.setuptools]
# Package discovery deliberately uses setuptools namespace semantics: every
# directory below worldfoundry/ is a candidate, even without __init__.py.
# `make packaging-check` rejects dead excludes and any license-gated package
# that reaches the final wheel set.
packages = { find = { where = ["."], namespaces = true, include = ["worldfoundry*"], exclude = [
    # Prune non-package trees before namespace discovery descends into them.
    "tmp",
    "tmp.*",
    "docs",
    "docs.*",

    # Reserved public-distribution boundaries; these stay excluded even when absent.
    "worldfoundry.training",
    "worldfoundry.training.*",
    "worldfoundry.cli.training_commands",
    "worldfoundry.cli.training_commands.*",
    "*.tests",
    "*.tests.*",
    "*.test",
    "*.test.*",
    "*.testing",
    "*.testing.*",
    # Structural: upstream runtime mirrors and inner checkouts never ship.
    "worldfoundry.synthesis.visual_generation.*.runtime*",
    "worldfoundry.synthesis.visual_generation.*.*_runtime*",
    "worldfoundry.base_models.*.*.*_runtime.src*",
    "worldfoundry.base_models.*.*.*_runtime.*.src*",
    "worldfoundry.base_models.*.*.pixelsplat.src*",
    "worldfoundry.base_models.*.vggt_omega.vggt_omega",
    "worldfoundry.base_models.*.vggt_omega.vggt_omega.*",
    "worldfoundry.base_models.*.pixelsplat",
    "worldfoundry.base_models.*.eastern_journalist.utils3d",
    "worldfoundry.base_models.*.eastern_journalist.utils3d.*",
    "worldfoundry.base_models.*.*_runtime",
    "worldfoundry.base_models.*.*_runtime.*",
    # License-gated vendored trees (LICENSE_GATED_PATHS in scripts/setup/check_packaging_license_gate.py).
    "worldfoundry.base_models.three_dimensions.depth.unik3d",
    "worldfoundry.base_models.three_dimensions.depth.unik3d.*",
    "worldfoundry.base_models.three_dimensions.general_3d.dust3r",
    "worldfoundry.base_models.three_dimensions.general_3d.dust3r.*",
    "worldfoundry.base_models.three_dimensions.general_3d.four_d_gaussians",
    "worldfoundry.base_models.three_dimensions.general_3d.four_d_gaussians.*",
    "worldfoundry.base_models.three_dimensions.general_3d.mast3r",
    "worldfoundry.base_models.three_dimensions.general_3d.mast3r.*",
    "worldfoundry.base_models.three_dimensions.general_3d.monst3r",
    "worldfoundry.base_models.three_dimensions.general_3d.monst3r.*",
    "worldfoundry.base_models.three_dimensions.general_3d.stable_virtual_camera",
    "worldfoundry.base_models.three_dimensions.general_3d.stable_virtual_camera.*",
    "worldfoundry.base_models.three_dimensions.point_clouds.gaussian_splatting",
    "worldfoundry.base_models.three_dimensions.point_clouds.gaussian_splatting.*",
    "worldfoundry.base_models.three_dimensions.point_clouds.pi3",
    "worldfoundry.base_models.three_dimensions.point_clouds.pi3.*",
    "worldfoundry.synthesis.visual_generation.hunyuan_world.hunyuan_game_craft",
    "worldfoundry.synthesis.visual_generation.hunyuan_world.hunyuan_game_craft.*",
    "worldfoundry.synthesis.visual_generation.hunyuan_world.hunyuan_world_voyager",
    "worldfoundry.synthesis.visual_generation.hunyuan_world.hunyuan_world_voyager.*",
] } }
include-package-data = true

