bridgedata_v2_dataset_assets:
  family: benchmark_data_asset
  gpu_required: false
  assets:
    - id: bridgedata_v2_dataset_assets_dir
      kind: dir
      role: external_benchmark_dataset
      env: [WORLDFOUNDRY_BRIDGEDATA_V2_DATASET_ROOT]
      local_path: ${WORLDFOUNDRY_DATA_DIR}/datasets/bridgedata-v2
      manual_action: Download the official BridgeData V2 raw or TFDS files from https://rail.eecs.berkeley.edu/datasets/bridge_release/data/
        into $WORLDFOUNDRY_BRIDGEDATA_V2_DATASET_ROOT, then rerun readiness. The release is an HTTP directory, so
        choose the demos/scripted zips or tfds subset needed for your evaluation instead of blindly mirroring the
        whole dataset.
      min_file_count: 1
      note: BridgeData V2 dataset root; no single public HF mirror is declared in the benchmark manifest.

calvin_dataset_assets:
  family: benchmark_data_asset
  gpu_required: false
  assets:
    - id: calvin_dataset_assets_dir
      kind: dir
      role: external_benchmark_dataset
      env: [WORLDFOUNDRY_CALVIN_DATASET_ROOT]
      local_path: ${WORLDFOUNDRY_DATA_DIR}/datasets/calvin
      alternate_paths: ['${WORLDFOUNDRY_WORKSPACE_ROOT}/data/worldfoundry/datasets/calvin']
      manual_action: Stage the official CALVIN dataset split directly under $WORLDFOUNDRY_CALVIN_DATASET_ROOT or
        $WORLDFOUNDRY_DATA_DIR/datasets/calvin. WorldFoundry does not run the upstream calvin repository download_data.sh
        script during readiness.
      min_file_count: 1
      required_any_paths: [task_D_D, task_ABC_D, task_ABCD_D]
      note: CALVIN dataset split root; users must stage the official dataset before full rollouts.

vbench_source_assets:
  family: benchmark_data_asset
  canonical_path: worldfoundry/evals/tasks/execution/runners/vbench/runtime
  canonical_owner: worldfoundry.evals.tasks.execution.runners.vbench
  gpu_required: false
  assets:
    - id: vbench_in_tree_official_source
