lpips_vgg:
  family: video_quality
  canonical_path: worldfoundry/base_models/perception_core/video_quality/lpips.py
  package_imports: [lpips, torch, torchvision]

wrbench_scorer_runtime_config:
  family: video_metric_model
  canonical_path: worldfoundry/evals/tasks/execution/runners/wrbench/runtime/wrbench/eval
  gpu_required: true
  assets:
    - id: wrbench_runtime_config_file
      kind: file
      role: config
      env: [WORLDFOUNDRY_WRBENCH_RUNTIME_CONFIG]
      local_path: ${WORLDFOUNDRY_DATA_DIR}/benchmarks/wrbench/wrbench.runtime.json
      manual_action: >-
        Copy wrbench.runtime.example.json from https://github.com/JinPLu/WRBench and fill eval.scorers explicitly:
        vggt_repo and vggt_checkpoint (VGGT-Omega, D1), dinov2_model_path (D2), qwen35_model and qwen3vl_model
        (D3-D6); then set WORLDFOUNDRY_WRBENCH_RUNTIME_CONFIG.
      note: >-
        Official WRBench scoring is driven by this config; upstream pins model families (VGGT-Omega, DINOv2,
        Qwen3.5, Qwen3-VL) but not checkpoints, so they are staged through it rather than as fixed assets.
