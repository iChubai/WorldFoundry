jedi_vjepa_vith16:
  family: video_metric_model
  canonical_path: worldfoundry/evals/tasks/metrics/jedi
  package_imports: [torch, vjepa, numpy, yaml]
  install_packages: [torch, vjepa, numpy, pyyaml]
  assets:
    - id: jedi_vith16_encoder_checkpoint
      kind: dir
      role: metric_model_dir
      env: [WORLDFOUNDRY_JEDI_MODEL_DIR, WORLDFOUNDRY_JEDI_VJEPA_DIR, WORLDFOUNDRY_VJEPA_MODEL_DIR]
      local_path: ${WORLDFOUNDRY_HFD_ROOT}/jedi-vjepa
      download_command_template: >-
        mkdir -p ${WORLDFOUNDRY_HFD_ROOT}/jedi-vjepa &&
        curl -L --fail --retry 5 --retry-delay 2 https://dl.fbaipublicfiles.com/jepa/vith16/vith16.pth.tar
        -o ${WORLDFOUNDRY_HFD_ROOT}/jedi-vjepa/vith16.pth.tar
      required_files: [vith16.pth.tar]
      note: V-JEPA ViT-H/16 encoder checkpoint used by VideoJEDi feature extraction. The JEDi runtime reads it from this model directory.

