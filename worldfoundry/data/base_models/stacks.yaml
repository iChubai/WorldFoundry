depth_eval_data_stack:
  family: perception_data_asset
  capabilities: [tum_rgbd_slam_sample_assets, kitti_depth_slam_assets]
  note: Depth-oriented RGB-D/KITTI data assets staged through the base-model asset planner.

slam_eval_data_stack:
  family: perception_data_asset
  capabilities: [tum_rgbd_slam_sample_assets, kitti_depth_slam_assets]
  note: SLAM/trajectory data assets for reusable camera-pose and trajectory sanity checks.

detection_segmentation_eval_data_stack:
  family: perception_data_asset
  capabilities:
    - coco2017_detection_segmentation_assets
    - davis2017_video_segmentation_assets
  note: Detection, image segmentation, and video object segmentation evaluation data assets.

spatial_perception_data_stack:
  family: perception_data_asset
  capabilities: [detection_segmentation_eval_data_stack, depth_eval_data_stack]
  note: Common depth, SLAM, detection, and segmentation datasets kept at the base-model layer.

spatial_perception_full_eval_stack:
  family: video_world_perception
  capabilities: [spatial_perception_heavy_stack, spatial_perception_data_stack]
  note: Heavy spatial perception model stack plus reusable eval data assets for end-to-end validation.

motion_stack:
  family: motion
  capabilities: [raft, sea_raft, flowformerplusplus, vfimamba]
  note: Optical-flow and motion-estimation assets shared by temporal quality metrics.

video_world_perception_stack:
  family: video_world
  capabilities:
    - clip_vit_b32
    - dinov2_base
    - siglip_so400m
    - depth_anything_v3
    - droid_slam
    - grounding_dino
    - sam_v1
    - sam2
    - raft
    - sea_raft
  note: Default shared perception stack for video-world benchmark runners.

mind_metric_stack:
  family: video_metric_model
  capabilities: [dinov3_base, vipe_official_checkout]
  note: MIND metric models — DINOv3 ViT-B/16 for the DINO metric and the official ViPE pipeline for action accuracy.
