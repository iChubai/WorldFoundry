id: worldatlas-arena
name: WorldArena (WorldAtlas Arena)
publisher: OpenEnvision
publisher_kind: research_organization
benchmark_kind:
- world-model
- video-generation
- interactive-world-model
domains:
- world-model
- video-quality
- 3d-4d-consistency
- physics
- long-horizon-memory
- real-time-interaction
modalities:
- image
- video
- text
- camera-pose
- action
status: confirmed_official_code
official_sources:
  github:
    url: https://github.com/OpenEnvision/WorldArena
    revision: 1ffc3a9564215471b9c39f602a66843e0183dcd1
    verified_by: clean local checkout of the official repository
  license:
    status: mit
    notes: The upstream MIT LICENSE is retained beside the vendored evaluator.
benchmark_assets:
  official_media:
    status: caller_provided
    notes: Benchmark images, videos, annotations, manifests, predictions, and checkpoints are not vendored.
  in_tree_fixture:
    path: worldfoundry/data/benchmarks/assets/worldatlas-arena/sample_results.json
    purpose: Synthetic result-normalizer validation only.
evaluation_surface:
  protocol: worldatlas_arena_six_axis_vector
  suites:
  - image_static
  - image_dynamic
  - video_static
  - video_dynamic
  - memory_loop
  metric_protocol:
    metric_ids:
    - long_sequence
    - action_control
    - consistency_3d_4d
    - physics
    - quality
    - real_time
  notes:
  - Upstream publishes per-metric and six-axis per-dimension summaries; it intentionally does not define a
    benchmark-wide scalar score.
metrics:
- id: long_sequence
  name: Long Sequence / Memory
  description: Mean of official long-horizon persistence and closed-loop memory metrics available for each suite.
  higher_is_better: true
  leaderboard_key: long_sequence
  aggregator: mean
  output_unit: rate
  normalizer: identity:0:1
- id: action_control
  name: Action Control
  description: Mean of official prompt, camera, motion, and keystroke-control metrics available for each suite.
  higher_is_better: true
  leaderboard_key: action_control
  aggregator: mean
  output_unit: rate
  normalizer: identity:0:1
- id: consistency_3d_4d
  name: 3D/4D Consistency
  description: Mean of official geometry, depth, flow, and reconstruction consistency metrics available for each suite.
  higher_is_better: true
  leaderboard_key: consistency_3d_4d
  aggregator: mean
  output_unit: rate
  normalizer: identity:0:1
- id: physics
  name: Physics
  description: Mean of official physical plausibility and motion-dynamics metrics available for each suite.
  higher_is_better: true
  leaderboard_key: physics
  aggregator: mean
  output_unit: rate
  normalizer: identity:0:1
- id: quality
  name: Quality
  description: Mean of official perceptual quality, fidelity, and temporal artifact metrics available for each suite.
  higher_is_better: true
  leaderboard_key: quality
  aggregator: mean
  output_unit: rate
  normalizer: identity:0:1
- id: real_time
  name: Real Time
  description: Mean of official throughput, response-latency, and physical-time metrics available for each suite.
  higher_is_better: true
  leaderboard_key: real_time
  aggregator: mean
  output_unit: rate
  normalizer: identity:0:1
runner:
  normalization:
    pass_generated_artifact_dir: true
  official_script: worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/run_worldatlas_arena_official_runner.py
  workspace:
    module: worldfoundry.evaluation.tasks.execution.runners.worldatlas_arena.run_worldatlas_arena_official_runner
    generated_arg: --generated-artifact-dir
    dataset_manifest_arg: --manifest
    limit_arg: --limit
    model_arg: --model-name
    supports_official_runtime: true
    accepts_generated_artifacts: true
    supports_fixture: true
    default_metrics: [long_sequence, action_control, consistency_3d_4d, physics, quality, real_time]
    input_kind: worldatlas_arena_manifest_predictions_or_official_report
  runner_target: worldfoundry.evaluation.tasks.contracts.external:WorldAtlasArenaContract
  validation_command:
  - worldfoundry-eval
  - zoo
  - benchmark-run
  - --benchmark-id
  - worldatlas-arena
  - --mode
  - official-validation
  - --official-results-path
  - <worldatlas_arena_report_dir_or_summary.json>
  - --output-dir
  - <out>
  - --json
  run_command:
  - python
  - worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/run_worldatlas_arena_official_runner.py
  - --run-official
  - --manifest
  - <worldarena_manifest.jsonl>
  - --generated-artifact-dir
  - <predictions_root>
  - --output-dir
  - <out>
  - --json
  expected_artifacts:
  - scorecard.json
  - raw_metric_table.jsonl
  - per_sample_scores.jsonl
  - benchmark_contract.json
  runtime:
    kind: in_tree_official_runtime
    root: worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena
    runtime_root: worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/runtime/worldatlas_arena
    repo_url: https://github.com/OpenEnvision/WorldArena.git
    repo_revision: 1ffc3a9564215471b9c39f602a66843e0183dcd1
    root_env: WORLDFOUNDRY_WORLDATLAS_ARENA_ROOT
    results_path_env: WORLDFOUNDRY_WORLDATLAS_ARENA_RESULTS_PATH
    manifest_env: WORLDFOUNDRY_WORLDATLAS_ARENA_MANIFEST
    generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
  verification_status: in_tree_runtime_cpu_contract_verified
integration:
  status: integrated
  tier: in_tree
  implementation_scope: vendored_official_evaluator_and_result_normalizer
  source_files_copied: true
  full_dataset_verified: false
  notes:
  - The OpenEnvision evaluator package and benchmark configuration are checked in under the runner runtime.
  - Existing per_dimension_summary.json and per_metric_summary.json reports can be normalized without a GPU.
  - Actual metric execution depends on the selected suite metrics and may require CUDA, model checkpoints,
    benchmark media, annotations, and optional third-party metric runtimes.
release_status: experimental
maturity: verified_runner
open_source_status: in_tree_runtime
official_benchmark_verified: false
integration_evidence: false
leaderboard_valid: false
requires:
- Official WorldAtlas Arena benchmark manifest and media for --run-official.
- Generated predictions matching upstream manifest prediction stems.
- Checkpoints and optional CUDA metric backends required by the selected metrics.
blockers:
- Full-suite official execution and leaderboard parity are not verified in this CPU-only workspace.
- Upstream defines a six-axis vector and no benchmark-wide scalar; WorldFoundry preserves that comparison contract.
data_refs:
  task_yaml: worldfoundry/data/benchmarks/tasks/external/worldatlas-arena.yaml
  fixture: worldfoundry/data/benchmarks/assets/worldatlas-arena/sample_results.json
  in_tree_runtime_paths:
  - worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena
runner_availability:
  available: true
  runner_target: worldfoundry.evaluation.tasks.contracts.external:WorldAtlasArenaContract
  runner_script_available: true
  task_yaml_available: true
  runtime_verified: false
  normalizer_verified: true
  surface: worldatlas_arena_official_in_tree
checkpoint_refs: []
optional_base_model_dependencies:
- video_world_perception_stack
validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id worldatlas-arena --mode official-validation
  --official-results-path <worldatlas_arena_report_dir_or_summary.json> --output-dir <out> --json
artifact_layout:
  generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
  output_artifact: benchmark_scorecard
  filename_template: scorecard.json
dataset:
  not_applicable: true
  reason: Upstream benchmark media and manifests are caller-provided local assets rather than a declared public dataset artifact.
