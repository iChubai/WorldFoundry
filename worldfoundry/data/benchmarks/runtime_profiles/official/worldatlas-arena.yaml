benchmark_ids:
- worldatlas-arena
id: worldatlas-arena
name: WorldArena (WorldAtlas Arena)
environment_id: worldfoundry-unified-cu128
needs_new_env: false
status: in_tree_official_runtime_full_suite_pending
notes:
- Result normalization of upstream per-dimension or per-metric summaries is CPU-only and needs no benchmark media.
- --run-official executes the vendored OpenEnvision evaluator without an external checkout.
- Metric execution may require CUDA, benchmark media, annotations, checkpoints, and optional third-party runtimes.
- Every mutable upstream cache, runtime config, log, and report is redirected below --output-dir.
python_path: ${WORLDFOUNDRY_UNIFIED_PYTHON:-python}
pythonpath_roots:
- .
- worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/runtime/worldatlas_arena
required_assets:
  in_tree_runtime_paths:
  - worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena
  - worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/runtime/worldatlas_arena
  task_yaml: worldfoundry/data/benchmarks/tasks/external/worldatlas-arena.yaml
  fixture: worldfoundry/data/benchmarks/assets/worldatlas-arena/sample_results.json
required_env: []
optional_env:
- WORLDFOUNDRY_WORLDATLAS_ARENA_ROOT
- WORLDFOUNDRY_WORLDATLAS_ARENA_RESULTS_PATH
- WORLDFOUNDRY_WORLDATLAS_ARENA_MANIFEST
- WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
- WORLDARENA_CHECKPOINT_ROOT
- HF_HOME
- TORCH_HOME
required_paths:
- id: official_runner_script
  path: worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/run_worldatlas_arena_official_runner.py
- id: vendored_official_package
  path: worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/runtime/worldatlas_arena/worldarena/benchmark/runner.py
- id: vendored_official_config
  path: worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/runtime/worldatlas_arena/config/benchmark.yaml
- id: task_yaml
  path: worldfoundry/data/benchmarks/tasks/external/worldatlas-arena.yaml
requires_cuda_visibility: false
required_imports:
- yaml
optional_imports:
- numpy
- torch
- cv2
- av
optional_base_model_dependencies:
- video_world_perception_stack
validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id worldatlas-arena --mode official-validation
  --official-results-path <worldatlas_arena_report_dir_or_summary.json> --output-dir <out> --json
