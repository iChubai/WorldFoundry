benchmark: worldatlas-arena
name: WorldArena (WorldAtlas Arena)
description: Six-axis evaluation of generated world-model rollouts across static, dynamic, long-horizon, and interactive suites.
tags:
- benchmark-zoo
- external-official
- world-model
- video-generation
- long-horizon
splits:
- standard
metrics:
  long_sequence: {aggregation: mean}
  action_control: {aggregation: mean}
  consistency_3d_4d: {aggregation: mean}
  physics: {aggregation: mean}
  quality: {aggregation: mean}
  real_time: {aggregation: mean}
metadata:
  source_kind: benchmark_zoo
  benchmark_id: worldatlas-arena
  official_runner_target: worldfoundry.evaluation.tasks.contracts.external:WorldAtlasArenaContract
  official_runner_script: worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/run_worldatlas_arena_official_runner.py
  contract_validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id worldatlas-arena --mode contract
    --output-dir tmp/benchmark_zoo/benchmark_contract/worldatlas-arena --json
  validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id worldatlas-arena --mode official-validation
    --official-results-path <worldatlas_arena_report_dir_or_summary.json> --output-dir <out> --json
  checkpoint_refs: []
  optional_base_model_dependencies:
  - video_world_perception_stack
  runtime:
    kind: in_tree_official_runtime
    root: worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena
    runtime_root: worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/runtime/worldatlas_arena
    root_env: WORLDFOUNDRY_WORLDATLAS_ARENA_ROOT
    results_path_env: WORLDFOUNDRY_WORLDATLAS_ARENA_RESULTS_PATH
    manifest_env: WORLDFOUNDRY_WORLDATLAS_ARENA_MANIFEST
  release_status: experimental
  maturity: verified_runner
  open_source_status: in_tree_runtime
  official_benchmark_verified: false
  integration_evidence: false
  leaderboard_valid: false
  requires:
  - Official benchmark manifest, media, and generated predictions for evaluator execution.
  - Checkpoints and optional CUDA backends required by the selected upstream metrics.
  blockers:
  - Full-suite official execution and leaderboard parity are unverified in this workspace.
  data_refs:
    task_yaml: worldfoundry/data/benchmarks/tasks/external/worldatlas-arena.yaml
    fixture: worldfoundry/data/benchmarks/assets/worldatlas-arena/sample_results.json
  artifact_layout:
    generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
    output_artifact: benchmark_scorecard
    filename_template: scorecard.json
  runner_availability:
    available: true
    runner_target: worldfoundry.evaluation.tasks.contracts.external:WorldAtlasArenaContract
    runner_script_available: true
    task_yaml_available: true
    runtime_verified: false
    normalizer_verified: true
    surface: worldatlas_arena_official_in_tree
tasks:
  worldatlas_arena_standard:
    benchmark_name: worldatlas-arena
    protocol: external_official_benchmark
    capability_track: video_world_model
    schema_type: generated_artifact_set
    input_keys:
    - benchmark_manifest
    - generated_video
    output_keys:
    - scorecard
    - raw_metric_table
    - per_sample_scores
    metric_ids:
    - long_sequence
    - action_control
    - consistency_3d_4d
    - physics
    - quality
    - real_time
    tags:
    - benchmark-zoo
    - external-official
    - worldatlas-arena
    metadata:
      source_kind: benchmark_zoo
      benchmark_id: worldatlas-arena
      official_benchmark_verified: false
      integration_evidence: false
      leaderboard_valid: false
    dataset:
      status: official_local_assets_required
      source: caller_provided
    runtime_requirements:
      generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
      results_path_env: WORLDFOUNDRY_WORLDATLAS_ARENA_RESULTS_PATH
      manifest_env: WORLDFOUNDRY_WORLDATLAS_ARENA_MANIFEST
    artifact_contract:
      required:
        generated_video:
          kind: video
        benchmark_manifest:
          kind: jsonl
    evaluation_protocol:
    - name: in_tree_official_runtime
      metric_ids:
      - long_sequence
      - action_control
      - consistency_3d_4d
      - physics
      - quality
      - real_time
      runner_target: worldfoundry.evaluation.tasks.contracts.external:WorldAtlasArenaContract
      runner_script: worldfoundry/evaluation/tasks/execution/runners/worldatlas_arena/run_worldatlas_arena_official_runner.py
