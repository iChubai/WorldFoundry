id: sora2
name: Sora2
tasks:
- text-to-video
- image-to-video
- hosted-api
provider: api
source:
  status: api
  official_repo_url: https://openai.com/sora/
official_sources:
  project_page: https://openai.com/sora/
integration:
  status: integrated
  notes:
  - Hosted API Studio pipeline is available; users must provide their own provider
    API key.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: sora2
runner_parity:
  status: not_applicable
demo_parity:
  status: not_applicable
docs:
  publisher: OpenAI
  publisher_kind: company
  publisher_zh: OpenAI
  overview: Sora2 is the catalog entry for OpenAI's Sora 2 hosted video model, recorded
    for text-to-video and image-to-video. Prompts are submitted to OpenAI's API and
    the generated clips are stored as standard WorldFoundry artifacts, letting Sora
    2 output be evaluated with the same tooling as any local model in this repository.
    WorldFoundry does not, and cannot, run Sora locally — the entry records only the
    hosted integration.
  overview_zh: Sora2 是 OpenAI Sora 2 托管视频模型在本 catalog 中的条目，记录了文生视频与图生视频任务。提示词提交给 OpenAI
    的 API，生成的视频以标准 WorldFoundry 产物保存，使 Sora 2 的输出能够用与仓库内本地模型相同的工具链来评测。WorldFoundry
    不会（也无法）在本地运行 Sora——该条目仅记录托管集成。
  architecture: OpenAI has publicly described the original Sora as a diffusion transformer
    operating on spacetime patches of video latents; beyond that public statement,
    no architecture, scale, or training details for Sora 2 are disclosed, and this
    repository records none.
  architecture_zh: OpenAI 曾公开将初代 Sora 描述为在视频潜空间时空 patch 上运行的扩散 Transformer；除这一公开表述外，Sora
    2 的架构、规模与训练细节均未披露，本仓库亦未记录。
  usage_notes: 'The catalog marks this entry as integrated: the hosted-API Studio
    pipeline is available, but you must supply your own provider API key and account.
    No weights are downloaded and no GPU environment is provisioned locally — generation
    happens on the provider side, so cost, quota, and content policy follow your provider
    account. Access requires an OpenAI account with Sora API availability in your
    region and tier.'
  usage_notes_zh: Catalog 将该条目标记为 integrated：托管 API 的 Studio pipeline 已可用，但你必须自备服务方的
    API key 与账号。本地不会下载任何权重、也不会创建 GPU 环境——生成在服务方完成，费用、配额与内容政策均以你的服务方账号为准。使用前需确认你的 OpenAI
    账号在所在地区与订阅层级下拥有 Sora API 权限。
  limitations:
  - Requires a paid provider account and API key; WorldFoundry does not ship credentials.
  - The provider controls model versioning, so outputs can change over time without
    any change in this repository — the manifest records runner parity as not applicable
    for this reason.
  - No local weights, no offline mode, and no reproducibility pinning beyond the request
    parameters WorldFoundry stores.
  - Sora API access is region- and tier-gated by OpenAI; availability is outside this
    repository's control.
  limitations_zh:
  - 需要付费的服务方账号与 API key；WorldFoundry 不提供任何凭据。
  - 模型版本由服务方控制，输出可能随时间变化而与本仓库无关——因此 manifest 将 runner parity 记录为 not applicable。
  - 没有本地权重、不支持离线运行；除 WorldFoundry 保存的请求参数外，无法进一步固定可复现性。
  - Sora API 的访问受 OpenAI 的地区与层级限制，可用性不受本仓库控制。
  recommended_benchmarks:
  - id: vbench
    reason: Standard multi-dimension quality suite for comparing hosted text/image-to-video
      outputs.
    reason_zh: 对比托管文/图生视频输出的标准多维质量评测。
  - id: physics-iq
    reason: Probes whether provider-side video models respect basic physical plausibility.
    reason_zh: 检验服务方视频模型是否遵循基本物理合理性。
