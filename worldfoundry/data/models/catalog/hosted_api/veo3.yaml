docs:
  publisher: Google DeepMind
  publisher_kind: company
  publisher_zh: Google DeepMind
  overview: Veo3 is Google DeepMind's Veo 3 hosted video model for text-to-video and image-to-video. WorldFoundry submits generation requests through Google's API and collects the rendered clips as artifacts, so Veo 3 results can be lined up against open models in the same evaluation harness. The model itself never leaves Google's infrastructure.
  overview_zh: Veo3 是 Google DeepMind 的 Veo 3 托管视频模型，支持文生视频与图生视频。WorldFoundry 通过 Google 的 API 提交生成请求并把渲染结果收为产物，使 Veo 3 的结果可以与开源模型在同一套评测框架下对比。模型本体始终运行在 Google 的基础设施上。
  architecture: 'This is a hosted, provider-operated model: the vendor has not published its architecture, parameter count, or training recipe. WorldFoundry provides a Studio pipeline that submits requests to the provider endpoint and collects the returned video artifacts.'
  architecture_zh: 这是由服务方托管运行的模型：厂商未公开其架构、参数规模或训练细节。WorldFoundry 提供一条 Studio pipeline，向服务方端点提交请求并回收生成的视频产物。
  usage_notes: Supply your own provider API key and account. No weights are downloaded and no GPU environment is provisioned locally — generation happens on the provider side, so cost, quota, and content policy follow your provider account. Veo access is provisioned through Google's AI developer offerings (e.g. the Gemini API); regional availability applies.
  usage_notes_zh: 你需要自备服务方的 API key 与账号。本地不会下载任何权重、也不会创建 GPU 环境——生成在服务方完成，费用、配额与内容政策均以你的服务方账号为准。Veo 的访问通过 Google 的 AI 开发者产品（如 Gemini API）开通，并受地区可用性限制。
  limitations:
  - Requires a paid provider account and API key; WorldFoundry does not ship credentials.
  - The provider controls model versioning, so outputs can change over time without any change on the WorldFoundry side.
  - No local weights, no offline mode, and no reproducibility pinning beyond the request parameters WorldFoundry stores.
  limitations_zh:
  - 需要付费的服务方账号与 API key；WorldFoundry 不提供任何凭据。
  - 模型版本由服务方控制，即使 WorldFoundry 侧没有任何改动，输出也可能随时间变化。
  - 没有本地权重、不支持离线运行；除 WorldFoundry 保存的请求参数外，无法进一步固定可复现性。
  recommended_benchmarks:
  - id: vbench
    reason: Standard multi-dimension quality suite for comparing hosted text/image-to-video
      outputs.
    reason_zh: 对比托管文/图生视频输出的标准多维质量评测。
  - id: physics-iq
    reason: Probes whether provider-side video models respect basic physical plausibility.
    reason_zh: 检验服务方视频模型是否遵循基本物理合理性。
