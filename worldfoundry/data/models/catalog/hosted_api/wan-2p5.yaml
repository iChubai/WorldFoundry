docs:
  publisher: Alibaba (Tongyi Lab)
  publisher_kind: company
  publisher_zh: 阿里巴巴（通义实验室）
  overview: "Wan 2.5 API is the hosted DashScope endpoint for Alibaba's Wan 2.5 video generation model, for text-to-video and image-to-video. Unlike the open-weight Wan releases that WorldFoundry runs locally, it uses the provider-hosted generation path: requests go to Alibaba Cloud DashScope and finished clips come back as artifacts. Aliases wan2.5 and wan-2.5 also resolve to this model."
  overview_zh: Wan 2.5 API 是阿里巴巴通义万相 Wan 2.5 视频生成模型的 DashScope 托管接入点，支持文生视频与图生视频。与 WorldFoundry 本地运行的开源 Wan 权重不同，它走服务方托管的生成路径：请求发往阿里云 DashScope，成片以产物形式返回。别名 wan2.5、wan-2.5 同样解析到该模型。
  architecture: The hosted Wan 2.5 shares the Wan family lineage (diffusion-transformer video generation developed by Alibaba's Tongyi Lab), but Alibaba has not published the exact architecture or scale of the API-served revision.
  architecture_zh: 托管版 Wan 2.5 属于 Wan 系列（阿里通义实验室研发的扩散 Transformer 视频生成模型），但 API 所服务修订版的确切架构与规模并未公开。
  usage_notes: Supply your own provider API key and account. No weights are downloaded and no GPU environment is provisioned locally — generation happens on the provider side, so cost, quota, and content policy follow your provider account. Keys are issued via Alibaba Cloud DashScope (dashscope.aliyun.com).
  usage_notes_zh: 你需要自备服务方的 API key 与账号。本地不会下载任何权重、也不会创建 GPU 环境——生成在服务方完成，费用、配额与内容政策均以你的服务方账号为准。API key 通过阿里云 DashScope（dashscope.aliyun.com）开通。
  limitations:
  - Requires a paid provider account and API key; WorldFoundry does not ship credentials.
  - The provider controls model versioning, so outputs can change over time without any change on the WorldFoundry side.
  - No local weights, no offline mode, and no reproducibility pinning beyond the request parameters WorldFoundry stores.
  limitations_zh:
  - 需要付费的服务方账号与 API key；WorldFoundry 不提供任何凭据。
  - 模型版本由服务方控制，即使 WorldFoundry 侧没有任何改动，输出也可能随时间变化。
  - 没有本地权重、不支持离线运行；除 WorldFoundry 保存的请求参数外，无法进一步固定可复现性。
  recommended_benchmarks:
  - id: vbench
    reason: Standard multi-dimension quality suite for comparing hosted text/image-to-video
      outputs.
    reason_zh: 对比托管文/图生视频输出的标准多维质量评测。
  - id: physics-iq
    reason: Probes whether provider-side video models respect basic physical plausibility.
    reason_zh: 检验服务方视频模型是否遵循基本物理合理性。
