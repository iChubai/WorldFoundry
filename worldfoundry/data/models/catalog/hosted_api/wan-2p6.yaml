id: wan-2p6
name: Wan 2.6 API
aliases:
- wan2.6
- wan-2.6
tasks:
- image-to-video
- hosted-api
provider: api
source:
  status: api
  official_repo_url: https://dashscope.aliyun.com/
official_sources:
  project_page: https://dashscope.aliyun.com/
integration:
  status: integrated
  notes:
  - Hosted DashScope API Studio pipeline is available; users must provide their own
    provider API key.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: wan-2p6
