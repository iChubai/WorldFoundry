docs:
  publisher: UC Berkeley
  publisher_kind: university
  publisher_zh: 加州大学伯克利分校（UC Berkeley）
  overview: 'CUT3R is a continuous 3D perception model with persistent state: it ingests a stream of images and continuously updates a metric-scale 3D reconstruction, without offline bundling. WorldFoundry provides an in-tree point-cloud export route and a two-stage 3DGS route, both available in Studio. CUT3R also serves as the geometry backbone for VMem.'
  overview_zh: CUT3R 是带持久状态的连续 3D 感知模型：接收图像流并持续更新米制尺度的 3D 重建，无需离线捆绑优化。WorldFoundry 提供树内点云导出与两段式 3DGS 两条路径，均可在 Studio 中使用。CUT3R 同时是 VMem 的几何主干。
  architecture: A recurrent transformer maintains a persistent scene state; each new frame updates the state and outputs pointmaps and camera parameters online (per the upstream publication). WorldFoundry exposes raw point-cloud export and a two-stage 3DGS pipeline; weights are apache-2.0.
  architecture_zh: 循环 Transformer 维护持久场景状态；每帧新图像更新状态并在线输出点图与相机参数（见上游论文）。WorldFoundry 提供点云导出与两段式 3DGS pipeline；权重为 apache-2.0。
  usage_notes: Stage the `liguang0115/cut3r` weights locally or from Hugging Face before submitting Studio jobs.
  usage_notes_zh: 提交 Studio 任务前，先在本地或从 Hugging Face 就位 `liguang0115/cut3r` 权重。
  limitations:
  - Streaming reconstruction quality degrades on long sequences with severe viewpoint changes.
  limitations_zh:
  - 长序列且视角剧烈变化时，流式重建质量会下降。
