docs:
  publisher: Insta360 (Research Team)
  publisher_kind: company
  publisher_zh: 影石 Insta360（研究团队）
  overview: Depth Any Panoramas (DAP) is Insta360's metric depth estimator for panoramic images — full 360° depth from a single equirectangular input. WorldFoundry runs it as a geometry prior with the Insta360-Research/DAP-weights checkpoint.
  overview_zh: Depth Any Panoramas（DAP）是影石 Insta360 面向全景图像的米制深度估计器，从单张等距柱状投影图得到完整 360° 深度。WorldFoundry 将它作为几何先验运行，使用 Insta360-Research/DAP-weights checkpoint。
  architecture: 'A Depth-Anything-family model adapted to panoramic inputs and metric output: a DINOv3-Large backbone with a DPT-style decoder, a dense metric depth head, and a range-mask head for pixels beyond a confident distance.'
  architecture_zh: 基于 Depth-Anything 系模型，适配全景输入与米制输出：DINOv3-Large 骨干配 DPT 风格解码器，带稠密米制深度头，以及标出超出可信距离像素的 range-mask 头。
  usage_notes: Feed one equirectangular image; the pipeline writes metric depth to dap-depth.npz. ViPE uses DAP as a shared geometry prior. Runner parity passed through the shared geometry-prior pipeline.
  usage_notes_zh: 输入一张等距柱状投影图，pipeline 将米制深度写入 dap-depth.npz。ViPE 将 DAP 作为共享几何先验使用。runner parity 已通过共享 geometry-prior pipeline 验证。
  limitations:
  - 'Panoramic-specific: for ordinary pinhole images use the Depth Anything V2/V3 priors instead.'
  - Metric accuracy depends on scene scale cues; extreme scenes can drift.
  limitations_zh:
  - 专为全景设计：普通针孔图像请改用 Depth Anything V2/V3 先验。
  - 米制精度依赖场景尺度线索；极端场景可能漂移。
