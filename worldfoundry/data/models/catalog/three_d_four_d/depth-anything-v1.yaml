docs:
  publisher: TikTok / The University of Hong Kong
  publisher_kind: company
  publisher_zh: TikTok / 香港大学
  overview: Depth Anything V1 is the foundation model for relative monocular depth that popularized large-scale unlabeled-data depth training. The in-tree pipeline exports relative depth and geometry artifacts; the Studio route is validated to produce a nonblank depth map.
  overview_zh: Depth Anything V1 是让「大规模无标注数据训练深度」流行起来的相对单目深度基础模型。树内 pipeline 导出相对深度与几何产物；Studio 路径已验证可产出非空深度图。
  architecture: A DINOv2 ViT backbone with a DPT-style depth head, trained on ~62M unlabeled images with a teacher-student scheme (per the publication). It predicts relative depth; metric depth comes from the separate *-prior models.
  architecture_zh: DINOv2 ViT 主干加 DPT 式深度头，用约 6200 万张无标注图像以师生方案训练（见论文）。它输出相对深度；米制深度由独立的 *-prior 模型提供。
  usage_notes: A good default for relative depth. For metric depth choose depth-anything-v2-prior or depth-anything-v3-prior instead.
  usage_notes_zh: 相对深度的默认选择。需要米制深度时请改用 depth-anything-v2-prior 或 depth-anything-v3-prior。
  limitations:
  - Relative depth only — no metric scale on this route.
  - 'Single-image estimation: temporal flicker on video (use video-depth-anything-prior for video).'
  limitations_zh:
  - 仅相对深度——该路径没有米制尺度。
  - 单帧估计：视频上会闪烁（视频请用 video-depth-anything-prior）。
