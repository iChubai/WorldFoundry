id: depth-anything-v2-prior
name: Depth Anything V2 Prior
aliases:
- dav2-prior
- depth-anything-v2
tasks:
- monocular-depth-estimation
- metric-depth-estimation
- geometry-prior
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/DepthAnything/Depth-Anything-V2
  license: apache-2.0
checkpoint_refs:
- repo_id: depth-anything/Depth-Anything-V2-Large
  filename: depth_anything_v2_vitl.pth
official_sources:
  project_page: https://depth-anything-v2.github.io/
  paper: https://arxiv.org/abs/2406.09414
integration:
  kind: pipeline_runner
  status: integrated
  notes:
  - Integrated as an independent depth prior at worldfoundry/base_models/three_dimensions/depth/depth_anything/depth_anything_v2.
  - The shared priors factory and video-depth prior reuse this implementation; it
    is not a VIPE-owned subtree.
  - Exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.
base_model_target: worldfoundry.base_models.three_dimensions.depth.depth_anything.depth_anything_v2
runtime_profile: runtime-profile:depth-anything-v2-prior
runner_parity:
  status: verified
  notes:
  - Checkpoint-backed inference is implemented through the shared geometry-prior
    pipeline/operator contract.
  - Per-run validation evidence is tracked outside the model catalog so this file
    remains stable release metadata.
catalog_category: three_d_four_d
catalog_scope: Independent geometric prior integrations used by 3D and world-model
  runtimes.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
docs:
  publisher: TikTok / The University of Hong Kong
  publisher_kind: company
  publisher_zh: TikTok / 香港大学
  overview: Depth Anything V2 is the sharper, synthetic-data-trained successor to V1, used in WorldFoundry as a monocular and metric depth prior. It loads the depth-anything/Depth-Anything-V2-Large checkpoint.
  overview_zh: Depth Anything V2 是 V1 的后继者，用合成数据训练、细节更锐利，在 WorldFoundry 中用作单目/米制深度先验。它加载 depth-anything/Depth-Anything-V2-Large checkpoint。
  architecture: Same DINOv2+DPT family as V1 but trained on precise synthetic labels with pseudo-labeled real images, improving edges and thin structures (per the publication).
  architecture_zh: 与 V1 同为 DINOv2+DPT 家族，但用精确合成标注加伪标注真实图像训练，边缘与细结构更好（见论文）。
  usage_notes: Pass one image as input_path; the run writes the depth prediction to depth-anything-v2-prior.npz. Higher-level geometry pipelines such as ViPE use the same prior.
  usage_notes_zh: 通过 input_path 传入一张图像，运行后深度预测写入 depth-anything-v2-prior.npz。ViPE 等上层几何管线使用同一先验。
  limitations:
  - Metric accuracy varies by domain; indoor/outdoor calibration differs.
  - 'Single-image prior: it does not enforce temporal consistency across video frames.'
  limitations_zh:
  - 米制精度随领域变化；室内/室外标定不同。
  - 单帧先验：不保证视频帧间的时序一致性。
