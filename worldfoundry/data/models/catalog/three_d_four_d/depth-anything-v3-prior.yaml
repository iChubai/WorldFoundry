docs:
  publisher: ByteDance (Seed)
  publisher_kind: company
  publisher_zh: 字节跳动（Seed 团队）
  overview: Depth Anything 3 Metric Prior is the metric-depth head of ByteDance Seed's Depth Anything 3, packaged as a standalone geometry prior. It uses the depth-anything/DA3METRIC-LARGE checkpoint, and the Prior-Depth-Anything refiner is validated on its output.
  overview_zh: Depth Anything 3 Metric Prior 是字节 Seed 团队 Depth Anything 3 的米制深度头，以独立几何先验的形式提供。它使用 depth-anything/DA3METRIC-LARGE checkpoint，Prior-Depth-Anything 细化器即以它的输出为条件完成验证。
  architecture: DA3 scales the Depth Anything recipe and adds metric and geometry heads. This prior runs only the metric-large checkpoint.
  architecture_zh: DA3 扩展了 Depth Anything 的训练配方并增加米制与几何头。该先验只运行 metric-large checkpoint。
  usage_notes: Use it as a metric-depth prior for other pipelines, such as ViPE, through the shared geometry-prior interface. For the official SOH export route, use depth-anything-v3.
  usage_notes_zh: 将它作为米制深度先验，通过共享的几何先验接口供其他管线（如 ViPE）使用。官方 SOH 导出路径请使用 depth-anything-v3。
  limitations:
  - 'Depth prior only: full DA3 reconstruction is provided by depth-anything-v3.'
  - Metric scale can drift in unusual focal-length imagery.
  limitations_zh:
  - 仅提供深度先验：完整的 DA3 重建请使用 depth-anything-v3。
  - 非常规焦距图像下米制尺度可能漂移。
