docs:
  publisher: NAVER Labs Europe
  publisher_kind: company
  publisher_zh: NAVER 欧洲实验室（NAVER Labs Europe）
  overview: 'DUSt3R Base Model pins the official DUSt3R base checkpoint for use as a geometry prior through the shared geometry-prior contract. Validated with the official base checkpoint: it reconstructs a finite 10,000-point cloud from two views.'
  overview_zh: DUSt3R Base Model 固定官方 DUSt3R 基础 checkpoint，通过共享的 geometry-prior 契约作为几何先验使用。已用官方基础 checkpoint 验证：可从两个视图重建出 10,000 点的有限点云。
  architecture: Same architecture as DUSt3R (ViT pointmap regressor), with the base checkpoint pinned.
  architecture_zh: 与 DUSt3R 同架构（ViT 点图回归器），固定使用基础 checkpoint。
  usage_notes: Higher-level pipelines such as ViPE use it through the shared geometry-prior pipeline/operator contract. Use this profile id when configuring the prior explicitly; cite DUSt3R for provenance.
  usage_notes_zh: 上层管线（如 ViPE）通过共享的 geometry-prior pipeline/operator 契约使用它。显式配置该先验时使用此 profile id；溯源请引用 DUSt3R。
  limitations:
  - CC-BY-NC-SA-4.0 license applies (inherited from upstream).
  - Not a standalone runner — always consumed through the geometry-prior contract.
  limitations_zh:
  - 继承上游的 CC-BY-NC-SA-4.0 许可。
  - 不是独立 runner——始终通过 geometry-prior 契约调用。
