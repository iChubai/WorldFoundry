docs:
  publisher: NAVER Labs Europe
  publisher_kind: company
  publisher_zh: NAVER 欧洲实验室（NAVER Labs Europe）
  overview: 'DUSt3R made unconstrained two-view 3D reconstruction easy: feed it two images — no calibration, no poses — and it directly regresses aligned pointmaps. Validated with the released checkpoint: Studio inference produces a finite point cloud from the bundled multi-view test case.'
  overview_zh: DUSt3R 让无约束双视图 3D 重建变得简单：给它两张图——无需标定、无需位姿——直接回归对齐的点图。已用发布的 checkpoint 验证：Studio 推理从内置多视图测试用例产出有限点云。
  architecture: A ViT encoder-decoder that regresses per-pixel 3D pointmaps in a shared frame for an image pair; global alignment merges pairs into scenes (per arXiv 2312.14132). WorldFoundry runs it through the shared geometry-prior pipeline.
  architecture_zh: ViT 编码-解码器为一对图像在共享坐标系中回归逐像素 3D 点图；全局对齐把多对合并为场景（见 arXiv 2312.14132）。WorldFoundry 通过共享 geometry-prior pipeline 运行它。
  usage_notes: Stage the naver/DUSt3R_ViTLarge_BaseDecoder_512_dpt checkpoint at $WORLDFOUNDRY_CKPT_DIR/DUSt3R_ViTLarge_BaseDecoder_512_dpt.pth, then pass an uncalibrated image pair or multi-view set as image.
  usage_notes_zh: 先把 naver/DUSt3R_ViTLarge_BaseDecoder_512_dpt checkpoint 就位到 $WORLDFOUNDRY_CKPT_DIR/DUSt3R_ViTLarge_BaseDecoder_512_dpt.pth，再以 image 传入未标定的一对图像或多视图图像集。
  limitations:
  - 'CC-BY-NC-SA-4.0 license: non-commercial terms apply downstream.'
  - 'Pairwise design: large scenes need global alignment, which grows costly with many views.'
  limitations_zh:
  - CC-BY-NC-SA-4.0 许可：下游需遵守非商用条款。
  - 两两配对设计：大场景需要全局对齐，视图很多时代价上升。
