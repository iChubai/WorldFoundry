integration:
  kind: pipeline_runner
  status: integrated
  notes:
  - Runtime source is externalized from the public release tree; checkpoints remain
    external assets.
  - DVLTSynthesis provides a lazy WorldFoundry wrapper that runs the external DVLT
    GLB export path when CUDA, dependencies, source, inputs, and weights are
    available locally.
runtime_profile: runtime-profile:dvlt
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: dvlt
runner_parity:
  status: pending
  notes:
  - Runner registration is wired; GPU parity is pending checkpoint and environment
    validation.
catalog_category: three_d_four_d
catalog_scope: 3D Gaussian-splatting catalog entries. Integrated entries expose in-tree
  WorldFoundry runtimes; externalized entries retain upstream provenance and runner glue
  without bundling license-gated source.
docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: 'Déjà View Looping Transformer (DVLT) is an NVIDIA multi-view reconstruction model covering 3D reconstruction, camera pose estimation, and depth from image collections, exporting GLB scenes. The WorldFoundry wrapper is lazy: it runs the external DVLT GLB export path only when CUDA, dependencies, source, inputs, and weights are all staged locally.'
  overview_zh: Déjà View Looping Transformer（DVLT）是英伟达的多视图重建模型，覆盖 3D 重建、相机位姿估计与深度估计，输出 GLB 场景。WorldFoundry 的封装是惰性的：仅当 CUDA、依赖、源码、输入与权重全部本地就位时，才运行外部 DVLT 的 GLB 导出路径。
  architecture: DVLT uses a looping-transformer design for multi-view geometry (paper arXiv 2605.30215).
  architecture_zh: DVLT 采用面向多视图几何的 looping-transformer 设计（论文 arXiv 2605.30215）。
  usage_notes: Stage a local DVLT source checkout, its dependencies, and the `nvidia/dvlt` checkpoint before running; DVLTSynthesis fails fast when a prerequisite is missing. Check the NVIDIA non-commercial research/evaluation license terms before use.
  usage_notes_zh: 运行前先在本地就位 DVLT 源码 checkout、其依赖与 `nvidia/dvlt` checkpoint；缺少任一前置条件时 DVLTSynthesis 会快速失败。使用前请核对英伟达非商用研究/评估许可条款。
  limitations:
  - Checkpoint license is NVIDIA non-commercial research/evaluation only.
  - The upstream DVLT runtime source is not part of WorldFoundry; you stage it yourself.
  limitations_zh:
  - checkpoint 许可仅限英伟达非商用研究/评估用途。
  - 上游 DVLT 运行时源码不随 WorldFoundry 发布，需要自行就位。
