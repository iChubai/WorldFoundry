docs:
  publisher: ETH Zurich (CVG)
  publisher_kind: university
  publisher_zh: 苏黎世联邦理工学院（CVG 组）
  overview: GeoCalib estimates camera calibration and the gravity direction from a single image by combining geometric optimization with deep learning. WorldFoundry exposes it as a camera-calibration prior that higher-level pipelines, notably ViPE, consume through the shared geometry-prior contract.
  overview_zh: GeoCalib 通过几何优化与深度学习结合，从单张图像估计相机标定与重力方向。WorldFoundry 将它作为相机标定先验提供，上层管线（尤其是 ViPE）通过共享 geometry-prior 契约调用。
  architecture: A neural network predicts geometric cues which a differentiable optimization layer turns into focal length and gravity estimates (per the upstream ECCV 2024 release). The official code is apache-2.0.
  architecture_zh: 神经网络预测几何线索，可微优化层将其转化为焦距与重力估计（见上游 ECCV 2024 发布）。官方代码为 apache-2.0。
  usage_notes: Stage the official geocalib-pinhole.tar weights from the v1.0 GitHub release. Run it directly through the geometry-prior pipeline, or let ViPE call it as its calibration prior.
  usage_notes_zh: 请就位官方 GitHub v1.0 发布的 geocalib-pinhole.tar 权重。可直接通过 geometry-prior pipeline 运行，也可由 ViPE 作为标定先验调用。
  limitations:
  - 'Single-image estimation: degrades on images without clear geometric cues (e.g. pure sky or texture-less walls).'
  limitations_zh:
  - 单图估计：在缺乏几何线索的图像（如纯天空、无纹理墙面）上会退化。
