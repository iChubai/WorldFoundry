id: lagernvs
name: LagrNVS
aliases:
- lager-nvs
- facebook/lagernvs_general_512
- facebookresearch/lagernvs
tasks:
- novel-view-synthesis
- 3d-scene-rendering
- camera-path-rendering
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/facebookresearch/lagernvs
  license: fair-noncommercial-research-license
  requires_auth: true
  notes:
  - Upstream checkpoints are gated HuggingFace repositories.
checkpoint_refs:
- repo_id: facebook/lagernvs_general_512
  filename: model.pt
  requires_auth: true
  gated: true
official_sources:
  project_page: https://szymanowiczs.github.io/lagernvs
  paper: https://arxiv.org/abs/2603.20176
integration:
  kind: pipeline_runner
  status: integrated
  notes:
  - WorldFoundry exposes an in-tree adapter that runs the upstream LagrNVS minimal_inference.py command.
  - Missing HF_TOKEN/gated checkpoint access is reported at inference time.
runtime_profile: runtime-profile:lagernvs
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: lagernvs
runner_parity:
  status: pending
  notes:
  - Pipeline target imports and plan-only inference are wired; full artifact parity needs gated checkpoints and CUDA.
catalog_category: three_d_four_d
catalog_scope: 3D Gaussian-splatting catalog entries. Integrated entries expose in-tree WorldFoundry runtimes;
  metadata-only entries retain upstream provenance without runnable backends.
output_artifacts:
- generated_video
docs:
  publisher: Meta AI (FAIR)
  publisher_kind: company
  publisher_zh: Meta AI（FAIR）
  overview: LagrNVS is Meta's novel-view-synthesis model for rendering new camera paths through a scene (facebook/lagernvs_general_512). WorldFoundry runs the upstream minimal_inference.py command through an in-tree adapter. The checkpoint is gated on Hugging Face.
  overview_zh: LagrNVS 是 Meta 的新视角合成模型，用于沿新的相机路径渲染场景（facebook/lagernvs_general_512）。WorldFoundry 通过树内适配器运行上游 minimal_inference.py 命令。checkpoint 在 Hugging Face 上为 gated。
  architecture: A novel-view / camera-path rendering model at 512 resolution.
  architecture_zh: 512 分辨率的新视角/相机路径渲染模型。
  usage_notes: Running needs the gated checkpoint and a CUDA GPU. Accept the gated terms on Hugging Face and set HF_TOKEN before running.
  usage_notes_zh: 运行需要 gated checkpoint 与 CUDA GPU。运行前请先在 Hugging Face 接受 gated 条款并设置 HF_TOKEN。
  limitations:
  - Gated checkpoint under the FAIR non-commercial research license.
  limitations_zh:
  - checkpoint 为 gated，受 FAIR 非商用研究许可约束。
