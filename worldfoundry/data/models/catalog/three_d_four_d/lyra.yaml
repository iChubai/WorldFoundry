id: lyra
name: Lyra
aliases:
- Project Lyra
- Lyra 1.0
- Lyra 2.0
area: 3d_4d
task: open generative 3D and 4D world models
developer: NVIDIA Spatial Intelligence Lab
user_starred: true
official_sources:
  github: https://github.com/nv-tlabs/lyra
  project_page: https://research.nvidia.com/labs/sil/projects/lyra2/
  paper: https://openreview.net/forum?id=tIVCfVnIHo
availability:
  status: open_source
  open_source: true
  code: public
  weights: linked_from_repo
  license: Apache-2.0
integration:
  kind: pipeline_runner
  status: integrated
  notes:
  - WorldFoundry exposes in-tree Lyra-1 and Lyra-2 pipelines backed by vendored runtime adapters.
  - Default catalog runner targets Lyra-2; Lyra-1 remains available as an explicit variant.
confirmation: Official GitHub repo reports Apache-2.0 and describes official implementations of Lyra 1.0 and 2.0.
output_artifacts:
- generated_world
- generated_3d_asset
runtime_profile: runtime-profile:lyra
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: lyra
variants:
- id: lyra-1
  task: image-or-video-to-world-video
  provider: official_repo
  runtime_profile: runtime-profile:lyra-1
  runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
  pipeline_binding: lyra-1
  integration:
    status: verified
  runner_parity:
    status: verified
    notes:
    - The in-tree Lyra-1 runner supports the official static single-image SDG demo with local Lyra/Cosmos assets.
    - Per-run visual QA and artifact checks are tracked outside the model catalog.
- id: lyra-2
  task: action-conditioned-world-video
  provider: official_repo
  runtime_profile: runtime-profile:lyra-2
  runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
  pipeline_binding: lyra-2
  integration:
    status: verified
  runner_parity:
    status: verified
    notes:
    - The in-tree Lyra-2 runner supports the official ZoomGS single-image forward navigation demo with local Lyra-2.0 assets.
    - Per-run visual QA and artifact checks are tracked outside the model catalog.
runner_parity:
  status: verified
  notes:
  - Lyra-1 and Lyra-2 are wired through in-tree runners and unified environment profiles.
  - Per-run validation evidence is tracked outside the model catalog.
catalog_category: three_d_four_d
catalog_scope: Official-source manifest for 3D, 4D, and camera-controlled world/model generation projects.
catalog_policy:
  open_source_true_requires: An official GitHub or Hugging Face source with an explicit OSI-style software license or otherwise
    clearly open source/open weights metadata. Public code without a license is source-available, not open_source.
  weights_policy: Weights were not downloaded. Entries record only official repository, Hugging Face, project page, paper,
    and license metadata.
  status_values:
  - open_source
  - source_available
  - open_weights_restricted
  - api_or_closed
  - unknown
docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: "Lyra is NVIDIA's generative world model family for exploration: from an image or video (Lyra-1) or from actions (Lyra-2) it produces an explorable world video. Validated with local assets: Lyra-1 runs the official static single-image SDG demo and Lyra-2 the official ZoomGS single-image forward-navigation demo. The default runner uses Lyra-2."
  overview_zh: Lyra 是英伟达面向探索的生成式世界模型家族：Lyra-1 从图像或视频、Lyra-2 从动作输入生成可探索的世界视频。已用本地资产验证：Lyra-1 跑通官方静态单图 SDG demo，Lyra-2 跑通官方 ZoomGS 单图前向导航 demo。默认 runner 使用 Lyra-2。
  architecture: 'Lyra comes in two generations: Lyra-1 for image-or-video-to-world-video and Lyra-2 for action-conditioned world video (paper on OpenReview; project page at NVIDIA Research). Running either needs local Lyra checkpoints, text-encoder assets, DA3 (Depth Anything 3) assets, and CUDA dependencies.'
  architecture_zh: Lyra 有两代模型：Lyra-1 做图像/视频到世界视频，Lyra-2 做动作条件世界视频（论文见 OpenReview，项目页在 NVIDIA Research）。运行任一代都需要本地 Lyra checkpoint、文本编码器资产、DA3（Depth Anything 3）资产与 CUDA 依赖。
  usage_notes: 'Pick the variant by input: lyra-1 when you start from an image or video, lyra-2 when you drive the world with actions. The default runner resolves to Lyra-2. Stage all required assets before submitting Studio jobs.'
  usage_notes_zh: 按输入选 variant：从图像或视频出发用 lyra-1，用动作驱动世界用 lyra-2。默认 runner 解析到 Lyra-2。提交 Studio 任务前请就位所有所需资产。
  limitations:
  - Runtime execution needs several staged asset sets (Lyra checkpoints, text encoder, DA3, CUDA).
  limitations_zh:
  - 运行需要就位多套资产（Lyra checkpoint、文本编码器、DA3、CUDA）。
  recommended_benchmarks:
  - id: worldscore
    reason: Standard scoring for explorable generated worlds.
    reason_zh: 可探索生成世界的标准评分。
  - id: camerabench
    reason: Evaluates camera/viewpoint control quality during exploration.
    reason_zh: 评估探索过程中的相机/视角控制质量。
