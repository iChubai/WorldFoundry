docs:
  publisher: DJI / Zhejiang University
  publisher_kind: company
  publisher_zh: 大疆创新 / 浙江大学
  overview: Metric3D recovers metric-scale depth from a single image by normalizing images into a canonical camera space, which lets one model generalize across cameras. WorldFoundry uses it as a metric-depth prior, and it is the default metric-depth model in the ViPE SLAM configuration.
  overview_zh: Metric3D 通过把图像归一化到规范相机空间，从单张图像恢复米制尺度深度，使单一模型能够跨相机泛化。WorldFoundry 将其用作米制深度先验，它也是 ViPE SLAM 配置中的默认米制深度模型。
  architecture: Per the upstream publication (ICCV 2023), a canonical-camera transformation resolves the metric ambiguity of single-image depth. The checkpoint is JUGGHM/Metric3D under a bsd-2-clause license.
  architecture_zh: 按上游论文（ICCV 2023），规范相机变换消解了单图深度的米制歧义。checkpoint 为 JUGGHM/Metric3D，许可 bsd-2-clause。
  usage_notes: Pass one image as input_path and, when known, its focal_length; the run writes the depth prediction to metric3d-prior.npz.
  usage_notes_zh: 通过 input_path 传入一张图像，已知时同时传入 focal_length；运行后深度预测写入 metric3d-prior.npz。
  limitations:
  - Metric accuracy depends on camera-intrinsics quality; wrong intrinsics degrade the scale.
  - 'Single-image prior: it does not enforce temporal consistency across video frames.'
  limitations_zh:
  - 米制精度依赖相机内参质量；内参错误会破坏尺度。
  - 单帧先验：不保证视频帧间的时序一致性。
