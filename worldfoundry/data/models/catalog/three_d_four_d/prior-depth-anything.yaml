docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'Prior Depth Anything is a depth-completion prior: it takes any coarse or sparse metric-depth prior plus an image and refines them into a dense, sharper metric depth map. Validated with the official checkpoint: it refines a real Depth Anything 3 metric-depth condition.'
  overview_zh: Prior Depth Anything 是深度补全先验：接受任意粗糙或稀疏的米制深度先验加一张图像，将其细化为致密且更锐利的米制深度图。已用官方 checkpoint 验证：可对真实的 Depth Anything 3 米制深度条件完成细化。
  architecture: 'A prompt-conditioned depth-completion design: the model consumes prompt metric depth alongside the image (checkpoint `Rain729/Prior-Depth-Anything`, apache-2.0).'
  architecture_zh: 提示条件的深度补全设计：模型同时消费提示米制深度与图像（checkpoint 为 `Rain729/Prior-Depth-Anything`，apache-2.0）。
  usage_notes: It runs as an independent geometry prior through the shared geometry-prior pipeline/operator contract, so higher-level pipelines such as ViPE can use it. Pair it with a metric source (e.g. depth-anything-v3-prior) whose output it refines.
  usage_notes_zh: 它作为独立几何先验，通过共享的 geometry-prior pipeline/operator 契约运行，上层管线（如 ViPE）可直接使用。请与米制深度源（如 depth-anything-v3-prior）配对使用，由它细化该源的输出。
  limitations:
  - Needs a metric-depth condition as input — it refines priors rather than estimating from scratch.
  limitations_zh:
  - 需要米制深度条件作为输入——它细化先验而非从零估计。
