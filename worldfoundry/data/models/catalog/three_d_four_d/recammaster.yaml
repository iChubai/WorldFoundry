docs:
  publisher: Kuaishou (Kling Team)
  publisher_kind: company
  publisher_zh: 快手（可灵团队）
  overview: 'ReCamMaster re-renders an existing video along a new camera trajectory — camera-controlled generative rendering from a single video. Validated with local ReCamMaster and Wan2.1 assets: the runner reproduces the official camera-trajectory video-to-video demo.'
  overview_zh: ReCamMaster 让已有视频沿新的相机轨迹重新渲染，即从单个视频出发的相机可控生成式渲染。已使用本地 ReCamMaster 与 Wan2.1 资产验证：runner 复现官方相机轨迹 video-to-video demo。
  architecture: Per the paper (arXiv 2503.11647), ReCamMaster conditions a pre-trained text-to-video model (Wan-family in the open release) on the source video through frame-dimension conditioning, letting camera trajectories be swapped at generation time.
  architecture_zh: 按论文（arXiv 2503.11647），ReCamMaster 通过帧维度条件化把源视频注入预训练文生视频模型（开源版基于 Wan 系），从而在生成时更换相机轨迹。
  usage_notes: Stage Wan2.1 (Wan-AI/Wan2.1-T2V-1.3B) and the ReCamMaster checkpoint (KlingTeam/ReCamMaster-Wan2.1) before submitting jobs; the runtime also needs torchvision and a CUDA GPU.
  usage_notes_zh: 提交任务前请就位 Wan2.1（Wan-AI/Wan2.1-T2V-1.3B）与 ReCamMaster checkpoint（KlingTeam/ReCamMaster-Wan2.1）；运行时还需要 torchvision 与 CUDA GPU。
  limitations:
  - Requires local Wan2.1 and ReCamMaster checkpoints plus CUDA.
  - Re-rendering quality is bounded by the source video content — unseen regions are hallucinated.
  limitations_zh:
  - 需要本地 Wan2.1 与 ReCamMaster checkpoint 及 CUDA。
  - 重渲染质量受源视频内容限制，未见区域由模型补全想象。
  recommended_benchmarks:
  - id: camerabench
    reason: Directly evaluates camera-trajectory control quality.
    reason_zh: 直接评估相机轨迹控制质量。
