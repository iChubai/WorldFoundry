docs:
  publisher: University of Oxford (Active Vision Lab)
  publisher_kind: university
  publisher_zh: 牛津大学（Active Vision Lab）
  overview: 'Splatt3R predicts a 3D Gaussian splat scene directly from an uncalibrated image pair — zero shot, no camera parameters, no per-scene optimization. Validated with the released checkpoint: GPU inference on the bundled example views produces a 344,064-Gaussian PLY.'
  overview_zh: Splatt3R 直接从未标定的图像对预测 3D 高斯泼溅场景——零样本、无需相机参数、无需逐场景优化。已用发布权重验证：在内置示例视图上的 GPU 推理生成含 344,064 个高斯的 PLY。
  architecture: Per the paper (arXiv 2408.13912), Splatt3R builds on MASt3R's two-view geometry backbone and adds a Gaussian-parameter head. The WorldFoundry runtime is inference-only.
  architecture_zh: 按论文（arXiv 2408.13912），Splatt3R 在 MASt3R 的双视图几何主干上增加高斯参数头。WorldFoundry 中的运行时仅含推理。
  usage_notes: Input is an uncalibrated image pair; output is a PLY Gaussian-splat file. Stage the brandonsmart/splatt3r_v1.0 checkpoint before running.
  usage_notes_zh: 输入为未标定的图像对，输出为 PLY 高斯泼溅文件。运行前请先就位 brandonsmart/splatt3r_v1.0 checkpoint。
  limitations:
  - 'Two-view input: large scenes need multiple pairs and external merging.'
  - Inherits MASt3R/DUSt3R licensing considerations through its backbone lineage.
  limitations_zh:
  - 双视图输入：大场景需要多对图像并在外部合并。
  - 经主干继承 MASt3R/DUSt3R 的许可注意事项。
