docs:
  publisher: Zhejiang University (ReLER Lab)
  publisher_kind: university
  publisher_zh: 浙江大学（ReLER 实验室）
  overview: Segment and Track Anything (SAM-Track) combines SAM segmentation with AOT/DeAOT tracking so objects can be segmented once and tracked across a whole video, with GroundingDINO enabling text-prompted selection. WorldFoundry exposes it as a tracking prior through the shared geometry-prior pipeline.
  overview_zh: Segment and Track Anything（SAM-Track）把 SAM 分割与 AOT/DeAOT 跟踪结合起来：对象只需分割一次即可在整段视频中被跟踪，GroundingDINO 支持文本提示选择。WorldFoundry 通过共享的 geometry-prior pipeline 将其作为跟踪先验提供。
  architecture: 'Three subcomponents work together: SAM produces masks, GroundingDINO grounds text prompts, and AOT/DeAOT propagates masks through the video.'
  architecture_zh: 三个子组件协同工作：SAM 生成掩码，GroundingDINO 做文本定位，AOT/DeAOT 在视频中传播掩码。
  usage_notes: Stage the SAM, GroundingDINO, and AOT/DeAOT checkpoints before running prior inference.
  usage_notes_zh: 运行先验推理前，先就位 SAM、GroundingDINO 与 AOT/DeAOT checkpoint。
  limitations:
  - 'AGPL-3.0 license: copyleft terms apply downstream.'
  limitations_zh:
  - AGPL-3.0 许可：下游适用 copyleft 条款。
