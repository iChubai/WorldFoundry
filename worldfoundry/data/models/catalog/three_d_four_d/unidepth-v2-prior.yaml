docs:
  publisher: ETH Zurich
  publisher_kind: university
  publisher_zh: 苏黎世联邦理工学院（ETH Zurich）
  overview: 'UniDepth V2 is a universal monocular metric-depth model: from a single image of any camera it predicts a metric 3D point cloud directly, without external intrinsics. Validated with the released checkpoint: inference and official point-cloud export run through the geometry-prior pipeline.'
  overview_zh: UniDepth V2 是通用单目米制深度模型：对任意相机的单张图像直接预测米制 3D 点云，无需外部内参。已用发布的 checkpoint 验证：推理与官方点云导出可通过几何先验 pipeline 运行。
  architecture: Per the upstream publication, a camera self-prompting module predicts a dense camera representation that conditions depth decoding, enabling cross-camera generalization. The default checkpoint is lpiccinelli/unidepth-v2-vitl14; set model_path to use a local copy.
  architecture_zh: 按上游论文，相机自提示模块预测稠密相机表示并条件化深度解码，实现跨相机泛化。默认 checkpoint 为 lpiccinelli/unidepth-v2-vitl14；可用 model_path 指定本地副本。
  usage_notes: Run UniDepth V2 as a standalone geometry prior, or let higher-level pipelines such as ViPE use it for metric depth.
  usage_notes_zh: UniDepth V2 可作为独立几何先验运行，也可由 ViPE 等上层管线调用以获得米制深度。
  limitations:
  - 'CC-BY-NC-4.0: non-commercial license terms apply downstream.'
  - Single-image estimation; temporal stability on video is out of scope.
  limitations_zh:
  - CC-BY-NC-4.0：下游适用非商用许可条款。
  - 单帧估计；视频时序稳定性不在其范围内。
