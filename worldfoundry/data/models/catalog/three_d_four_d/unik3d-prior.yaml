docs:
  publisher: ETH Zurich
  publisher_kind: university
  publisher_zh: 苏黎世联邦理工学院（ETH Zurich）
  overview: UniK3D generalizes metric 3D estimation to any camera — pinhole, fisheye, even full panoramas — with one model. WorldFoundry uses it as a universal-camera geometry prior. Validated with the released checkpoint through the shared geometry-prior pipeline with automatic camera estimation; pinhole and panorama camera overrides are set explicitly.
  overview_zh: UniK3D 把米制 3D 估计推广到任意相机——针孔、鱼眼、乃至完整全景——只用一个模型。WorldFoundry 将其用作通用相机几何先验。已用发布的 checkpoint 通过共享几何先验 pipeline 验证，支持自动相机估计；针孔与全景相机覆盖需显式设置。
  architecture: Per the upstream publication, UniK3D represents the camera with a learned spherical-basis model, decoupling ray directions from radial depth so that no distortion-specific tuning is needed. The default checkpoint resolves from lpiccinelli/unik3d-vitl, or from an explicit local model_path.
  architecture_zh: 按上游论文，UniK3D 用学习到的球谐基相机模型表示相机，把射线方向与径向深度解耦，无需针对畸变单独调参。默认 checkpoint 从 lpiccinelli/unik3d-vitl 解析，也可通过 model_path 显式指定本地路径。
  usage_notes: Use it through the shared geometry-prior pipeline/operator contract; pipelines such as ViPE also use it as their geometry prior. Prefer it over pinhole-only priors when inputs include fisheye or panoramic imagery.
  usage_notes_zh: 通过共享的 geometry-prior pipeline/operator 契约调用；ViPE 等 pipeline 也以它作为几何先验。当输入包含鱼眼或全景图像时，优先选它而非仅支持针孔的先验。
  limitations:
  - 'CC-BY-NC-4.0: non-commercial license terms apply downstream.'
  - Auto camera estimation can misjudge unusual optics — use explicit pinhole/panorama overrides when known.
  limitations_zh:
  - CC-BY-NC-4.0：下游适用非商用许可条款。
  - 自动相机估计可能误判特殊光学系统——已知相机类型时请显式指定针孔/全景覆盖。
