id: vggt-omega
name: VGGT-Omega
aliases:
- vggt_omega
- facebook/VGGT-Omega
tasks:
- 3d-reconstruction
- gaussian-splatting
- novel-view-synthesis
provider: huggingface
source:
  status: open_source
  hf_repo_id: facebook/VGGT-Omega
  license: cc-by-nc-4.0
checkpoint_refs:
- repo_id: facebook/VGGT-Omega
  local_dir: ${WORLDFOUNDRY_CKPT_DIR}/VGGT-Omega
  estimated_size_gb: 9.29
  license: cc-by-nc-4.0
official_sources:
  project_page: https://vggt-omega.github.io/
  paper: https://arxiv.org/abs/2605.15195
  github:
    url: https://github.com/facebookresearch/vggt-omega
    revision: 39a0cb8af88554f15ddcb5354cd52bde588fa014
integration:
  kind: pipeline_runner
  status: integrated
  notes:
  - VGGT-Omega uses an official-architecture representation runner plus the existing
    WorldFoundry VGGTResult/save interface.
  - Weights stay under assets/checkpoints and are not committed into source files.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: vggt-omega
runtime_profile: runtime-profile:vggt-omega
runner_parity:
  status: verified
  notes:
  - Single-image GPU parity against ${WORLDFOUNDRY_MODEL_SOURCE_DIR}/vggt-omega commit
    815432d4384d707c8e33478a9a72e214cb4cf9f1 passed with max_abs_diff=0.0 for comparable
    outputs.
  - The in-tree runner supports the official scene-export route and WorldFoundry
    representation artifacts.
  - Per-run validation evidence is tracked outside the model catalog.
catalog_category: three_d_four_d
catalog_scope: 3D Gaussian-splatting catalog entries. Integrated entries expose in-tree
  WorldFoundry runtimes; metadata-only entries retain upstream provenance without runnable
  backends.
docs:
  publisher: Meta AI
  publisher_kind: company
  publisher_zh: Meta AI
  overview: 'VGGT-Omega is the extended VGGT release published under facebook/VGGT-Omega, covering 3D reconstruction, Gaussian splatting, and novel view synthesis. Validated on GPU: single-image outputs match the pinned upstream commit exactly, and the official scene-export route runs end to end.'
  overview_zh: VGGT-Omega 是以 facebook/VGGT-Omega 发布的 VGGT 扩展版本，覆盖 3D 重建、高斯泼溅与新视角合成。已在 GPU 上验证：单图输出与固定的上游 commit 完全一致，官方场景导出路径可端到端运行。
  architecture: It runs the official VGGT-Omega architecture and writes predictions.npz plus GLB scene artifacts through the WorldFoundry VGGT result interface. Weights are staged under assets/checkpoints.
  architecture_zh: 它运行官方 VGGT-Omega 架构，通过 WorldFoundry 的 VGGT 结果接口写出 predictions.npz 与 GLB 场景产物。权重就位于 assets/checkpoints。
  usage_notes: Use vggt-omega for the official scene-export route with predictions.npz and GLB outputs. It is a different model from vggt (base) and vggt-world — pick by route, not by name.
  usage_notes_zh: 需要官方场景导出路径以及 predictions.npz 与 GLB 产物时使用 vggt-omega。它与 vggt（基础版）及 vggt-world 是不同的模型，请按路径而非名称选择。
  limitations:
  - 'CC-BY-NC-4.0 checkpoint: non-commercial license terms apply downstream.'
  - Validated for single-image inputs and scene export only; multi-view inputs are not validated.
  limitations_zh:
  - checkpoint 为 CC-BY-NC-4.0：下游适用非商用许可条款。
  - 仅验证了单图输入与场景导出；多视图输入未经验证。
