docs:
  publisher: Meta AI (FAIR) / University of Oxford (VGG)
  publisher_kind: company
  publisher_zh: Meta AI（FAIR）/ 牛津大学 VGG 组
  overview: VGGT (Visual Geometry Grounded Transformer, CVPR 2025) is a feed-forward network that infers cameras, depth maps, point maps, and 3D point tracks from one to hundreds of views in a single pass — no per-scene optimization. WorldFoundry runs an in-tree two-stage 3DGS pipeline on VGGT geometry; vggt-omega and vggt-world are separate models.
  overview_zh: VGGT（Visual Geometry Grounded Transformer，CVPR 2025）是前馈网络：单次前向即可从一到数百个视图推断相机、深度图、点图与 3D 点轨迹——无需逐场景优化。WorldFoundry 在树内运行基于 VGGT 几何的两段式 3DGS pipeline；vggt-omega 与 vggt-world 是独立模型。
  architecture: Per the CVPR 2025 paper, a large transformer alternates frame-wise and global attention over image tokens, with task-specific heads for cameras, depth, pointmaps, and tracking. Weights are apache-2.0 (facebookresearch/vggt); the WorldFoundry route builds 3DGS from VGGT geometry in two stages.
  architecture_zh: 按 CVPR 2025 论文，大型 Transformer 在图像 token 上交替执行帧内与全局注意力，任务头分别输出相机、深度、点图与跟踪。权重为 apache-2.0（facebookresearch/vggt）；WorldFoundry 路径分两段从 VGGT 几何构建 3DGS。
  usage_notes: For the verified scene-export route use vggt-omega; use vggt when you want the two-stage 3DGS pipeline over base VGGT geometry.
  usage_notes_zh: 需要已验证的场景导出路径请用 vggt-omega；需要基于基础 VGGT 几何的两段式 3DGS pipeline 时用 vggt。
  limitations:
  - Feed-forward inference on hundreds of views needs substantial GPU memory.
  limitations_zh:
  - 数百视图的前馈推理需要可观的 GPU 显存。
