docs:
  publisher: ByteDance
  publisher_kind: company
  publisher_zh: 字节跳动
  overview: 'Video Depth Anything brings temporal consistency to the Depth Anything family: it estimates depth over arbitrarily long videos without the flicker of frame-by-frame estimation. WorldFoundry exposes it as a standalone temporal depth prior that ViPE pipeline profiles can also select through shared runtime config.'
  overview_zh: Video Depth Anything 为 Depth Anything 家族带来时序一致性：在任意长度的视频上估计深度，避免逐帧估计的闪烁。WorldFoundry 将它作为独立的时序深度先验提供，ViPE pipeline 档案也可通过共享运行时配置选用它。
  architecture: Per the upstream release, a spatiotemporal head with a temporal-gradient consistency objective extends Depth Anything V2 to video, plus a keyframe strategy for long sequences. The checkpoint is depth-anything/Video-Depth-Anything-Large (apache-2.0).
  architecture_zh: 按上游发布，时空头加时间梯度一致性目标把 Depth Anything V2 扩展到视频，并用关键帧策略处理长序列。checkpoint 为 depth-anything/Video-Depth-Anything-Large（apache-2.0）。
  usage_notes: Run it on its own as a geometry prior, or select it from a ViPE pipeline profile. Stage the depth-anything/Video-Depth-Anything-Large weights before running.
  usage_notes_zh: 可单独作为几何先验运行，也可在 ViPE pipeline 档案中选用。运行前请就位 depth-anything/Video-Depth-Anything-Large 权重。
  limitations:
  - Relative depth focus — pair with a metric prior when metric scale is required.
  limitations_zh:
  - 以相对深度为主——需要米制尺度时请与米制先验配合。
