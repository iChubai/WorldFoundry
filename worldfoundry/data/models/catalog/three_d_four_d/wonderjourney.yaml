id: wonderjourney
name: WonderJourney
tasks:
- 3d-world-generation
- scene-expansion
- image-to-3d-world
output_artifacts:
- generated_world
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/KovenYu/WonderJourney
official_sources:
  project_page: https://kovenyu.com/WonderJourney/
  paper: https://arxiv.org/abs/2312.03884
  github:
    url: https://github.com/KovenYu/WonderJourney
    revision: fecbbdff4d107e673c29c1d87b9e66fdc46f11af
integration:
  kind: pipeline_runner
  status: integrated
  notes:
  - WorldFoundry exposes an in-tree adapter that runs the upstream WonderJourney run.py/example_config flow.
  - Missing assets or runtime dependencies are reported at inference time.
runner_parity:
  status: pending
  notes:
  - Pipeline target imports and plan-only inference are wired; full artifact parity needs runtime assets.
runtime_profile: runtime-profile:wonderjourney
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: wonderjourney
catalog_category: three_d_four_d
catalog_scope: 3D Gaussian-splatting catalog entries. Integrated entries expose in-tree
  WorldFoundry runtimes; metadata-only entries retain upstream provenance without runnable
  backends.
docs:
  publisher: Stanford University / Google
  publisher_kind: university
  publisher_zh: 斯坦福大学 / Google
  overview: 'WonderJourney generates a journey: starting from text or an image, it produces a sequence of connected 3D scenes you travel through — perpetual 3D scene generation rather than a single clip. WorldFoundry runs the upstream run.py/example_config flow.'
  overview_zh: WonderJourney 生成一段「旅程」：从文本或一张图出发，产出一串相互衔接、可穿行的 3D 场景——是持续的 3D 场景生成而非单个片段。WorldFoundry 运行上游 run.py/example_config 流程。
  architecture: Per the paper (arXiv 2312.03884), an LLM proposes upcoming scene descriptions, a point-cloud-and-inpainting visual module renders each new scene from the previous one, and a VLM verifies results.
  architecture_zh: 按论文（arXiv 2312.03884），LLM 提议后续场景描述，点云加图像修复的视觉模块从上一场景渲染新场景，VLM 负责校验结果。
  usage_notes: Stage the upstream assets (depth, inpainting, LLM access) locally before generating journeys; without them a run produces only a plan.
  usage_notes_zh: 生成旅程前需在本地就位上游资产（深度、修复、LLM 访问）；缺少这些资产时，运行只产出计划。
  limitations:
  - Scene-to-scene generation accumulates style and geometry drift over long journeys.
  limitations_zh:
  - 场景到场景的生成在长旅程中会累积风格与几何漂移。
  recommended_benchmarks:
  - id: worldscore
    reason: Standard scoring for generated navigable scene sequences.
    reason_zh: 生成可游走场景序列的标准评分。
