id: worldgen
name: WorldGen
tasks:
- 3d-world-generation
- text-to-3d-world
- image-to-3d-world
output_artifacts:
- generated_3d_asset
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/ZiYang-xie/WorldGen
  license: apache-2.0
official_sources:
  project_page: https://worldgen.github.io/
  github:
    url: https://github.com/ZiYang-xie/WorldGen
    revision: 7ce7b2767fdf31e2727b69a2e61e2e950e3a017f
integration:
  kind: pipeline_runner
  status: integrated
  notes:
  - WorldFoundry exposes an in-tree adapter that runs the WorldGen inference flow.
  - Missing gated foundation models or WorldGen assets are reported at inference time.
runner_parity:
  status: pending
  notes:
  - The in-tree adapter can execute the WorldGen inference flow when required
    assets are staged.
  - Full official scene-quality parity remains pending; per-run artifact checks
    are tracked outside the model catalog.
runtime_profile: runtime-profile:worldgen
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: worldgen
catalog_category: three_d_four_d
catalog_scope: 3D Gaussian-splatting catalog entries. Integrated entries expose in-tree
  WorldFoundry runtimes; metadata-only entries retain upstream provenance without runnable
  backends.
docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'WorldGen turns a text prompt or an image into a 3D world: FLUX paints a panorama, which is then reconstructed into a Gaussian splat (default) or a mesh. It covers text-to-3D-world and image-to-3D-world generation and does not output video.'
  overview_zh: WorldGen 把文本提示或一张图变成 3D 世界：FLUX 先生成全景图，再重建为高斯溅射（默认）或网格。它覆盖文本到 3D 世界与图像到 3D 世界生成，不输出视频。
  architecture: The generation stack depends on gated FLUX foundation models (FLUX.1-dev for text-to-panorama, FLUX.1-Fill-dev for image-to-panorama) plus WorldGen's own assets (LeoXie/WorldGen, apache-2.0).
  architecture_zh: 生成栈依赖 gated 的 FLUX 基础模型（FLUX.1-dev 用于文生全景，FLUX.1-Fill-dev 用于图生全景）以及 WorldGen 自身资产（LeoXie/WorldGen，apache-2.0）。
  usage_notes: 'Accept the gated FLUX terms and stage the WorldGen assets before running. Validated locally: a 512x256, 50-step text-to-scene run produces a Gaussian-splat scene with the requested content.'
  usage_notes_zh: 运行前请接受 gated FLUX 条款并就位 WorldGen 资产。已在本地验证：512x256、50 步的文生场景运行可生成包含提示内容的高斯溅射场景。
  limitations:
  - Depends on gated FLUX foundation models — access must be granted upstream.
  - Scene quality has not been compared against official outputs.
  - Image-to-scene from a cropped perspective photo does not preserve the input, because the upstream path maps the image onto panorama rays without an input camera field of view. A full 2:1 panorama input is preserved but leaves no area to expand.
  limitations_zh:
  - 依赖 gated 的 FLUX 基础模型——需先在上游获得访问权限。
  - 场景质量尚未与官方输出做对照。
  - 裁剪的透视照片用于图生场景时无法保留输入，因为上游路径在未指定输入视场角的情况下把图像映射到全景光线。完整的 2:1 全景输入可以保留，但没有待扩展区域。
  recommended_benchmarks:
  - id: worldscore
    reason: Standard scoring for generated 3D worlds.
    reason_zh: 生成 3D 世界的标准评分。
