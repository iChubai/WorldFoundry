id: allegro
name: Allegro
aliases:
  - allegro_ti2v
  - allegro-ti2v
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
runtime_profile: runtime-profile:allegro-ti2v
tasks:
  - text-to-video
  - image-to-video
source_status:
  status: confirmed_official_github
  github:
    url: https://github.com/rhymes-ai/Allegro
    verified_by: git ls-remote --symref https://github.com/rhymes-ai/Allegro.git HEAD
    default_branch: main
    head_sha: f395a54b015f7e3296c52f59a45b78acf9dd07f6
checkpoint:
  status: confirmed_public_hf
  verified_by: GET https://huggingface.co/api/models/<repo_id>
  repos:
    - id: rhymes-ai/Allegro
      sha: c1b9207bb5cb79e2aa08f3d139c17d26c0de55b6
      license: apache-2.0
      private: false
      gated: false
      tasks:
        - text-to-video
    - id: rhymes-ai/Allegro-TI2V
      sha: eaac4927c4f42eb20cd21d0c2c4e58a8af34cd62
      license: apache-2.0
      private: false
      gated: false
      tasks:
        - image-to-video
  notes: rhymes-ai/Allegro-I2V candidate returned 401 and is not listed.
demo_parity:
  status: pending
  notes: The WorldFoundry TI2V route is wired in the unified environment profile;
    official long-config parity remains pending.
notes: GitHub verification succeeded after retry; the first attempt hit a transient TLS error.
catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight video generation models. Checkpoints are not tracked in git; local validation may download selected repos under cache/hfd.
catalog_policy:
  github: Validated with git ls-remote, preferring git ls-remote --symref <repo>.git HEAD for default branch and HEAD SHA.
  huggingface: Validated with the Hugging Face /api/models endpoint. Recorded repo id, sha, private, gated, license, and selected task tags only.
  parity: This manifest does not claim WorldFoundry runtime parity unless an explicit parity run and expected artifact are recorded.
official_sources:
  paper: https://arxiv.org/abs/2410.15458
integration:
  status: integrated
  notes:
    - WorldFoundry wraps the in-tree Allegro TI2V runtime.
runner_parity:
  status: pending
  notes:
    - WorldFoundry pipeline target is registered for the in-tree Allegro TI2V runtime.
    - Generated artifact parity with the official demo configuration still requires
      a full official run.
docs:
  publisher: Rhymes AI
  publisher_kind: company
  publisher_zh: Rhymes AI
  overview: 'Allegro is an open text-to-video and image-to-video generation model. WorldFoundry runs it through the TI2V (text+image to video) route: a prompt, optionally anchored by a start image, produces a video. The aliases allegro_ti2v and allegro-ti2v resolve to the same model.'
  overview_zh: Allegro 是开源的文生视频/图生视频模型。WorldFoundry 通过其 TI2V（文本+图像生成视频）路径运行它：一条提示词（可选配一张起始图）生成一段视频。别名 allegro_ti2v 与 allegro-ti2v 指向同一模型。
  architecture: Allegro is a diffusion-transformer video generator released by Rhymes AI. The TI2V route conditions generation on a prompt and an optional start image; see the upstream release for architecture details.
  architecture_zh: Allegro 是 Rhymes AI 发布的扩散 Transformer 视频生成模型。TI2V 路径以提示词和可选的起始图为条件生成视频；架构细节请查阅上游发布说明。
  usage_notes: Stage the Allegro checkpoints locally before launching. The default run generates 88 frames at 1280x720 and 15 fps.
  usage_notes_zh: 启动前请先在本地就位 Allegro checkpoint。默认生成 88 帧、1280x720、15 fps 的视频。
  recommended_benchmarks:
  - id: vbench
    reason: Multi-dimension video generation quality suite that fits Allegro's T2V/I2V output.
    reason_zh: 多维视频生成质量评测，适配 Allegro 的文生/图生视频输出。
