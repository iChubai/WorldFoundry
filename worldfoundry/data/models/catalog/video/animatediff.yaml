docs:
  publisher: Shanghai AI Laboratory / CUHK MMLab
  publisher_kind: lab
  publisher_zh: 上海人工智能实验室 / 香港中文大学 MMLab
  overview: 'AnimateDiff is the classic motion-module approach to text-to-video: it animates existing Stable Diffusion image models by inserting a trained temporal module, rather than training a video model from scratch. Validated with the released checkpoints: WorldFoundry reproduces the official RealisticVision `scripts.animate` demo output exactly. Aliases: animate-diff and animate_diff.'
  overview_zh: AnimateDiff 是经典的「运动模块」式文生视频方法：通过在现成的 Stable Diffusion 图像模型中插入训练好的时序模块来让静态模型动起来，而不是从头训练视频模型。已用发布的 checkpoint 验证：WorldFoundry 的输出与官方 RealisticVision `scripts.animate` demo 完全一致。别名：animate-diff、animate_diff。
  architecture: A legacy U-Net latent diffusion backbone (Stable Diffusion v1.5) plus AnimateDiff's temporal motion module. It uses the guoyww/animatediff motion modules, the guoyww/animatediff_t2i_backups T2I weights, stable-diffusion-v1-5, and the CLIP ViT-L/14 text encoder.
  architecture_zh: 基座为旧式 U-Net 潜空间扩散模型（Stable Diffusion v1.5），叠加 AnimateDiff 的时序运动模块。使用 guoyww/animatediff 运动模块、guoyww/animatediff_t2i_backups T2I 权重、stable-diffusion-v1-5 与 CLIP ViT-L/14 文本编码器。
  usage_notes: A good first video route, since it reproduces the official demo exactly. CLI, Studio, and API runs all use the unified environment `worldfoundry-unified-cu128`; a CUDA GPU is required.
  usage_notes_zh: 输出与官方 demo 完全一致，适合作为入门视频生成路径。CLI、Studio 与 API 均在统一环境 `worldfoundry-unified-cu128` 中运行；需要 CUDA GPU。
  limitations:
  - Quality is bounded by the SD1.5-era U-Net backbone — expect lower fidelity and resolution than DiT-based video models.
  - Motion is driven by a general-purpose module; there is no camera or action control on this route.
  limitations_zh:
  - 画质受 SD1.5 时代 U-Net 基座限制——保真度与分辨率低于基于 DiT 的视频模型。
  - 运动由通用运动模块驱动；该路径不提供相机或动作控制。
  recommended_benchmarks:
  - id: vbench
    reason: Standard suite for checking frame quality and temporal consistency of T2V outputs.
    reason_zh: 检验文生视频画质与时序一致性的标准评测。
