docs:
  publisher: ByteDance
  publisher_kind: company
  publisher_zh: 字节跳动（ByteDance）
  overview: "Bernini is ByteDance's unified any-to-any visual generation model: one checkpoint covers text-to-image, image editing, text-to-video, video-to-video, and reference-guided video. The full ByteDance/Bernini-Diffusers checkpoint pairs a 7B semantic planner with a 14B renderer. WorldFoundry ships the official inference source and loads the self-contained Diffusers checkpoint directly, so no external Bernini checkout is needed."
  overview_zh: Bernini 是字节跳动的统一「任意到任意」视觉生成模型：一个 checkpoint 同时覆盖文生图、图像编辑、文生视频、视频到视频与参考引导视频。完整的 ByteDance/Bernini-Diffusers checkpoint 内含 7B 语义规划器与 14B 渲染器。WorldFoundry 自带官方推理源码，直接加载自包含的 Diffusers checkpoint，无需外部 Bernini 检出。
  architecture: 'Two-stage design: a 7B semantic planner produces an intermediate plan and a 14B renderer synthesizes the final pixels. Official recipes run single-request inference with 8-way Ulysses sequence parallelism (nproc_per_node=8, ulysses_size=8). The task_type input selects among the six task families at request time.'
  architecture_zh: 两段式设计：7B 语义规划器先产出中间规划，14B 渲染器再合成最终像素。官方配方使用单请求 8 路 Ulysses 序列并行推理（nproc_per_node=8、ulysses_size=8）。请求时通过 task_type 输入在六类任务间切换。
  usage_notes: The official dispatch needs one 8-GPU node with H100-class GPUs. If you do not have an 8-GPU node, use the renderer-only Bernini-R models instead — the 1.3B one runs on a single GPU.
  usage_notes_zh: 官方调度需要一台 8 卡 H100 级 GPU 节点。如果没有 8 卡节点，请改用仅渲染器的 Bernini-R 模型——其中 1.3B 版单卡可跑。
  limitations:
  - The official recipe assumes an 8-GPU Ulysses setup; smaller topologies are not part of the official configuration.
  - Weights (apache-2.0) are external and must be staged before running.
  limitations_zh:
  - 官方配方假定 8 卡 Ulysses 环境；更小的拓扑不属于官方配置。
  - 权重（apache-2.0）为外部资产，运行前需先就位。
  recommended_benchmarks:
  - id: vbench
    reason: Covers the T2V half of Bernini's unified task space.
    reason_zh: 覆盖 Bernini 统一任务空间中的文生视频部分。
  - id: t2v-compbench
    reason: Compositional prompts stress the semantic-planner stage.
    reason_zh: 组合式提示词可检验语义规划阶段的能力。
