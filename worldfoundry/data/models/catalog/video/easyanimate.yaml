demo_parity:
  status: pending
  notes: The EasyAnimate V5.1 I2V route is wired with the official InP checkpoint and Flow scheduler; full official benchmark parity remains pending.
notes: Official GitHub is aigc-apps/EasyAnimate; official HF checkpoint org is alibaba-pai.
catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight video generation models. Checkpoints are not tracked in git; local validation may download selected repos under cache/hfd.
catalog_policy:
  github: Validated with git ls-remote, preferring git ls-remote --symref <repo>.git HEAD for default branch and HEAD SHA.
  huggingface: Validated with the Hugging Face /api/models endpoint. Recorded repo id, sha, private, gated, license, and selected task tags only.
  parity: This manifest does not claim WorldFoundry runtime parity unless an explicit parity run and expected artifact are recorded.
official_sources:
  project_page: https://easyanimate.github.io/
  paper: https://arxiv.org/abs/2405.18991
integration:
  status: integrated
  notes:
    - WorldFoundry wraps the in-tree EasyAnimate I2V runtime.
runner_parity:
  status: pending
  notes:
    - The fix uses the official V5.1 Flow scheduler, InP checkpoint, and height/width to sample_size mapping.
    - Per-run visual QA and artifact checks are tracked outside the model catalog.
docs:
  publisher: Alibaba (PAI)
  publisher_kind: company
  publisher_zh: 阿里巴巴（PAI 团队）
  overview: EasyAnimate is Alibaba PAI's DiT-based video generation project, covering text-to-video, image-to-video, and video-to-video. WorldFoundry runs its V5.1 image-to-video route, and WRBench camera-control evaluation uses the same runtime. The aliases easyanimate_i2v and easyanimate-i2v select this model.
  overview_zh: EasyAnimate 是阿里 PAI 团队基于 DiT 的视频生成项目，覆盖文生视频、图生视频与视频到视频。WorldFoundry 运行其 V5.1 图生视频路径，WRBench 相机控制评测使用同一运行时。别名 easyanimate_i2v、easyanimate-i2v 指向该模型。
  architecture: The route uses the official V5.1 Flow scheduler with the InP (inpainting-style image-conditioned) checkpoint family and maps height/width to sample_size. `*-InP` checkpoints are the image-to-video models; the non-InP EasyAnimateV5.1-7b-zh checkpoint is the text-to-video model.
  architecture_zh: 该路径使用官方 V5.1 Flow 调度器、InP（图像条件补全式）checkpoint 系列，并把 height/width 映射到 sample_size。`*-InP` checkpoint 是图生视频模型；非 InP 的 EasyAnimateV5.1-7b-zh 是文生视频模型。
  usage_notes: Use the `*-InP` checkpoints for image-to-video; picking the non-InP family is the most common configuration mistake. Official code is at aigc-apps/EasyAnimate, with checkpoints under the alibaba-pai Hugging Face organization.
  usage_notes_zh: 图生视频请使用 `*-InP` checkpoint；选成非 InP 系列是最常见的配置错误。官方代码在 aigc-apps/EasyAnimate，checkpoint 在 alibaba-pai 的 Hugging Face 组织下。
  limitations:
  - Only the V5.1 image-to-video route runs in WorldFoundry; upstream control-to-video and camera-trajectory weights are not supported.
  limitations_zh:
  - WorldFoundry 只运行 V5.1 图生视频路径；上游的控制到视频与相机轨迹权重不受支持。
  recommended_benchmarks:
  - id: vbench
    reason: General video generation quality suite.
    reason_zh: 通用视频生成质量评测。
  - id: camerabench
    reason: Relevant because WRBench camera control reuses this runtime.
    reason_zh: WRBench 相机控制复用该运行时，因此相机评测相关。
