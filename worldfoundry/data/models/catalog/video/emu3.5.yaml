docs:
  publisher: Beijing Academy of Artificial Intelligence (BAAI)
  publisher_kind: lab
  publisher_zh: 北京智源人工智能研究院（BAAI）
  overview: 'Emu3.5 is BAAI''s native multimodal generation model for interleaved text and images. WorldFoundry has a registered adapter, but the staged checkpoint declares an Emu3 architecture that the installed Transformers runtime cannot resolve. Checkpoint-backed inference is blocked before model loading; no video output is claimed.'
  overview_zh: Emu3.5 是北京智源（BAAI）面向交错文本与图像的原生多模态生成模型。WorldFoundry 已注册适配器，但已就位权重声明的 Emu3 架构无法被当前 Transformers 运行时识别。加载模型前即被阻塞，且不宣称视频输出。
  architecture: The Emu series treats images and text as one token stream for next-token prediction — no separate diffusion decoder in the loop, per BAAI's public releases. This repository records the prompt+image input contract and the model_response artifact; parameter counts and internals of the 3.5 revision are not recorded here.
  architecture_zh: Emu 系列把图像与文本统一为一个 token 流做下一个 token 预测——按 BAAI 的公开发布，推理环节没有独立的扩散解码器。本仓库记录了 prompt+image 输入契约与 model_response 产物；3.5 版的参数规模与内部细节仓库未记录。
  usage_notes: The BAAI/Emu3.5 weights are staged, but Transformers 4.57.6 rejects config.model_type Emu3. A compatible, reviewed loader is required before a checkpoint-backed text/image response can be verified.
  usage_notes_zh: BAAI/Emu3.5 权重已就位，但 Transformers 4.57.6 无法识别 config.model_type Emu3。验证权重生成文本/图像响应前，需要经过检查的兼容加载器。
  limitations:
  - The registered runner is blocked by an unsupported checkpoint architecture before model loading; no checkpoint-backed artifact has been verified.
  - The official checkpoint card describes text/image generation, not video generation.
  limitations_zh:
  - 已注册 runner 在加载模型前就被不支持的权重架构阻塞；尚未验证加载权重后的产物。
  - 官方权重说明的是文本/图像生成，而非视频生成。
