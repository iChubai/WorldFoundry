docs:
  publisher: NVIDIA / FastVideo
  publisher_kind: company
  publisher_zh: 英伟达 / FastVideo
  overview: FastVideo CausalWan2.2 is an eight-step causal Wan2.2 rollout that emits
    video in three-latent-frame blocks while routing between high- and low-noise experts.
  overview_zh: FastVideo CausalWan2.2 是八步因果 Wan2.2 生成模型，以每块三个潜帧推进，并在高、低噪声专家之间切换。
  architecture: WorldFoundry keeps expert KV/cross-attention caches independent and owns
    deterministic self-forcing re-noise on the fixed shifted flow schedule.
  architecture_zh: WorldFoundry 独立维护两个专家的 KV/交叉注意力缓存，并在固定移位 flow schedule 上执行确定性的 self-forcing 重加噪。
  usage_notes: Defaults are 832x480, 717 frames, eight steps, guidance 1, and 16 FPS.
  usage_notes_zh: 默认配置为 832x480、717 帧、八步、guidance 1、16 FPS。
  limitations:
  - Full inference requires the external A14B checkpoint and a suitable CUDA GPU.
  limitations_zh:
  - 完整推理需要外部 A14B checkpoint 与合适的 CUDA GPU。
