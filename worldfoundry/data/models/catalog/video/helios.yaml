docs:
  publisher: Peking University (Yuan Group)
  publisher_kind: university
  publisher_zh: 北京大学（袁粒课题组）
  overview: "Helios is PKU-YuanGroup's long-video generation family covering T2V, I2V, V2V, and long-video generation, released in three checkpoints: Helios-Distilled (default, efficient), Helios-Mid, and Helios-Base (best quality). All three checkpoints are available as variants. Resident Distilled sessions keep the native 9-latent/33-frame history and accept prompt changes between segments. Validated with Helios-Base on an A100: a 3-step [1,1,1] pyramid run at 384x640/33 frames loads the checkpoint and decodes a nonblank video."
  overview_zh: Helios 是北大袁粒课题组的长视频生成系列，覆盖文生视频、图生视频、视频到视频与长视频生成，发布了三个 checkpoint：Helios-Distilled（默认、高效）、Helios-Mid、Helios-Base（最佳质量）。三个 checkpoint 均以 variant 形式提供。常驻的 Distilled 会话保留原生 9 潜变量/33 帧历史，并允许在分段之间更换提示词。已在 A100 上用 Helios-Base 验证：以 384x640/33 帧、三步 [1,1,1] 金字塔运行可加载 checkpoint 并解码出非空视频。
  architecture: Helios generates video in 33-frame chunks; the pipeline rounds requested frame counts up to a compatible chunk count. Group offloading and multi-GPU context parallelism are available as runtime options.
  architecture_zh: Helios 以 33 帧为块生成视频；pipeline 会把请求帧数向上取整到兼容的块数。group offloading 与多卡上下文并行可作为运行时选项使用。
  usage_notes: Default to Helios-Distilled; switch to Base for final quality (expect much longer runtimes). Run Helios in the dedicated Helios environment on a GPU.
  usage_notes_zh: 默认用 Helios-Distilled；出成品换 Base（耗时显著增加）。Helios 需在专用 Helios 环境中用 GPU 运行。
  limitations:
  - Full visual parity at 240 request frames and the official [20,20,20] Base quality recipe are not yet validated.
  - No keyboard/camera control; interactivity is limited to prompt changes at 33-frame chunk boundaries.
  limitations_zh:
  - 完整 240 请求帧的视觉一致性与官方 [20,20,20] Base 质量配方尚未验证。
  - 无键盘/相机控制；交互仅限在 33 帧块边界更换提示词。
  recommended_benchmarks:
  - id: vbench
    reason: Baseline quality suite for the T2V routes.
    reason_zh: T2V 路径的基础质量评测。
  - id: chronomagic-bench
    reason: Long-horizon suite matching Helios's long-video focus.
    reason_zh: 长时程评测，契合 Helios 的长视频定位。
