official_sources:
  paper: https://arxiv.org/abs/2511.18870
integration:
  status: integrated
  notes:
  - T2V and I2V are declarative recipes assembled by the shared native diffusion runner; generate.py is not retained as a second inference architecture.
  - HunyuanVideo 1.5 owns only model-specific network, codec, and conditioning behavior.
  - The I2V conditioner declares FLUX.1-Redux-dev as an independent gated vision checkpoint instead of inferring a sibling path.
