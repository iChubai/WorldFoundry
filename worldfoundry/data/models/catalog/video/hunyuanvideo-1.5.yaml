notes:
- HunyuanVideo 1.5 T2V and I2V are exposed as independent model recipes under one shared infra architecture.
- Checkpoints are external assets and HF license metadata is 'other'; the I2V-only FLUX.1-Redux-dev vision asset is gated and non-commercial-license review is required.
