  parity: A pre-cutover generate.py artifact does not establish NativeDiffusionPipeline parity.
docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: HunyuanVideo 1.5 is the newer revision of Tencent's open video family, with separate text-to-video and image-to-video variants. Unlike the original, the I2V variant needs the gated FLUX.1-Redux-dev vision checkpoint staged as its own download.
  overview_zh: HunyuanVideo 1.5 是腾讯开源视频系列的较新版本，提供独立的文生视频与图生视频变体。与初代不同，I2V 变体需要单独就位 gated 的 FLUX.1-Redux-dev 视觉 checkpoint。
  architecture: A latent video diffusion pipeline built from a conditioner, latent initializer, scheduler, denoiser, latent encoder, and decoder; the I2V conditioner adds SigLIP image features from FLUX.1-Redux-dev. The transformer, VAE, and SigLIP checkpoints load with no missing or mismatched keys.
  architecture_zh: 潜空间视频扩散 pipeline，由条件器、潜变量初始化、调度器、去噪器、潜空间编码器与解码器组成；I2V 条件器额外使用 FLUX.1-Redux-dev 的 SigLIP 图像特征。transformer、VAE 与 SigLIP checkpoint 加载时无缺失或不匹配的键。
  usage_notes: Start with hunyuanvideo-1.5-t2v. Before running hunyuanvideo-1.5-i2v, accept the FLUX.1-Redux-dev terms on Hugging Face.
  usage_notes_zh: 从 hunyuanvideo-1.5-t2v 开始。运行 hunyuanvideo-1.5-i2v 前，请先在 Hugging Face 接受 FLUX.1-Redux-dev 的条款。
  limitations:
  - I2V depends on the gated, non-commercial FLUX.1-Redux-dev vision checkpoint.
  - Main checkpoint license metadata is 'other'; review before commercial use.
  limitations_zh:
  - I2V 依赖 gated 且非商用许可的 FLUX.1-Redux-dev 视觉 checkpoint。
  - 主 checkpoint 许可元数据为“other”，商用前需审阅。
  recommended_benchmarks:
  - id: vbench
    reason: Standard open T2V quality suite.
    reason_zh: 标准开源文生视频质量评测。
