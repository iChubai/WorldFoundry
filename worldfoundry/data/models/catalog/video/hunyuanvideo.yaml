notes:
- Tencent-Hunyuan GitHub and tencent Hugging Face repositories were confirmed.
- Checkpoints are external assets and HF license metadata is 'other'.
catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight video generation models.
catalog_policy:
  github: Validate with git ls-remote and record the official default branch revision.
  huggingface: Record official repo id, revision, access state, license metadata, and task tags.
  parity: A pre-cutover official-runtime artifact does not establish NativeDiffusionPipeline parity.
docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: HunyuanVideo is Tencent's large open video generation model, with T2V and I2V variants. WorldFoundry runs both as native diffusion recipes on the shared runner rather than through the upstream CLI.
  overview_zh: HunyuanVideo 是腾讯的大规模开源视频生成模型，提供 T2V 与 I2V 两个 variant。WorldFoundry 用共享 runner 以原生扩散配方运行两者，不经过上游 CLI。
  architecture: Upstream HunyuanVideo is a ~13B diffusion transformer with a causal 3D VAE and dual text encoders (per Tencent's public release). WorldFoundry re-assembles it from native network, conditioner, VAE, and scheduler components, and the released checkpoints load without missing or mismatched keys.
  architecture_zh: 上游 HunyuanVideo 是约 13B 的扩散 Transformer，配因果 3D VAE 与双文本编码器（见腾讯公开发布）。WorldFoundry 用原生网络、条件器、VAE 与调度器组件重新装配，发布的 checkpoint 可完整加载，无缺失或形状不符的键。
  usage_notes: Choose hunyuanvideo-t2v for text-to-video or hunyuanvideo-i2v when a reference image conditions the clip, and stage tencent/HunyuanVideo or tencent/HunyuanVideo-I2V locally.
  usage_notes_zh: 文生视频选 hunyuanvideo-t2v，以参考图为条件时选 hunyuanvideo-i2v，并在本地就位 tencent/HunyuanVideo 或 tencent/HunyuanVideo-I2V。
  limitations:
  - Checkpoint license metadata is 'other'; review the terms before commercial use.
  - 'Large model: official 720×1280, 129-frame inference peaks at about 60 GB of GPU memory.'
  limitations_zh:
  - checkpoint 许可元数据为“other”，商用前请审阅条款。
  - 大模型：官方 720×1280、129 帧推理峰值显存约 60 GB。
  recommended_benchmarks:
  - id: vbench
    reason: Standard open T2V quality suite.
    reason_zh: 标准开源文生视频质量评测。
  - id: physics-iq
    reason: Physical-plausibility probe for large video models.
    reason_zh: 针对大视频模型的物理合理性检验。
