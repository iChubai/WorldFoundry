official_sources:
  project_page: https://aivideo.hunyuan.tencent.com
  paper: https://arxiv.org/abs/2412.03603
integration:
  status: integrated
  notes:
  - T2V and I2V are declarative recipes assembled by the shared native diffusion runner; the former upstream CLI runtime is not a backend.
  - The canonical PyTorch network, prompt encoders, causal 3D VAE, scheduler, and loaders live in role-based diffusion_model packages.
native_diffusion:
  recipe_ids:
  - hunyuanvideo-t2v
  - hunyuanvideo-i2v
  status: assembly_and_checkpoint_structure_verified
  strategy: standard
  components:
  - conditioner
  - latent_initializer
  - scheduler
  - denoiser
  - latent_encoder
  - decoder
  checkpoint_validation:
    original_t2v_source_keys: 856
    original_t2v_converted_keys: 976
    original_t2v_model_keys: 976
    original_i2v_checkpoint_keys: 856
    original_i2v_model_keys: 856
    vae_checkpoint_keys: 248
    vae_model_keys: 248
    missing_keys: 0
    unexpected_keys: 0
    shape_mismatches: 0
    method: local checkpoint mmap key-and-shape comparison on meta-constructed native modules
  artifact_parity: pending_after_native_cutover
demo_parity:
  status: pending
  notes:
  - Historical upstream-runtime artifacts are not evidence for the new native execution path.
runner_parity:
