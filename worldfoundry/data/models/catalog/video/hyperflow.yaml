catalog_category: video
docs:
  publisher: Video Rebirth
  overview: Eight-step MiniMax-H3 adapter with joint video/audio, first/last-frame conditioning and ordered multimodal
    references.
  overview_zh: MiniMax-H3 的八步推理适配器，支持联合音视频、首尾帧条件与有序多模态参考。
  usage_notes: Supply a complete local Diffusers-format MiniMax-H3 checkpoint snapshot, weights_path and the dedicated
    Python executable. In-tree HyperFlow reuses canonical H3 components; its variant supplies the fixed grid, so
    num_inference_steps must be 8 and output fps must be 24. Recorded single-H100 validation covers T2VA, single-image
    FL2VA and image-reference Ref2VA at 640×384 and 124 frames in eight steps, with full video and stereo audio
    decoding.
  usage_notes_zh: 提供完整的本地 Diffusers 格式 MiniMax-H3 权重快照、weights_path 和专用 Python 可执行文件。树内 HyperFlow 复用规范 H3 组件，其变体提供固定网格，因此
    num_inference_steps 必须为 8，输出帧率必须为 24 fps。已记录的单张 H100 验证覆盖 T2VA、单图 FL2VA 和图像参考 Ref2VA，以 8 步生成 640×384、124 帧，包含完整视频与立体声音频解码。
  limitations:
  - GPU inference requires substantial VRAM and host RAM; the upstream single-GPU measurements use an H200. Released-weight
    replay of the in-tree implementation remains pending.
  - The official frame count is aligned upward to 17n+5, with supported aligned counts from 124 to 345 at 24 fps.
  - Ref2VA requires transformer_ref weights; audio-only references are unsupported.
  - High-resolution output parity, multi-GPU execution, last-frame and video/audio reference conditioning, automatic
    CPU offload and optional attention kernels require GPU validation.
  - Source is Apache-2.0; weights use the MiniMax H3 Community License.
  limitations_zh:
  - GPU 推理需要大量显存和主机内存；上游公布的单卡测量使用 H200。树内实现的发布权重回放尚待完成。
  - 官方帧数会向上对齐到 17n+5；在 24 fps 下支持对齐后的 124 至 345 帧。
  - Ref2VA 需要 transformer_ref 权重；不支持仅音频参考。
  - 高分辨率输出一致性、多卡执行、末帧及视频/音频参考条件、CPU 自动卸载与可选注意力内核仍需 GPU 验证。
  - 源码采用 Apache-2.0，权重采用 MiniMax H3 Community License。
