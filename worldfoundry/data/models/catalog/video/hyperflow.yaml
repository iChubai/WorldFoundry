catalog_category: video
docs:
  publisher: Video Rebirth
  overview: Eight-step MiniMax-H3 adapter with joint video/audio, first/last-frame
    conditioning and ordered multimodal references.
  overview_zh: MiniMax-H3 的八步推理适配器，支持联合音视频、首尾帧条件与有序多模态参考。
  usage_notes: Supply a complete local Diffusers-format MiniMax-H3 checkpoint snapshot,
    weights_path and the dedicated Python executable. In-tree HyperFlow reuses canonical
    H3 components and its variant supplies the fixed grid; num_inference_steps must be 8
    and output fps must be 24. Diffusers is used only for CPU eviction and selected
    attention dispatch utilities. Source is Apache-2.0; weights use the MiniMax H3 Community License.
  usage_notes_zh: 提供完整的本地 Diffusers 格式 MiniMax-H3 权重快照、weights_path 和专用 Python 可执行文件。树内 HyperFlow
    复用规范 H3 组件，其变体提供固定网格；num_inference_steps 必须为 8，输出帧率必须为 24 fps。
    Diffusers 仅用于 CPU 卸载和部分注意力分发工具。源码采用 Apache-2.0，权重采用 MiniMax H3 Community License。
  limitations:
  - GPU inference requires substantial VRAM and host RAM; CUDA and released-weight
    replay of the in-tree implementation remain pending.
  - The official frame count is aligned upward to 17n+5, with supported aligned counts
    from 124 to 345 at 24 fps.
  - Ref2VA requires transformer_ref weights; audio-only references are unsupported.
  - Runner output parity, multi-GPU execution, automatic CPU offload and optional
    attention kernels require GPU validation.
  limitations_zh:
  - GPU 推理需要大量显存和主机内存；树内实现的 CUDA 验证及发布权重回放尚待完成。
  - 官方帧数会向上对齐到 17n+5；在 24 fps 下支持对齐后的 124 至 345 帧。
  - Ref2VA 需要 transformer_ref 权重；不支持仅音频参考。
  - Runner 输出一致性、多卡执行、CPU 自动卸载及可选注意力内核仍需 GPU 验证。
