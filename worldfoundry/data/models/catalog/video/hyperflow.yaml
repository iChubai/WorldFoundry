docs:
  publisher: Video Rebirth
  overview: Eight-step MiniMax-H3 adapter with joint video/audio, first/last-frame conditioning and ordered multimodal references.
  overview_zh: MiniMax-H3 的八步推理适配器，支持联合音视频、首尾帧条件与有序多模态参考。
  usage_notes: Supply a complete local diffusers MiniMax-H3 snapshot, weights_path and the dedicated Python executable. The upstream loader supplies the fixed grid; num_inference_steps must be 8 and output fps must be 24.
  limitations:
  - GPU inference requires substantial VRAM and host RAM; the upstream single-GPU measurements use an H200.
  - The official frame count is aligned upward to 17n+5, with supported aligned counts from 124 to 345 at 24 fps.
  - Ref2VA requires transformer_ref weights; audio-only references are unsupported.
