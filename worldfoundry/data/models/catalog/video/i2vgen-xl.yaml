docs:
  publisher: Alibaba (Tongyi Lab)
  publisher_kind: company
  publisher_zh: 阿里巴巴（通义实验室）
  modalities:
    inputs:
    - image
    - text
    outputs:
    - video
  overview: I2VGen-XL is Alibaba's cascaded image-to-video model, one of the earlier high-resolution open I2V releases. It turns a still image and a text prompt into a short video through a two-stage generate-then-refine cascade.
  overview_zh: I2VGen-XL 是阿里巴巴的级联式图生视频模型，属较早的高分辨率开源 I2V 发布。它通过「先生成、再细化」的两级级联，把一张静态图和一段文本提示词生成为短视频。
  architecture: I2VGen-XL has two latent diffusion stages. The base stage keeps the semantics and content of the input image coherent through two hierarchical encoders; the refinement stage adds detail guided by a brief text prompt and raises the resolution to 1280×720.
  architecture_zh: I2VGen-XL 由两级潜空间扩散模型组成：基础级通过两个层级编码器保持输入图像的语义与内容连贯；细化级在一段简短文本的引导下补充细节，并把分辨率提升到 1280×720。
  usage_notes: WorldFoundry runs the Hugging Face diffusers I2VGenXLPipeline with the official ali-vilab weights in float16. The pipeline needs both an image and a prompt; `wf run` falls back to its bundled sample image and prompt when either is omitted.
  usage_notes_zh: WorldFoundry 以 float16 加载 ali-vilab 官方权重，运行 Hugging Face diffusers 的 I2VGenXLPipeline。该 pipeline 同时需要图像和提示词；任一项未提供时，`wf run` 使用内置的示例图像和提示词。
  limitations:
  - It is a 2023 UNet cascade, older than the DiT-based image-to-video models in the catalog.
  limitations_zh:
  - 它是 2023 年的 UNet 级联模型，早于目录中基于 DiT 的图生视频模型。
  recommended_benchmarks:
  - id: aigcbench
    reason: I2V-focused benchmark suite.
    reason_zh: 面向图生视频的评测集。
