docs:
  publisher: JD.com (JoyAI / Echo Team)
  publisher_kind: company
  publisher_zh: 京东（JoyAI / Echo 团队）
  overview: JoyAI-Echo 1.5 is an inference-only long-form audio-video generator. Its
    R2V request can combine a prompt, an optional first frame, and as many as seven
    ordered image/audio memory slots so identity, voice, and story context persist
    across independently editable shots.
  overview_zh: JoyAI-Echo 1.5 是仅推理的长时程音视频生成模型。R2V 请求可组合提示词、可选首帧与最多七个有序图像/音频记忆槽，使角色身份、声音与故事上下文在可独立编辑的镜头间延续。
  architecture: The release builds on LTX-2.3 and adds few-step DMD generation plus a paired cross-modal memory bank. WorldFoundry calls the official runtime (Python 3.11, PyTorch 2.8, CUDA 12.8) in its dedicated environment through the upstream CLI.
  architecture_zh: 该版本基于 LTX-2.3，加入少步 DMD 生成与成对跨模态记忆库。WorldFoundry 在专用环境中通过上游 CLI 调用官方运行时（Python 3.11、PyTorch 2.8、CUDA 12.8）。
  usage_notes: Clone JoyAI-Echo at the pinned revision, prepare its dedicated environment, and pass source_root plus local Echo and gated Gemma checkpoints. Generation runs only when execute=True is set. FP4 also needs NVIDIA ModelOpt; production voice-memory extraction needs the upstream MSST setup.
  usage_notes_zh: 请检出固定 revision 的 JoyAI-Echo，准备专用环境，并传入 source_root、本地 Echo checkpoint 与受限访问的 Gemma checkpoint。生成必须显式设置 execute=True。FP4 还需 NVIDIA ModelOpt，生产级语音记忆提取需完成上游 MSST 设置。
  limitations:
  - The upstream release is marked for academic research and non-commercial use and remains subject to the LTX-2 Community License.
  limitations_zh:
  - 上游版本标注为学术研究与非商业用途，并受 LTX-2 Community License 约束。
  recommended_benchmarks:
  - id: chronomagic-bench
    reason: Long-horizon temporal continuity across generated shots.
    reason_zh: 评测生成镜头间的长时程时间连续性。
  - id: vbench
    reason: Baseline video quality and motion evaluation.
    reason_zh: 基础视频质量与运动评测。
