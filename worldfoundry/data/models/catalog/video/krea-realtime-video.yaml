docs:
  publisher: Krea AI
  publisher_kind: company
  publisher_zh: Krea AI
  overview: "Krea Realtime Video 14B is Krea AI's open realtime/streaming video generation model. Unlike batch T2V models, it targets low-latency streaming generation: text-to-video and video-to-video in a streaming regime. The route exposes num_blocks, resolution, fps, and seed controls. Alias krea-rt-14b resolves to this model."
  overview_zh: Krea Realtime Video 14B 是 Krea AI 开源的实时/流式视频生成模型。与批式 T2V 模型不同，它面向低延迟流式生成：以流式方式做文生视频与视频到视频。路径暴露 num_blocks、分辨率、fps 与 seed 控制。别名 krea-rt-14b 解析到该模型。
  architecture: Upstream describes it as a 14B autoregressive/streaming video model distilled for realtime block-wise generation (weights at krea/krea-realtime-video, apache-2.0). Generation proceeds in blocks controlled by num_blocks, with a prompt and optional video as input.
  architecture_zh: 上游将其描述为面向实时块式生成蒸馏的 14B 自回归/流式视频模型（权重在 krea/krea-realtime-video，apache-2.0）。生成按块进行，块数由 num_blocks 控制，输入为 prompt 与可选的 video。
  usage_notes: Stage krea/krea-realtime-video locally. Pass a prompt for text-to-video; add a video for video-to-video.
  usage_notes_zh: 先把 krea/krea-realtime-video 放到本地。文生视频只需 prompt；视频到视频时再提供 video。
  limitations:
  - True realtime rates require datacenter-class GPUs at 14B scale.
  limitations_zh:
  - 14B 规模下要达到真正实时帧率需要数据中心级 GPU。
  recommended_benchmarks:
  - id: vbench
    reason: Baseline quality check for streaming T2V output.
    reason_zh: 流式文生视频输出的基础质量检查。
