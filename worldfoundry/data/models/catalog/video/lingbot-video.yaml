docs:
  publisher: Robbyant (Ant Group)
  publisher_kind: company
  publisher_zh: 蚂蚁灵波科技（Robbyant，蚂蚁集团）
  overview: "LingBot-Video is Robbyant's video generation family for text-to-image, text-to-video, text+image-to-video, and video refinement. It comes in two checkpoint lines: a dense 1.3B model and a MoE 30B-A3B model that ships with a refiner."
  overview_zh: LingBot-Video 是蚂蚁灵波（Robbyant）的视频生成系列，支持文生图、文生视频、图文生视频与视频细化。它有两条 checkpoint 线：稠密 1.3B 模型与带细化器的 MoE 30B-A3B 模型。
  architecture: The dense 1.3B and MoE 30B-A3B (3B active) checkpoints share the inference surface; the MoE line adds a refiner stage. Supported execution paths include direct Diffusers, optional SGLang, FSDP, context-parallel, and CFG-parallel execution. The upstream-recommended stack pins a dedicated Transformers 5 / Diffusers 0.39 environment.
  architecture_zh: 稠密 1.3B 与 MoE 30B-A3B（激活 3B）两个 checkpoint 共享同一推理面；MoE 线增加了细化阶段。支持的执行路径包括直连 Diffusers、可选 SGLang、FSDP、上下文并行与 CFG 并行。上游推荐栈要求专用的 Transformers 5 / Diffusers 0.39 环境。
  usage_notes: 'Validated with the released checkpoints: the dense 1.3B model generates a 121-frame 832x480 video, and a short MoE 30B-A3B T2V clip matches the pinned official runner visually but not pixel for pixel. T2I produces an image even though the default artifact type is the T2V video route. Dense and MoE weights (apache-2.0) are external and must be staged before running.'
  usage_notes_zh: 已用发布的 checkpoint 验证：稠密 1.3B 模型可生成 121 帧、832x480 视频；MoE 30B-A3B 的短片文生视频与固定版本的官方运行器视觉一致，但并非逐像素相同。即使默认产物类型是 T2V 视频路径，T2I 也会产出图像。稠密与 MoE 权重（apache-2.0）为外部资产，运行前需先就位。
  limitations:
  - Pixel-exact parity, the standard five-second recipe, the MoE refiner, and modes other than short MoE T2V are not yet validated.
  - Requires the dedicated Transformers 5 / Diffusers 0.39 environment recommended upstream.
  - The prompt rewriter and training code are not included.
  limitations_zh:
  - 逐像素一致性、标准 5 秒配置、MoE 细化器以及 MoE 短片文生视频以外的模式尚未验证。
  - 需要上游推荐的专用 Transformers 5 / Diffusers 0.39 环境。
  - 不包含提示词改写与训练代码。
  recommended_benchmarks:
  - id: vbench
    reason: General T2V quality suite for both checkpoint lines.
    reason_zh: 两条 checkpoint 线通用的文生视频质量评测。
