id: longcat-video
name: LongCat-Video
tasks:
- text-to-video
- image-to-video
- video-continuation
- long-video-generation
output_artifacts:
- generated_video
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/meituan-longcat/LongCat-Video
  hf_repo_id: meituan-longcat/LongCat-Video
  license: mit
official_sources:
  paper: https://arxiv.org/abs/2510.22200
  project_page: https://meituan-longcat.github.io/LongCat-Video/
  github:
    url: https://github.com/meituan-longcat/LongCat-Video
    revision: 6b3f4b8582a8bc3f20f795735f5383716c4ba794
  huggingface:
  - repo_id: meituan-longcat/LongCat-Video
    status: confirmed
checkpoints:
- repo_id: meituan-longcat/LongCat-Video
  license: mit
integration:
  status: integrated
  notes:
  - A model-specific WorldFoundry pipeline is registered and runs the vendored
    in-tree demo scripts when explicit execute=True is supplied.
  - The route uses local LongCat-Video checkpoints in the unified environment
    profile.
runner_parity:
  status: pending
  notes:
  - Full official 93-frame / 50-step quality parity remains pending.
  - Per-run visual QA and artifact checks are tracked outside the model catalog.
runtime_profile: runtime-profile:longcat-video
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: longcat-video
catalog_category: video
catalog_scope: Video-generation and video-token catalog entries. Integrated entries
  expose WorldFoundry pipeline targets; metadata-only entries retain upstream provenance
  without runnable WorldFoundry backends.
docs:
  publisher: Meituan (LongCat)
  publisher_kind: company
  publisher_zh: 美团（LongCat 团队）
  overview: "LongCat-Video is Meituan's open video generation model focused on long-video generation: text-to-video, image-to-video, and native video continuation in one model. The pipeline runs the official demo scripts and executes only when you pass execute=True. Weights are MIT-licensed at meituan-longcat/LongCat-Video."
  overview_zh: LongCat-Video 是美团开源的视频生成模型，主打长视频：文生视频、图生视频与原生视频续写集于一个模型。pipeline 运行官方 demo 脚本，只有显式传入 execute=True 才会执行。权重为 MIT 许可，位于 meituan-longcat/LongCat-Video。
  architecture: Upstream positions LongCat-Video as a unified DiT-based generator where continuation is a first-class task, enabling minutes-long videos.
  architecture_zh: 上游将 LongCat-Video 定位为统一的 DiT 系生成器，视频续写是一等任务，可生成分钟级视频。
  usage_notes: Pass execute=True to run; calls without it fail fast. Stage the LongCat checkpoints locally before running. The official text-to-video setting is 93 frames at 480x832, 15 fps, with 50 steps.
  usage_notes_zh: 传入 execute=True 才会运行；不传时调用会快速失败。运行前先在本地准备 LongCat checkpoint。官方文生视频设置为 480x832、93 帧、15 fps、50 步。
  limitations:
  - No checkpoint-backed GPU output has been validated yet, including the official 93-frame / 50-step setting.
  limitations_zh:
  - 尚未验证基于 checkpoint 的 GPU 输出，包括官方 93 帧 / 50 步设置。
  recommended_benchmarks:
  - id: vbench
    reason: Baseline T2V quality suite.
    reason_zh: 基础文生视频质量评测。
  - id: chronomagic-bench
    reason: Long-horizon generation matches LongCat's continuation focus.
    reason_zh: 长时程生成评测，契合其续写定位。
