integration:
  status: integrated
  notes:
  - WorldFoundry implements LongVie over the canonical Wan model, encoders, VAE,
    VACE/control roles, checkpoint loaders, and shared staged runner.
  - The LongVie-1 adapter accepts an explicitly staged first-generation control
    weight and never loads the LongVie 2 DiT attention override.
  - Upstream has not published a first-generation checkpoint. Vchitect/LongVie2
    is a different variant and is deliberately rejected by this entry.
runner_parity:
  status: pending
  notes:
  - The native runner preserves the official target 640x352 segment size,
    history/noise continuation state, VRAM management, and optional
    USP ring/ulysses controls.
  - Official release-parity evidence remains pending; per-run artifact checks are
    tracked outside the model catalog.
runtime_profile: runtime-profile:longvie-1
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: longvie-1
catalog_category: video
catalog_scope: Video-generation and video-token catalog entries. Integrated entries
  expose WorldFoundry pipeline targets; metadata-only entries retain upstream provenance
  without runnable WorldFoundry backends.
docs:
  publisher: Shanghai AI Laboratory (Vchitect)
  publisher_kind: lab
  publisher_zh: 上海人工智能实验室（Vchitect 团队）
  overview: 'LongVie is a controllable ultra-long video generation framework from the Vchitect team: it drives a Wan-based diffusion backbone with dense depth and sparse point/track control videos to keep minute-scale videos consistent. longvie-1 is the first-generation adapter; upstream has not published first-generation weights, and the public Vchitect/LongVie2 checkpoint is not interchangeable.'
  overview_zh: LongVie 是 Vchitect 团队的可控超长视频生成框架：用稠密深度与稀疏点/轨迹控制视频来驱动基于 Wan 的扩散基座，使分钟级视频保持一致。longvie-1 是第一代适配器；上游尚未发布第一代权重，公开的 Vchitect/LongVie2 checkpoint 不能混用。
  architecture: LongVie-1 runs a Wan model with its encoders, VAE, and VACE control roles on the shared staged runner. The native runner preserves the official 640x352 segment size and the history/noise continuation state, with optional USP ring/ulysses distributed controls.
  architecture_zh: LongVie-1 在共享分段 runner 上运行 Wan 模型及其编码器、VAE 与 VACE 控制角色。原生 runner 保留官方 640x352 分段尺寸与历史/噪声续写状态，并支持可选的 USP ring/ulysses 分布式控制。
  usage_notes: Default calls fail fast unless execute=True. Execution additionally requires an explicitly staged first-generation control checkpoint because no official LongVie-1 weights are published. For the public checkpoint-backed route, use longvie-2.
  usage_notes_zh: 默认调用在未传 execute=True 时快速失败。由于官方尚未发布 LongVie-1 权重，执行时还必须显式提供第一代 control checkpoint。需要公开 checkpoint 支持的路径时请使用 longvie-2。
  limitations:
  - No official first-generation checkpoint is published, so release-matching output cannot be reproduced from public assets.
  - LongVie2 weights are rejected; loading them would mislabel second-generation output as LongVie-1.
  - Requires user-provided depth and point/track control videos; it is not a plain I2V model.
  limitations_zh:
  - 官方未发布第一代 checkpoint，无法用公开资产复现与官方发布一致的输出。
  - LongVie2 权重会被拒绝；加载它们会把第二代输出误标为 LongVie-1。
  - 需要用户提供深度与点/轨迹控制视频；它不是普通的图生视频模型。
  recommended_benchmarks:
  - id: chronomagic-bench
    reason: Long-horizon suite for minute-scale generation.
    reason_zh: 面向分钟级生成的长时程评测。
