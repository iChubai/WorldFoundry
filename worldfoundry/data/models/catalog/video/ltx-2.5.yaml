docs:
  publisher: Lightricks
  publisher_kind: company
  publisher_zh: Lightricks
  overview: LTX-2.5 is a 22B joint audio-video model. This inference-only integration
    exposes the native fast two-stage distilled recipe for text-to-video and image-to-video,
    including synchronized audio generation.
  overview_zh: LTX-2.5 是一个 22B 联合音视频模型。本次仅推理集成通过原生快速两阶段蒸馏配方支持文生视频、图生视频与同步音频生成。
  architecture: The official distilled path encodes prompts with the bundled Gemma 4 12B
    text encoder, jointly denoises video and audio at half resolution, applies the LTX-2.5
    latent spatial upscaler, performs the short second-stage refinement, and decodes
    through separate video and audio VAEs. NativeDiffusionPipeline runs the ltx-2.5
    joint-multistage recipe in-process with canonical Gemma 4, transformer, diffusion
    video decoder and duration-head components, shared loading/offload and BT.709 H.264/AAC
    media encoding. Definitions follow Lightricks/LTX-2 at a95ab856.
  architecture_zh: 官方蒸馏路径使用内嵌投影的 Gemma 4 12B 文本编码器，在半分辨率下联合去噪视频和音频，经 LTX-2.5
    潜空间上采样后进行短程第二阶段细化，最后由独立音频与视频 VAE 解码。WorldFoundry
    通过 NativeDiffusionPipeline 在进程内运行 ltx-2.5 joint-multistage 配方，使用规范的 Gemma 4、Transformer、
    扩散视频解码器与时长预测头，以及共享加载、卸载和 BT.709 H.264/AAC 编码组件。定义对应 Lightricks/LTX-2 的 a95ab856 版本。
  usage_notes: Accept the Hugging Face model terms, download the five required split
    components while preserving their repository folders, create the dedicated ltx-2.5
    environment, and pass execute=True. The optional duration head enables prompt-based
    automatic duration. timeout_seconds defaults to 7200; cooperative checks run between
    stages/steps and before artifact writes, without preempting a running CUDA kernel.
  usage_notes_zh: 请先接受 Hugging Face 模型条款，按仓库目录结构下载五个必需拆分组件，并创建独立的 ltx-2.5 环境；执行时显式传入
    execute=True。可选 duration head 可启用基于提示词的自动时长预测。timeout_seconds 默认 7200；协作式超时检查在阶段、
    采样步骤之间及产物写入前执行，不能抢占正在运行的 CUDA 内核。
  limitations:
  - The checkpoint is gated and approximately 66 GiB for the required distilled components.
  - Released-checkpoint GPU/MPS, quantization, offload and encoded-artifact parity remain unvalidated.
  - DFR, full/dev-model guidance, IC-LoRA, video editing, training, UI, and server
    surfaces are outside this inference-only integration.
  - The LTX-2.x Community License requires a paid license for covered commercial entities
    at or above its revenue threshold except for its defined non-commercial uses.
  limitations_zh:
  - Checkpoint 需要接受访问条款，必需蒸馏组件合计约 66 GiB。
  - 尚未验证发布权重的 GPU/MPS、量化、卸载与编码产物一致性。
  - DFR、完整 dev 模型引导、IC-LoRA、视频编辑、训练、UI 与服务端均不在本次仅推理集成范围内。
  - LTX-2.x Community License 对达到其营收门槛的适用商业实体要求付费许可，但其定义的非商业用途除外。
  recommended_benchmarks:
  - id: vbench
    reason: Baseline text/image-to-video quality and motion evaluation.
    reason_zh: 基础文生/图生视频质量与运动评测。
