integration:
  status: integrated
  notes:
  - WorldFoundry runs the native ltx-2.5 joint-multistage recipe in-process in the
    ltx-2.5 environment, using canonical LTX components and shared loading and media code.
  - Reduced random split-checkpoint CPU replays match pinned upstream stage latents
    and decoded tensors exactly for T2V, I2V, automatic duration and generated keyframes,
    including disk-backed loading.
  - timeout_seconds defaults to 7200 and is checked cooperatively between stages/steps
    and before artifact writes; it cannot preempt a running CUDA kernel.
