demo_parity:
  status: pending
  notes:
    - LTX-2 and LTX-2.3 I2V routes share WorldFoundry's native diffusion infrastructure.
    - LTX-2 and LTX-2.3 V2V use the official IC-LoRA pipeline with typed control videos; only small synthetic control cases have been visually checked.
    - Full upstream parity remains pending; per-run artifact checks are tracked
      outside the model catalog.
notes:
  - Tracked separately from LTX-Video 0.9.x because upstream publishes LTX-2.x under distinct Hugging Face repository ids.
  - The runnable V2V variants require Pose-Control or Union-Control IC-LoRA and a corresponding pose, Canny, or depth reference video; arbitrary RGB video is not equivalent.
  - I2V uses the official Spatial Upscaler as the boundary between two denoising stages. It is loaded automatically from spatial_upsampler_path; Studio does not expose it as an independent refiner toggle.
  - The current native distilled schedule is 8 first-stage steps plus 3 second-stage steps (11 total). The upstream DistilledPipeline documentation currently records 8 plus 4, so this integration must not be described as exact upstream pipeline parity until that difference is reconciled and checkpoint-backed validation is recorded.
catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight video generation models. Checkpoints are not tracked in git; local validation may download selected repos under cache/hfd.
catalog_policy:
  github: Validated with git ls-remote, preferring git ls-remote --symref <repo>.git HEAD for default branch and HEAD SHA.
  huggingface: Validated with the Hugging Face /api/models endpoint. Recorded repo id, sha, private, gated, license, and selected task tags only.
  parity: This manifest does not claim WorldFoundry runtime parity unless an explicit parity run and expected artifact are recorded.
integration:
  status: integrated
  notes:
    - WorldFoundry implements LTX-2.x I2V and LTX-2.3 T2V with native components and the generic joint multi-stage runner.
    - The controlled V2V routes invoke the version-matched official IC-LoRA pipeline through a dedicated Python environment.
runner_parity:
  status: partial_studio_visual_validation_verified
  notes:
    - WorldFoundry LTX-2 I2V pipeline target is registered and produced the nonblank
      Studio demo artifact recorded above.
    - WorldFoundry LTX-2.3 I2V pipeline target is registered and produced the
      nonblank Studio demo artifact recorded above.
    - Both V2V control bindings completed checkpoint-backed 17-frame synthetic-reference inference; natural-video semantic quality and default-resolution parity remain pending.
docs:
  publisher: Lightricks
  publisher_kind: company
  publisher_zh: Lightricks
  overview: LTX-2.x is Lightricks' current video model family. WorldFoundry provides native distilled I2V routes and official IC-LoRA control-video routes for LTX-2 and LTX-2.3. Both I2V routes generate demo videos; the V2V routes have run only on small synthetic control inputs.
  overview_zh: LTX-2.x 是 Lightricks 当前的视频模型系列。WorldFoundry 提供原生蒸馏版 I2V 路径，以及 LTX-2 和 LTX-2.3 的官方 IC-LoRA 控制视频路径。两条 I2V 路径均能生成 demo 视频；V2V 仅在小尺寸合成控制输入上运行过。
  architecture: The I2V route is a two-stage denoise with the official Spatial Upscaler as the boundary, loaded automatically from spatial_upsampler_path (not a separate Studio refiner toggle). The native distilled schedule runs 8 first-stage plus 3 second-stage steps.
  architecture_zh: I2V 路径为两段去噪，以官方 Spatial Upscaler 为分界，从 spatial_upsampler_path 自动加载（不是独立的 Studio 细化开关）。原生蒸馏调度为第一段 8 步加第二段 3 步。
  usage_notes: Select the matching distilled checkpoint and IC-LoRA, provide a pose control video for LTX-2 or a Canny/depth/pose control video for LTX-2.3, and use a Python environment with official ltx-pipelines.
  usage_notes_zh: 选择与版本匹配的蒸馏权重和 IC-LoRA；LTX-2 输入姿态控制视频，LTX-2.3 输入 Canny、深度或姿态控制视频，并使用安装官方 ltx-pipelines 的 Python 环境。
  limitations:
  - V2V has only run with synthetic pose/Canny controls at 256px; natural-video semantics, dynamic motion, and default-resolution quality are unverified.
  - The native distilled schedule uses 8+3 steps while upstream documents 8+4, so outputs can differ from the upstream pipeline.
  limitations_zh:
  - V2V 仅在 256px 合成姿态/Canny 控制输入上运行过；自然视频语义、动态运动及默认分辨率质量尚未验证。
  - 原生蒸馏调度为 8+3 步，上游文档为 8+4 步，因此输出可能与上游 pipeline 不同。
  recommended_benchmarks:
  - id: aigcbench
    reason: I2V-focused benchmark for the runnable routes.
    reason_zh: 针对可运行 I2V 路径的图生视频评测。
