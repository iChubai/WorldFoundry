demo_parity:
  status: pending
  notes:
    - LTX-2 and LTX-2.3 I2V routes share WorldFoundry's native diffusion infrastructure.
    - LTX-2 and LTX-2.3 V2V reuse canonical LTX components with typed control videos; tiny FP32 denoise/decode parity is exact.
    - Full upstream parity remains pending; per-run artifact checks are tracked
      outside the model catalog.
notes:
  - Tracked separately from LTX-Video 0.9.x because upstream publishes LTX-2.x under distinct Hugging Face repository ids.
  - The runnable V2V variants require Pose-Control or Union-Control IC-LoRA and a corresponding pose, Canny, or depth reference video; arbitrary RGB video is not equivalent.
  - I2V uses the official Spatial Upscaler as the boundary between two denoising stages. It is loaded automatically from spatial_upsampler_path; Studio does not expose it as an independent refiner toggle.
  - The native distilled schedule is 8 first-stage steps plus 3 second-stage steps (11 total). This matches the pinned IC-LoRA path; the separately recorded I2V documentation discrepancy (8+4) still requires checkpoint-backed I2V validation.
catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight video generation models. Checkpoints are not tracked in git; local validation may download selected repos under cache/hfd.
catalog_policy:
  github: Validated with git ls-remote, preferring git ls-remote --symref <repo>.git HEAD for default branch and HEAD SHA.
  huggingface: Validated with the Hugging Face /api/models endpoint. Recorded repo id, sha, private, gated, license, and selected task tags only.
  parity: This manifest does not claim WorldFoundry runtime parity unless an explicit parity run and expected artifact are recorded.
integration:
  status: integrated
  notes:
    - WorldFoundry implements LTX-2.x I2V and LTX-2.3 T2V with native components and the generic joint multi-stage runner.
    - The controlled V2V routes run canonical IC-LoRA recipes in-process in the ltx-2.5 environment (Torch 2.11, Transformers 5.x); T2V/I2V remain on unified.
runner_parity:
  status: partial_studio_visual_validation_verified
  notes:
    - WorldFoundry LTX-2 I2V pipeline target is registered and produced the nonblank
      Studio demo artifact recorded above.
    - WorldFoundry LTX-2.3 I2V pipeline target is registered and produced the
      nonblank Studio demo artifact recorded above.
    - Both native V2V bindings pass weight-free loading, request and media contracts; tiny real components match pinned upstream in FP32. Released-weight GPU replay remains pending.
docs:
  publisher: Lightricks
  publisher_kind: company
  publisher_zh: Lightricks
  overview: LTX-2.x is Lightricks' video model family. WorldFoundry provides native distilled T2V/I2V and IC-LoRA control-video routes for LTX-2 and LTX-2.3, reusing one canonical LTX stack.
  overview_zh: LTX-2.x 是 Lightricks 的视频模型系列。WorldFoundry 为 LTX-2 和 LTX-2.3 提供原生蒸馏版 T2V/I2V 与 IC-LoRA 控制视频路径，复用同一套规范 LTX 组件。
  architecture: 'The shared native diffusion assembler and joint multi-stage runner own loading, denoising and media decode. IC-LoRA V2V applies adapter weights and encoded control-video tokens only in stage 1; stage 2 upsamples and refines with clean base weights. The pinned IC-LoRA schedule is 8+3 steps; skip_stage_2 returns the half-resolution stage-1 result.'
  architecture_zh: 共享原生 diffusion assembler 与联合多阶段 runner 负责加载、去噪和媒体解码。IC-LoRA V2V 只在第一阶段使用适配器权重和编码后的控制视频 token，第二阶段使用未融合适配器的基座权重上采样并细化。固定版本的 IC-LoRA 调度为 8+3 步；skip_stage_2 返回第一阶段的半分辨率结果。
  usage_notes: Select the matching distilled checkpoint and IC-LoRA, a complete local Gemma 3 directory, and a pose control video for LTX-2 or Canny/depth/pose control video for LTX-2.3. V2V runs in the ltx-2.5 environment because the canonical split-Gemma loader requires Transformers 5.x; T2V/I2V remain on unified.
  usage_notes_zh: 选择版本匹配的蒸馏权重、IC-LoRA 和完整的本地 Gemma 3 目录。LTX-2 使用姿态控制视频，LTX-2.3 使用 Canny、深度或姿态控制视频。规范 split-Gemma 加载器需要 Transformers 5.x，因此 V2V 使用 ltx-2.5 环境，T2V/I2V 仍使用统一环境。
  limitations:
  - Native V2V has exact header-only released-key mapping and tiny FP32 component/denoise/decode parity. Released-weight GPU/MPS replay, CPU/disk offload on accelerators, dynamic-motion quality and default-resolution quality remain pending.
  - I2V retains its recorded 8+3 versus 8+4 documentation discrepancy; checkpoint-backed I2V parity remains pending.
  - Recorded I2V Studio demos cover specific configurations, not all variants.
  limitations_zh:
  - 原生 V2V 已通过仅 header 的发布权重键映射和小尺寸 FP32 组件、去噪与解码精确一致性验证。发布权重 GPU/MPS 回放、加速器上的 CPU/磁盘卸载、动态运动质量与默认分辨率质量仍待验证。
  - I2V 仍有记录在案的 8+3 与文档 8+4 调度差异，发布权重一致性待验证。
  - 已记录的 I2V Studio demo 仅覆盖特定配置，不代表全部变体。
  recommended_benchmarks:
  - id: aigcbench
    reason: I2V-focused benchmark for the runnable routes.
    reason_zh: 针对可运行 I2V 路径的图生视频评测。
