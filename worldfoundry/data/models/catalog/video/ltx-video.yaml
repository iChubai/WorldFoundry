id: ltx-video
name: LTX-Video
description: >-
  Native WorldFoundry integration for the LTX-Video 0.9.8 distilled
  image-to-video route. The implemented path uses the official spatial
  upscaler between two denoising stages; broader upstream task support is not
  yet exposed as a WorldFoundry runner.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: ltx-video
runtime_profile: runtime-profile:ltx-video-i2v
tasks:
  - text-to-video
  - image-to-video
source_status:
  status: confirmed_official_github
  github:
    url: https://github.com/Lightricks/LTX-Video
    verified_by: git ls-remote --symref https://github.com/Lightricks/LTX-Video.git HEAD
    default_branch: main
    head_sha: 4b2d053057623ddd4d0a1d3e9cd28890e9ef487f
checkpoint:
  status: confirmed_public_hf
  verified_by: GET https://huggingface.co/api/models/<repo_id>
  repos:
    - id: Lightricks/LTX-Video
      sha: 8984fa25007f376c1a299016d0957a37a2f797bb
      license: other
      private: false
      gated: false
      tasks:
        - image-to-video
    - id: Lightricks/LTX-Video-0.9.5
      sha: e58e28c39631af4d1468ee57a853764e11c1d37e
      license: other
      private: false
      gated: false
      tasks:
        - text-to-video
        - image-to-video
    - id: Lightricks/LTX-Video-0.9.7-dev
      sha: 2101082f5eb5540770a2df43747feadb6f69b889
      license: other
      private: false
      gated: false
      tasks:
        - text-to-video
        - image-to-video
    - id: Lightricks/LTX-Video-0.9.8-13B-distilled
      sha: 7c64400e1861cc0d7b98d570a1926d5408ec60cd
      license: other
      private: false
      gated: false
      tasks:
        - image-to-video
  notes: Several similarly named repos returned 401 or were non-official mirrors and are not listed.
demo_parity:
  status: pending
  notes:
    - The native LTX-Video I2V route is wired with local checkpoint assets,
      reference image, fps, guidance_scale, resolution, frame count, step count,
      and seed controls.
    - Full upstream parity remains pending; per-run artifact checks are tracked
      outside the model catalog.
notes:
  - License is reported as 'other' in the official Hugging Face cards.
  - The runnable WorldFoundry route is LTX-Video 0.9.8 I2V. Family-level T2V labels are upstream capability metadata, not a current local route.
  - The spatial upscaler runs automatically between the first and second denoising stages; it is not a separate Studio refiner switch.
  - Full checkpoint-backed parity with the upstream LTX-Video pipeline remains pending.
catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight video generation models. Checkpoints are not tracked in git; local validation may download selected repos under cache/hfd.
catalog_policy:
  github: Validated with git ls-remote, preferring git ls-remote --symref <repo>.git HEAD for default branch and HEAD SHA.
  huggingface: Validated with the Hugging Face /api/models endpoint. Recorded repo id, sha, private, gated, license, and selected task tags only.
  parity: This manifest does not claim WorldFoundry runtime parity unless an explicit parity run and expected artifact are recorded.
official_sources:
  project_page: https://ltx.video
  paper: https://arxiv.org/abs/2501.00103
integration:
  status: integrated
  notes:
    - WorldFoundry implements LTX-Video 0.9.8 with the same native transformer, VAE, scheduler, loader, and joint-state runner used by LTX-2.x.
    - Transformers supplies the T5 architecture only; Diffusers is not used as an inference backend.
runner_parity:
  status: pending
  notes:
    - WorldFoundry LTX-Video I2V native pipeline target is registered.
    - Broader T2V/I2V upstream parity remains a separate validation stage.
variants:
  - id: ltx-video-i2v
    task: image-to-video
    runtime_profile: ltx-video-i2v
    runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
    pipeline_binding: ltx-video-i2v
    integration:
      status: integrated
    runner_parity:
      status: pending
      notes:
        - The native LTX-Video I2V route is wired; per-run artifact checks are
          tracked outside the model catalog.
docs:
  publisher: Lightricks
  publisher_kind: company
  publisher_zh: Lightricks
  overview: LTX-Video is Lightricks' earlier fast video generation model. WorldFoundry runs its 0.9.8 distilled image-to-video route natively; like LTX-2.x it runs a two-stage denoise with the official spatial upscaler in between. The only runnable variant is ltx-video-i2v; the family's text-to-video label describes upstream capability.
  overview_zh: LTX-Video 是 Lightricks 较早的高速视频生成模型。WorldFoundry 原生运行其 0.9.8 蒸馏图生视频路径；与 LTX-2.x 一样采用两段去噪，中间接官方空间上采样器。唯一可运行的 variant 是 ltx-video-i2v；系列级的文生视频标签描述的是上游能力。
  architecture: Uses the same native transformer, VAE, scheduler, loader, and joint-state runner as LTX-2.x. The T5 text encoder loads as a Transformers model; Diffusers is not an inference backend. The spatial upscaler runs automatically between the two denoising stages.
  architecture_zh: 与 LTX-2.x 共用同一套原生 Transformer、VAE、调度器、加载器与联合状态 runner。T5 文本编码器以 Transformers 模型加载；Diffusers 不是推理后端。空间上采样器在两段去噪之间自动运行。
  usage_notes: The distilled recipe is fixed at 10 Euler steps (7 + 3) with guidance 1.0; the runtime rejects other step counts or CFG values. The official Hugging Face cards report license 'other'; review them before commercial use.
  usage_notes_zh: 蒸馏配方固定为 10 步 Euler（先 7 后 3）、guidance 1.0，运行时会拒绝其他步数或 CFG。官方 Hugging Face 卡片许可为“other”，商用前请审阅。
  limitations:
  - Only the 0.9.8 image-to-video route runs locally; text-to-video requests are rejected.
  limitations_zh:
  - 本地仅 0.9.8 图生视频路径可运行；文生视频请求会被拒绝。
  recommended_benchmarks:
  - id: aigcbench
    reason: I2V benchmark for the runnable route.
    reason_zh: 针对可运行 I2V 路径的评测。
