docs:
  publisher: Genmo
  publisher_kind: company
  publisher_zh: Genmo
  overview: Mochi-1 is Genmo's open text-to-video model, released as a preview checkpoint and known for strong motion quality among open models at its release. WorldFoundry runs it as the mochi-1-preview-t2v variant with the official preview checkpoint.
  overview_zh: Mochi-1 是 Genmo 开源的文生视频模型，以 preview checkpoint 形式发布，发布时在开源模型中以运动质量见长。WorldFoundry 以 mochi-1-preview-t2v variant 运行官方 preview checkpoint。
  architecture: Upstream describes Mochi-1 as a 10B-parameter Asymmetric Diffusion Transformer (AsymmDiT) with a dedicated video VAE.
  architecture_zh: 上游将 Mochi-1 描述为 100 亿参数的非对称扩散 Transformer（AsymmDiT），配专用视频 VAE。
  usage_notes: Stage the preview checkpoint (genmo/mochi-1-preview) before running. The GitHub organization is genmoai, while Hugging Face uses genmo.
  usage_notes_zh: 运行前需准备 preview checkpoint（genmo/mochi-1-preview）。GitHub 组织名为 genmoai，Hugging Face 为 genmo。
  limitations:
  - No checkpoint-backed GPU output has been validated yet, including the official 31-frame / 64-step quality setting.
  limitations_zh:
  - 尚未验证基于 checkpoint 的 GPU 输出，包括官方 31 帧、64 步的画质设置。
  recommended_benchmarks:
  - id: vbench
    reason: Standard T2V quality suite.
    reason_zh: 标准文生视频质量评测。
