docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: "OmniVinci is NVIDIA's omni-modal understanding LLM: one model that reasons over images, video, and audio together. It answers questions rather than generating media: tasks are multimodal reasoning, audio reasoning, and image/video question answering, and the artifact is a model_response."
  overview_zh: OmniVinci 是英伟达的全模态理解大模型：单一模型同时对图像、视频与音频进行推理。它用于回答问题而非生成内容：任务为多模态推理、音频推理与图像/视频问答，产物是 model_response。
  architecture: NVIDIA describes OmniVinci as an omni-modal LLM with joint vision-audio alignment (public release at nvidia/omnivinci). Inputs are a prompt plus an image or video.
  architecture_zh: 英伟达将 OmniVinci 描述为具备视觉-音频联合对齐的全模态 LLM（公开发布于 nvidia/omnivinci）。输入为 prompt 加图像或视频。
  usage_notes: Use it to interrogate videos produced by generation models, for example by asking about physical plausibility or event order.
  usage_notes_zh: 适合用来审视生成模型产出的视频，例如就物理合理性或事件顺序提问。
