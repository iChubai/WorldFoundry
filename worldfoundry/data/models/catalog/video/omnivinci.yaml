docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: 'OmniVinci is NVIDIA''s omni-modal understanding LLM: one model that reasons over images, video, and audio together. In this catalog it is an understanding/reasoning entry, not a generator — tasks are multimodal reasoning, audio reasoning, and image/video question answering, and the artifact is a model_response.'
  overview_zh: OmniVinci 是英伟达的全模态理解大模型：单一模型同时对图像、视频与音频进行推理。在本 catalog 中它是理解/推理类条目，而非生成器——任务为多模态推理、音频推理与图像/视频问答，产物是 model_response。
  architecture: OmniVinci combines a Qwen2 causal decoder, a Dynamic-S2 SigLIP vision tower and a Qwen2Audio encoder with temporal pooling and rotary embeddings. WorldFoundry packages the Apache-2.0 inference glue from nvidia/omnivinci revision 7b3777b and loads native Transformers backbones from local checkpoint data.
  architecture_zh: OmniVinci 结合 Qwen2 自回归解码器、Dynamic-S2 SigLIP 视觉编码器与 Qwen2Audio 音频编码器，并使用时间池化和旋转位置编码。WorldFoundry 将 nvidia/omnivinci 的 7b3777b 版本 Apache-2.0 推理组件纳入包内，从本地 checkpoint 数据加载原生 Transformers 骨干。
  usage_notes: Use it to ask questions about images and videos, rather than to generate content. Video requests default to 8 frames (max_video_frames accepts 1–128); load_audio_in_video is false by default. The local checkpoint must include its llm, vision_tower, sound_tower and both projector directories, tokenizer data and qwen2.jinja.
  usage_notes_zh: 用于图像与视频问答，而非内容生成。视频请求默认采样 8 帧（max_video_frames 接受 1–128）；load_audio_in_video 默认为 false。本地 checkpoint 需包含 llm、vision_tower、sound_tower、两个投影器目录、tokenizer 数据和 qwen2.jinja。
  limitations:
  - 'Runner parity is recorded as pending: the WorldFoundry route is wired, but a checkpoint-backed GPU artifact has not been verified in this workspace, so do not treat this page as proof of a validated end-to-end run.'
  - Checkpoints are external assets under NVIDIA OneWay Noncommercial terms; missing weights are reported at runtime.
  - FlashAttention 2 and CUDA are required by the released encoder loaders. Video audio also requires Decord and OpenAI Whisper.
  limitations_zh:
  - Runner parity 记录为 pending：WorldFoundry 路径已接好，但本工作区尚未完成 checkpoint 加载的 GPU 产物验证，请勿把本页当作端到端跑通的证明。
  - Checkpoint 是受 NVIDIA OneWay Noncommercial 条款约束的外部资产；缺失权重会在运行时报告。
  - 发布版编码器加载器需要 FlashAttention 2 与 CUDA。视频音频还需要 Decord 和 OpenAI Whisper。
