docs:
  publisher: Tencent (ARC Lab)
  publisher_kind: company
  publisher_zh: 腾讯（ARC Lab）
  overview: "Open-MAGVIT2 is Tencent ARC's open reproduction of the MAGVIT-v2 lookup-free visual tokenizer, plus autoregressive generation on top of it. WorldFoundry runs its class-conditional ImageNet image generation route: 256-token generation produces a 256x256 PNG image, not video. Validated with the released checkpoint: generating ImageNet class 207 yields a semantically correct image."
  overview_zh: Open-MAGVIT2 是腾讯 ARC 对 MAGVIT-v2 免查表（lookup-free）视觉分词器的开源复现，并在其上构建自回归生成。WorldFoundry 运行其 ImageNet 类条件图像生成路径：256 token 生成产出 256x256 的 PNG 图像，而非视频。已用发布的 checkpoint 验证：生成 ImageNet 类别 207 得到语义正确的图像。
  architecture: 'Two parts: the lookup-free quantization (LFQ) tokenizer with a very large codebook, and an autoregressive transformer that predicts visual tokens for a requested ImageNet class. The class_id input selects the category.'
  architecture_zh: 包含两部分：带超大码本的免查表量化（LFQ）分词器，以及为指定 ImageNet 类别预测视觉 token 的自回归 Transformer。class_id 输入选择类别。
  usage_notes: Stage the TencentARC/Open-MAGVIT2 weights (apache-2.0) and set class_id to choose the ImageNet category. This route is class-conditional image generation, not prompt-to-video; video tokenization is an upstream tokenizer capability.
  usage_notes_zh: 请就位 TencentARC/Open-MAGVIT2 权重（apache-2.0），并用 class_id 选择 ImageNet 类别。该路径是类条件图像生成，不是提示词生成视频；视频分词是其分词器在上游支持的能力。
  limitations:
  - The runnable route generates class-conditional images only — no free-form prompts, no video output.
  - ImageNet-class conditioning limits subject diversity to the 1000 classes.
  limitations_zh:
  - 可运行路径仅支持类条件图像生成——没有自由提示词，也没有视频输出。
  - ImageNet 类条件把主体多样性限制在 1000 个类别内。
