id: open-sora-plan
name: Open-Sora-Plan
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
runtime_profile: runtime-profile:open-sora-plan
tasks:
- text-to-video
source_status:
  status: confirmed_official_github
  github:
    url: https://github.com/PKU-YuanGroup/Open-Sora-Plan
    verified_by: git ls-remote --symref https://github.com/PKU-YuanGroup/Open-Sora-Plan.git
      HEAD
    default_branch: main
    head_sha: f7fa604f4e3a523d6b973e4c89a5620ed1aff65a
checkpoint:
  status: confirmed_public_hf
  verified_by: GET https://huggingface.co/api/models/<repo_id>
  repos:
  - id: LanguageBind/Open-Sora-Plan-v1.3.0
    sha: cd3b49a3500b98724bd01eb00bdae59f1c247750
    license: mit
    private: false
    gated: false
    tasks:
    - text-to-video
  notes: Open-Sora-Plan has older public LanguageBind releases (v1.0.0 through
    v1.2.0) and a v1.5.0 NPU/MindSpeed-oriented release, but the validated
    WorldFoundry GPU route uses v1.3.0 plus google/mt5-xxl. The text encoder is
    staged by scripts/inference/prepare_model_infer.sh to avoid duplicating the
    50GB checkpoint inside both WORLDFOUNDRY_CKPT_DIR and WORLDFOUNDRY_HFD_ROOT.
official_sources:
  paper: https://arxiv.org/abs/2412.00131
integration:
  status: integrated
  notes:
  - WorldFoundry route is complete; missing checkpoint/assets are reported at runtime.
demo_parity:
  status: passed
  notes:
  - >-
    Studio/API validation uses the official v1.3 GPU demo recipe: Tokyo street
    prompt, LanguageBind/Open-Sora-Plan-v1.3.0, mt5-xxl, torchrun
    --nproc_per_node=8, 93 frames, 352x640, fps 18, 100 EulerAncestralDiscrete
    steps, guidance 7.5, and seed 1234.
  - >-
    Expected validation output decodes as 93 non-empty 640x352 frames and passes
    visual QA for the Tokyo street prompt.
notes: Official GitHub is PKU-YuanGroup; official HF releases are under LanguageBind.
catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight
  video generation models. Checkpoints are not tracked in git; local validation may
  download selected repos under cache/hfd.
catalog_policy:
  github: Validated with git ls-remote, preferring git ls-remote --symref <repo>.git
    HEAD for default branch and HEAD SHA.
  huggingface: Validated with the Hugging Face /api/models endpoint. Recorded repo
    id, sha, private, gated, license, and selected task tags only.
  parity: This manifest does not claim WorldFoundry runtime parity unless an explicit
    parity run and expected artifact are recorded.
docs:
  publisher: Peking University (Yuan Group)
  publisher_kind: university
  publisher_zh: 北京大学（袁粒课题组）
  overview: Open-Sora-Plan is Peking University Yuan Group's open text-to-video effort (HF releases under the LanguageBind org), developed independently from HPC-AI Tech's Open-Sora despite the similar name. WorldFoundry runs the v1.3.0 GPU release.
  overview_zh: Open-Sora-Plan 是北京大学袁粒课题组的开源文生视频项目（HF 发布在 LanguageBind 组织下），虽与潞晨的 Open-Sora 同名相近，但相互独立。WorldFoundry 运行 v1.3.0 GPU 版本。
  architecture: The project pairs a video VAE (WF-VAE in later versions) with a diffusion transformer denoiser, per upstream releases. The WorldFoundry route takes a prompt only and writes a generated video.
  architecture_zh: 该项目将视频 VAE（后期版本为 WF-VAE）与扩散 Transformer 去噪器配对，见上游发布。WorldFoundry 路径只接受 prompt，输出生成视频。
  usage_notes: 'Stage LanguageBind/Open-Sora-Plan-v1.3.0 and google/mt5-xxl. Official GitHub is PKU-YuanGroup; checkpoints live under LanguageBind on Hugging Face — use those exact orgs when staging weights. Validated with the official v1.3 demo: the pipeline generates 93 frames at 640x352 and 18 fps with 100 Euler-ancestral steps.'
  usage_notes_zh: 请就位 LanguageBind/Open-Sora-Plan-v1.3.0 与 google/mt5-xxl。官方 GitHub 为 PKU-YuanGroup；checkpoint 在 Hugging Face 的 LanguageBind 组织下——就位权重时请使用这两个准确的组织名。已按官方 v1.3 demo 验证：pipeline 以 100 步 Euler-ancestral 采样生成 93 帧、640x352、18 fps 的视频。
  limitations:
  - The GPU route uses v1.3.0; the v1.5.0 release targets Ascend NPU / MindSpeed.
  limitations_zh:
  - GPU 路径使用 v1.3.0；v1.5.0 版本面向昇腾 NPU / MindSpeed。
  recommended_benchmarks:
  - id: vbench
    reason: Standard open T2V quality suite.
    reason_zh: 标准开源文生视频质量评测。
