catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight
  video generation models. Checkpoints are not tracked in git; local validation may
  download selected repos under cache/hfd.
catalog_policy:
  github: Validated with git ls-remote, preferring git ls-remote --symref <repo>.git
    HEAD for default branch and HEAD SHA.
  huggingface: Validated with the Hugging Face /api/models endpoint. Recorded repo
    id, sha, private, gated, license, and selected task tags only.
  parity: This manifest does not claim WorldFoundry runtime parity unless an explicit
    parity run and expected artifact are recorded.
docs:
  publisher: HPC-AI Tech
  publisher_kind: company
  publisher_zh: 潞晨科技（HPC-AI Tech）
  overview: Open-Sora is HPC-AI Tech's fully open text-to-video project — model, training code, and data pipeline are all published, which made it a popular reproducible baseline. WorldFoundry runs the v1.2 STDiT-v3 inference route, which needs separate model and VAE repositories.
  overview_zh: Open-Sora 是潞晨科技（HPC-AI Tech）的全开源文生视频项目，模型、训练代码与数据管线全部公开，因此成为流行的可复现基线。WorldFoundry 运行 v1.2 STDiT-v3 推理路径，需要模型与 VAE 两个独立仓库。
  architecture: 'Open-Sora uses a spatial-temporal diffusion transformer (its STDiT design) over a video VAE latent space, per the upstream project. It takes a text prompt only, and its checkpoint comes as two repositories: model and VAE.'
  architecture_zh: Open-Sora 采用视频 VAE 潜空间上的时空扩散 Transformer（其 STDiT 设计），见上游项目。输入仅为文本提示词，checkpoint 分为模型与 VAE 两个仓库。
  usage_notes: Stage both the model and VAE repositories before running — forgetting the VAE is the most common failure. Best used as a reproducible research baseline rather than a production generator.
  usage_notes_zh: 运行前请同时就位模型与 VAE 两个仓库，漏掉 VAE 是最常见的失败原因。它更适合作为可复现研究基线，而非生产级生成器。
  limitations:
  - Text-to-video only; image-to-video and video-to-video from later upstream releases are not available.
  limitations_zh:
  - 仅支持文生视频；上游后续版本的图生视频与视频到视频不可用。
  recommended_benchmarks:
  - id: vbench
    reason: The suite Open-Sora releases habitually report on.
    reason_zh: Open-Sora 系列发布惯常引用的评测。
