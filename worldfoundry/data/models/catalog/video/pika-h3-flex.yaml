catalog_category: video
docs:
  publisher: Pika Labs
  overview: Six-step MiniMax-H3 adapter for joint video/audio generation with endpoint
    and multimodal image references.
  overview_zh: 基于 MiniMax-H3 的六步联合音视频适配器，支持首尾帧与多模态图像参考。
  usage_notes: Stage the Pika H3 Flex fl2va or ref2va adapter together with the pinned
    MiniMax-H3 base snapshot. Use adapter_task=ref2va for reference generation.
  usage_notes_zh: 将 Pika H3 Flex 的 fl2va 或 ref2va 适配器与固定版本 MiniMax-H3 基础快照一起准备；参考图生成使用
    adapter_task=ref2va。
  limitations:
  - Native output is 24 fps with 32 kHz stereo audio and six generator evaluations.
  - The current in-tree reference path accepts image references; video and standalone-audio
    reference preprocessing remain pending.
  - Full 480p/768p bucket parity, multi-GPU execution and checkpoint-backed artifact
    validation remain pending.
  limitations_zh:
  - 原生输出为 24 fps、32 kHz 立体声，并执行六次生成评估。
  - 当前树内参考路径接受图像参考；视频与独立音频参考的预处理仍待补齐。
  - 完整 480p/768p bucket 一致性、多卡执行及真实权重产物验证仍待完成。
