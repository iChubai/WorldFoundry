docs:
  publisher: Alibaba (Qwen)
  publisher_kind: company
  publisher_zh: 阿里巴巴（通义千问 Qwen）
  overview: "Qwen2.5-Omni is Alibaba's end-to-end omni-modal model: it perceives text, images, audio, and video. WorldFoundry uses it for understanding and reasoning — multimodal reasoning, audio reasoning, and image/video QA — with model_response artifacts. The supported weight is the 7B release (Qwen/Qwen2.5-Omni-7B)."
  overview_zh: Qwen2.5-Omni 是阿里的端到端全模态模型：能感知文本、图像、音频与视频。WorldFoundry 用它做理解与推理——多模态推理、音频推理与图像/视频问答——产物为 model_response。支持的权重是 7B 版本（Qwen/Qwen2.5-Omni-7B）。
  architecture: 'Alibaba describes Qwen2.5-Omni with a Thinker-Talker design: a reasoning core plus a speech-generation head, with TMRoPE alignment for audio-video time synchronization. WorldFoundry uses only the text-response path: prompt, image, or video in, model response out.'
  architecture_zh: 阿里将 Qwen2.5-Omni 描述为 Thinker-Talker 设计：推理核心加语音生成头，并用 TMRoPE 做音视频时间对齐。WorldFoundry 只使用文本响应路径：输入 prompt/image/video，输出模型响应。
  usage_notes: Use it to caption, interrogate, or QA videos generated by other models. The 7B scale runs on a single modern GPU.
  usage_notes_zh: 可用于为其它模型生成的视频做描述、问答或质检。7B 规模单张现代 GPU 即可运行。
  limitations:
  - 'Only the text-response path is supported: there is no `audio` input and no Talker / streaming-speech output.'
  - Responses have not yet been validated on GPU with the released checkpoint.
  limitations_zh:
  - 只支持文本响应路径：没有 `audio` 输入，也没有 Talker / 流式语音输出。
  - 尚未用发布的 checkpoint 在 GPU 上验证响应结果。
