docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'SAMA 14B is an open instruction-guided video editing model: it takes a source video and a text instruction. The released inference route does not accept a spatial mask or separate reference image. Weights are apache-2.0 at syxbb/SAMA-14B.'
  overview_zh: SAMA 14B 是开源的指令引导视频编辑模型，输入是源视频和文本指令。发布的推理入口不接受空间蒙版或单独的参考图。权重位于 syxbb/SAMA-14B，采用 apache-2.0 许可证。
  architecture: A 14B-parameter editing model with a prompt/image/video input contract. See the upstream GitHub (Cynthiazxy123/SAMA) for architecture details.
  architecture_zh: 14B 参数的视频编辑模型，输入契约为 prompt/image/video。架构细节请查阅上游 GitHub（Cynthiazxy123/SAMA）。
  usage_notes: Supply a source video and an edit instruction. A 17-frame edit with the released checkpoint was checked against the official implementation.
  usage_notes_zh: 提供源视频和编辑指令。使用官方权重的 17 帧编辑已与官方实现对照。
  limitations:
  - Only a 17-frame run was checked against official inference; other inputs, longer videos, and broader editing quality are not validated.
  - The released SAMA inference entrypoint has no spatial mask or separate reference-image input.
  limitations_zh:
  - 仅一次 17 帧运行与官方推理做过对照；其他输入、更长视频及更广泛的编辑质量尚未验证。
  - 发布的 SAMA 推理入口没有空间蒙版或单独的参考图输入。
