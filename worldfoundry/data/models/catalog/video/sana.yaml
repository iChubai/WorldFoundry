integration:
  status: runtime_ported
  notes:
  - Sana checkpoint math is split across the canonical denoiser, network, encoder,
    autoencoder, initializer, scheduler, and recipe roles under
    worldfoundry.base_models.diffusion_model.
  - Checkpoint assets remain external Hugging Face artifacts.
  - The 2B 480p video path is wired through the in-tree runtime; official long
    configuration parity remains pending.
  - SANA-Streaming long and bidirectional V2V routes use the vendored official
    BF16 CLI, hybrid DiT blocks, fused GDN kernels, and causal LTX-2 VAE wrapper.
  - SANA-Streaming sources are synchronized from NVlabs/Sana commit
    78be97aec4efabd73ddb97d47e9f7c13a60ef90a; the paper's MPQ deployment path
    is not part of the public BF16 inference recipe.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: sana
runtime_profile: runtime-profile:sana
runner_parity:
  status: pending
  notes:
  - SanaSynthesis plan-onlys and executes the official in-tree CLI scripts.
  - Full 50-step / longer-frame official quality parity remains pending.
