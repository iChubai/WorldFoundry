  without runnable WorldFoundry backends.
docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: Sana is NVIDIA's efficient generation family with twenty variants spanning text-to-image (600M–4.8B, up to 4K), ControlNet-conditioned image generation, Sana-Video 2B text-to-video at 480p/720p, LongSANA long video, and SANA-Streaming video-to-video (long and bidirectional).
  overview_zh: Sana 是英伟达的高效生成系列，共二十个 variant，覆盖文生图（600M–4.8B，最高 4K）、ControlNet 条件图像生成、Sana-Video 2B 的 480p/720p 文生视频、LongSANA 长视频，以及 SANA-Streaming 的视频到视频（长时与双向）。
  architecture: Sana's efficiency comes from a deep-compression autoencoder (32x) plus linear-attention DiT blocks and a small LLM text encoder, per the publication (arXiv 2410.10629). The SANA-Streaming routes use the official BF16 CLI with hybrid DiT blocks, fused GDN kernels, and a causal LTX-2 VAE.
  architecture_zh: Sana 的高效来自深压缩自编码器（32x）、线性注意力 DiT 块与小型 LLM 文本编码器，见论文（arXiv 2410.10629）。SANA-Streaming 路径使用官方 BF16 CLI，包含混合 DiT 块、融合 GDN 核与因果 LTX-2 VAE。
  usage_notes: 'Validated with the long-streaming checkpoint: an A100 run decodes 81 frames at 1280x704, 16 FPS. SANA-Streaming accepts a source video path or hf:// URI.'
  usage_notes_zh: 已用 long-streaming checkpoint 验证：在 A100 上的运行解码出 81 帧 1280x704、16 FPS 视频。SANA-Streaming 接受源视频路径或 hf:// URI。
  limitations:
  - Quality parity with the official full 50-step, longer-frame configuration is not verified.
  - "Twenty variants share one page: check each variant's task before assuming video capability (most are text-to-image)."
  - The MPQ deployment path from the paper is not available in the public BF16 recipe.
  limitations_zh:
  - 与官方完整 50 步、更长帧数配置的质量一致性尚未验证。
  - 二十个 variant 共用一个页面：使用前先确认各 variant 的任务（多数是文生图）。
  - 论文中的 MPQ 部署路径在公开 BF16 配方中不可用。
  recommended_benchmarks:
  - id: vbench
    reason: Quality suite for the Sana-Video T2V routes.
    reason_zh: Sana-Video 文生视频路径的质量评测。
  - id: sana-wm-bench
    reason: Sana-specific world-model benchmark.
    reason_zh: 针对 Sana 的世界模型评测。
