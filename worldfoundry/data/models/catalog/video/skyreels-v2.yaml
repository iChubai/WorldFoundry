official_sources:
  paper: https://arxiv.org/abs/2504.13074
integration:
  status: integrated
  notes:
  - The 1.3B route is assembled from the shared native Wan graph, conditioner, VAE,
    scheduler, initializer, loader, and runner.
demo_parity:
  status: pending_visual_qa
  notes: Checkpoint structure parity is complete; release parity still requires a
    97-frame native artifact and visual QA.
native_diffusion:
  recipe_id: skyreels-v2
  architecture: skyreels-v2-wan-df-1.3b
  backend: worldfoundry-native-diffusion
  checkpoint_graph_match: 830/830
  shared_components:
  - Wan UMT5 conditioner and tokenizer
  - Wan video VAE and UniPC scheduler
  - native loader, CFG runner, and block offload
notes: The upstream graph is represented as an FPS-conditioned Wan capability; the
  vendored CLI/pipeline is not an inference backend.
catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight
  video generation models. Checkpoints are not tracked in git; local validation may
  download selected repos under cache/hfd.
catalog_policy:
  github: Validated with git ls-remote, preferring git ls-remote --symref <repo>.git
    HEAD for default branch and HEAD SHA.
  huggingface: Validated with the Hugging Face /api/models endpoint. Recorded repo
    id, sha, private, gated, license, and selected task tags only.
  parity: This manifest does not claim WorldFoundry runtime parity unless an explicit
    parity run and expected artifact are recorded.
docs:
  publisher: Skywork AI (Kunlun)
  publisher_kind: company
  publisher_zh: 昆仑万维（Skywork AI）
  overview: SkyReels-V2 is Skywork AI's open film-generation model family built on the Wan architecture, covering text-to-video and image-to-video. WorldFoundry runs the 1.3B models on its shared native Wan graph, conditioner, VAE, scheduler, and loader.
  overview_zh: SkyReels-V2 是昆仑万维 Skywork AI 基于 Wan 架构的开源影视生成模型系列，覆盖文生视频与图生视频。WorldFoundry 用共享的原生 Wan 图、条件器、VAE、调度器与加载器运行其 1.3B 模型。
  architecture: SkyReels-V2's diffusion-forcing design conditions on frame rate to enable long-form generation. WorldFoundry runs it as a native Wan graph with prompt and image inputs and a generated video as output.
  architecture_zh: SkyReels-V2 的 diffusion-forcing 设计以帧率为条件支撑长视频生成。WorldFoundry 将其作为原生 Wan 图运行，输入 prompt/image，输出生成视频。
  usage_notes: Use the 1.3B checkpoints (Skywork/SkyReels-V2-DF-1.3B-540P for text-to-video, Skywork/SkyReels-V2-I2V-1.3B-540P for image-to-video). Larger upstream checkpoints (5B/14B) are not supported.
  usage_notes_zh: 请使用 1.3B checkpoint（文生视频用 Skywork/SkyReels-V2-DF-1.3B-540P，图生视频用 Skywork/SkyReels-V2-I2V-1.3B-540P）。不支持上游更大的 checkpoint（5B/14B）。
  limitations:
  - Only the 1.3B models are supported; larger upstream variants are not.
  - Hugging Face lists the checkpoint license as 'other'; review the terms before use.
  limitations_zh:
  - 仅支持 1.3B 模型，不支持上游更大的 variant。
  - Hugging Face 上 checkpoint 许可标注为 other，使用前请审查条款。
  recommended_benchmarks:
  - id: vbench
    reason: Standard T2V quality suite.
    reason_zh: 标准文生视频质量评测。
