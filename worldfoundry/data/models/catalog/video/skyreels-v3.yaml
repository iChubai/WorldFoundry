integration:
  status: integrated
  notes:
  - WorldFoundry loads the SkyReels V3 checkpoint into the shared native Wan graph and framework-owned diffusion runner.
  - Reference-image latent concatenation and dual text/image guidance are reusable initializer and execution-strategy capabilities.
  - The route uses the local SkyReels-V3-R2V-14B checkpoint without Diffusers or a model-owned subprocess runtime.
runner_parity:
  status: partial
  notes:
  - Transformer, UMT5, and VAE checkpoint schemas map exactly to the native graphs.
  - The prior official-runtime visual artifact remains documented; native visual parity is pending a GPU inference run.
runtime_profile: runtime-profile:skyreels-v3
catalog_category: video
catalog_scope: Video-generation and video-token catalog entries. Integrated entries expose WorldFoundry pipeline targets;
  metadata-only entries retain upstream provenance without runnable WorldFoundry backends.
docs:
  publisher: Skywork AI (Kunlun)
  publisher_kind: company
  publisher_zh: 昆仑万维（Skywork AI）
  overview: SkyReels V3 is Skywork's newer generation, covering reference-to-video, audio-guided video, and video-to-video. WorldFoundry runs the SkyReels-V3-R2V-14B checkpoint on the shared native Wan graph with reference-image latent concatenation and dual text/image guidance.
  overview_zh: SkyReels V3 是 Skywork 的更新一代，覆盖参考图生视频、音频引导视频与视频到视频。WorldFoundry 在共享原生 Wan 图上运行 SkyReels-V3-R2V-14B checkpoint，采用参考图潜变量拼接与文本/图像双引导。
  architecture: The transformer, UMT5 text encoder, and VAE checkpoints map exactly onto the native Wan graphs. Reference conditioning concatenates reference-image latents; guidance runs dual text/image channels through the UniPC scheduler and dual-condition runner.
  architecture_zh: Transformer、UMT5 文本编码器与 VAE 的 checkpoint 与原生 Wan 图精确对应。参考条件通过拼接参考图潜变量实现；引导以文本/图像双通道经 UniPC 调度器与双条件 runner 执行。
  usage_notes: At 14B scale, plan for datacenter-class GPU memory.
  usage_notes_zh: 14B 规模，需按数据中心级显存规划。
  limitations:
  - Native generation output has not been validated on GPU; only the checkpoint mapping is verified.
  limitations_zh:
  - 原生生成结果尚未在 GPU 上验证，目前只验证了 checkpoint 映射。
  recommended_benchmarks:
  - id: vbench
    reason: Baseline quality suite.
    reason_zh: 基础质量评测。
