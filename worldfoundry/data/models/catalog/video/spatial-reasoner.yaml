  publisher_zh: 约翰斯·霍普金斯大学（CCVL 实验室）
  overview: SpatialReasoner is a vision-language model from the JHU CCVL group focused on explicit, step-wise spatial reasoning over images and video. It handles spatial and multimodal reasoning plus image/video QA and returns model_response artifacts.
  overview_zh: SpatialReasoner 是约翰斯·霍普金斯大学 CCVL 组的视觉-语言模型，专注对图像与视频进行显式、分步的空间推理。它支持空间与多模态推理以及图像/视频问答，返回 model_response 产物。
  architecture: A vision-language model with explicit 3D-aware spatial reasoning stages (per the upstream release at ccvl/SpatialReasoner). It takes a prompt together with an image or video.
  architecture_zh: 带显式 3D 感知空间推理阶段的视觉-语言模型（见上游 ccvl/SpatialReasoner 发布）。输入为 prompt 加图像或视频。
  usage_notes: Pair it with generation models to audit spatial consistency of generated worlds — e.g. object positions and relative depths.
  usage_notes_zh: 可与生成模型配合，审查生成世界的空间一致性——例如物体位置与相对深度。
