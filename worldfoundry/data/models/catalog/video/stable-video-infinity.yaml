docs:
  publisher: EPFL (VITA lab)
  publisher_kind: university
  publisher_zh: 洛桑联邦理工学院（EPFL VITA 实验室）
  overview: 'Stable Video Infinity 2.0 (SVI) generates arbitrarily long videos by chaining clips with five-frame continuation and per-clip seed changes, driven by prompt streams. Validated with the default settings on an A100: two linked 81-frame clips at 832x544 form a 157-frame H.264 video that matches the official runtime at 31.03 dB PSNR under identical settings.'
  overview_zh: Stable Video Infinity 2.0（SVI）通过五帧续接与逐段换种子来串联视频段，由提示词流驱动，可生成任意长度的视频。已在 A100 上以默认设置验证：两段相接的 81 帧 832x544 视频组成 157 帧 H.264 视频，与官方运行时在相同设置下对比达到 31.03 dB PSNR。
  architecture: SVI 2.0 is a LoRA on top of Wan2.1-I2V-14B-480P that keeps five-frame continuation, reference-frame padding, and prompt-stream repetition. Loading fails unless every LoRA pair in the released checkpoint merges into the Wan DiT.
  architecture_zh: SVI 2.0 是叠加在 Wan2.1-I2V-14B-480P 上的 LoRA，保留五帧续接、参考帧填充与提示词流重复机制。发布 checkpoint 中任一 LoRA 对未能合并到 Wan DiT 时，加载即失败。
  usage_notes: 'Defaults follow the official recipe: five-motion-frame continuation, full reference padding, each clip a distinct seed, prompts repeated twice before advancing. The official 999-clip cap is bounded to two clips per prompt unless use_first_prompt_only is enabled. Stage both the SVI LoRA (vita-video-gen/svi-model, MIT) and the Wan2.1 base.'
  usage_notes_zh: 默认值遵循官方配方：五运动帧续接、完整参考帧填充、每段独立种子、每条提示词重复两次后推进。除非启用 use_first_prompt_only，官方 999 段上限被限定为每条提示词两段。需同时就位 SVI LoRA（vita-video-gen/svi-model，MIT）与 Wan2.1 基座。
  limitations:
  - Requires both the SVI LoRA and the Wan2.1-I2V-14B base checkpoint.
  - Long-video drift is mitigated, not eliminated — quality can still degrade over many chained clips.
  - 'Inference only: training launchers and datasets are not included.'
  limitations_zh:
  - 需要同时就位 SVI LoRA 与 Wan2.1-I2V-14B 基座 checkpoint。
  - 长视频漂移被缓解而非消除——多段串联后质量仍可能下降。
  - 仅推理：不包含训练启动器与数据集。
  recommended_benchmarks:
  - id: chronomagic-bench
    reason: Long-horizon suite matching SVI's infinite-video goal.
    reason_zh: 长时程评测，契合 SVI 的无限长视频目标。
  - id: vbench
    reason: Per-clip quality yardstick.
    reason_zh: 单段质量标尺。
