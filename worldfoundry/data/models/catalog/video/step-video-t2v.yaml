runtime_profile: runtime-profile:step-video-t2v
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: step-video-t2v
runner_parity:
  status: verified
  notes:
  - DiT, Step-LLM, CLIP, scheduler, latent initialization, and VAE decoding execute
    in-process; the former xFuser and caption/VAE service runtime is not a backend.
  - A 2026-09-26 checkpoint-backed single-H100 run produced 204/204 decodable
    frames at 992x544 using 50 denoising steps, CFG 9, and time shift 13.
    Visual review found a coherent surfing-cat scene with sustained board and
    water motion for this prompt; official pixel parity is not claimed.
notes:
- Use id step-video-t2v. The public pipeline uses the canonical native diffusion assembler.
native_diffusion:
  recipe_id: step-video-t2v
  architecture: step-video-t2v
  backend: worldfoundry-native-diffusion
  shared_components:
  - native checkpoint resolver and module loader
  - framework-owned CFG sampling loop
  - core scaled-dot-product attention and block offload
catalog_category: video
catalog_scope: Video-generation and video-token catalog entries. Integrated entries
  expose WorldFoundry pipeline targets; metadata-only entries retain upstream provenance
  without runnable WorldFoundry backends.
docs:
  publisher: StepFun
  publisher_kind: company
  publisher_zh: 阶跃星辰（StepFun）
  overview: Step-Video-T2V is StepFun's large open text-to-video model (30B parameters upstream, MIT weights at stepfun-ai/stepvideo-t2v). WorldFoundry runs the whole pipeline in one process — DiT, Step-LLM text encoder, CLIP, scheduler, latent initialization, and VAE decoding — so no separate caption or VAE services are needed.
  overview_zh: Step-Video-T2V 是阶跃星辰的大规模开源文生视频模型（上游 300 亿参数，MIT 权重位于 stepfun-ai/stepvideo-t2v）。WorldFoundry 在单个进程内运行完整 pipeline——DiT、Step-LLM 文本编码器、CLIP、调度器、潜变量初始化与 VAE 解码——无需单独的 caption 或 VAE 服务。
  architecture: 'Upstream: a 30B DiT with a deeply compressed Video-VAE (16x16 spatial, 8x temporal) and bilingual text encoders.'
  architecture_zh: 上游：30B DiT，配深压缩 Video-VAE（空间 16x16、时间 8x）与双语文本编码器。
  usage_notes: 'Validated with the released checkpoint: one prompt generates a 204-frame 992x544 video with 50 steps on GPU. Use id step-video-t2v. At 30B scale plan for serious VRAM or multi-GPU setups.'
  usage_notes_zh: 已用发布的 checkpoint 验证：一个提示词在 GPU 上以 50 步生成 992x544、204 帧的视频。请使用 id step-video-t2v。30B 规模需要充足显存或多卡配置。
  limitations:
  - Validation covers a single prompt; benchmark scores and pixel-level parity with the official implementation have not been measured.
  - 30B scale demands datacenter GPUs; single consumer cards are not viable.
  limitations_zh:
  - 验证仅覆盖一个提示词；尚未测量基准分数或与官方实现的逐像素一致性。
  - 30B 规模需要数据中心级 GPU；单张消费级显卡不可行。
  recommended_benchmarks:
  - id: vbench
    reason: Standard open T2V quality suite.
    reason_zh: 标准开源文生视频质量评测。
