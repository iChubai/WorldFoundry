integration:
  status: integrated
  notes:
  - Uses the shared WorldFoundry native diffusion assembler, runner, checkpoint loader, offload policy, and LVDM components.
  - The VideoCrafter2 base model and ordered T2V-Turbo LoRA remain separate declarative checkpoint inputs.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: t2v_turbo_t2v
runner_parity:
  status: native_checkpoint_validated
  notes:
  - Local VideoCrafter2 and T2V-Turbo VC2 assets are available for strict component and LoRA validation.
native_diffusion:
  recipe_id: t2v_turbo_t2v
  architecture: lvdm-videocrafter2
  backend: worldfoundry-native-diffusion
  shared_components:
  - native checkpoint loader
  - native LCM scheduler
  - LVDM UNet and autoencoder
  - ordered LoRA merger
catalog_category: video
catalog_scope: Video-generation and video-token catalog entries. Integrated entries expose WorldFoundry pipeline targets; metadata-only entries retain upstream provenance without runnable WorldFoundry backends.
docs:
  publisher: University of California, Santa Barbara
  publisher_kind: university
  publisher_zh: 加州大学圣塔芭芭拉分校（UCSB）
  overview: T2V-Turbo is a fast text-to-video model distilled from VideoCrafter2 with consistency distillation plus reward feedback, generating watchable clips in 4-8 steps.
  overview_zh: T2V-Turbo 是从 VideoCrafter2 蒸馏出的快速文生视频模型，结合一致性蒸馏与奖励反馈，4-8 步即可生成可看的视频。
  architecture: "Base: VideoCrafter2's U-Net latent video diffusion. On top: a consistency-distilled LoRA trained with mixed reward feedback (per the publication, arXiv 2405.18750)."
  architecture_zh: 基座：VideoCrafter2 的 U-Net 潜空间视频扩散。之上：以混合奖励反馈训练的一致性蒸馏 LoRA（见论文 arXiv 2405.18750）。
  usage_notes: Stage both the VideoCrafter2 base (VideoCrafter/VideoCrafter2) and the T2V-Turbo VC2 LoRA (jiachenli-ucsb/T2V-Turbo-VC2). Use it when you need many quick T2V drafts rather than maximum quality.
  usage_notes_zh: 需同时就位 VideoCrafter2 基座（VideoCrafter/VideoCrafter2）与 T2V-Turbo VC2 LoRA（jiachenli-ucsb/T2V-Turbo-VC2）。适合需要大量快速文生视频草稿、而非极致质量的场景。
  limitations:
  - Few-step generation trades detail for speed — quality ceiling is the VideoCrafter2 base.
  - Requires both the base checkpoint and the ordered LoRA; they are separate inputs.
  limitations_zh:
  - 少步生成以细节换速度——质量上限受 VideoCrafter2 基座限制。
  - 需要基座 checkpoint 与有序 LoRA 两个独立输入。
  recommended_benchmarks:
  - id: vbench
    reason: T2V-Turbo was tuned for exactly this suite's dimensions.
    reason_zh: T2V-Turbo 的优化目标正是该评测的各维度。
