docs:
  publisher: Shanghai AI Laboratory (Vchitect)
  publisher_kind: lab
  publisher_zh: 上海人工智能实验室（Vchitect 团队）
  overview: Vchitect-2.0 is Shanghai AI Lab's open text-to-video diffusion transformer. WorldFoundry runs its 2B checkpoint through a native implementation of the DiT and the SD3 decoder.
  overview_zh: Vchitect-2.0 是上海人工智能实验室的开源文生视频扩散 Transformer。WorldFoundry 以原生实现的 DiT 与 SD3 解码器运行其 2B checkpoint。
  architecture: A parallel diffusion transformer paired with an SD3-family VAE decoder.
  architecture_zh: 并行扩散 Transformer 配 SD3 系 VAE 解码器。
  usage_notes: Weights are apache-2.0 at Vchitect/Vchitect-2.0-2B. Use id vchitect-2-t2v.
  usage_notes_zh: 权重为 apache-2.0，位于 Vchitect/Vchitect-2.0-2B。请使用 id vchitect-2-t2v。
  limitations:
  - 'Validation is structural: the checkpoint loads exactly into the native model, but visual parity with upstream demos is not established.'
  - '2B scale: quality below 13B+ text-to-video models.'
  limitations_zh:
  - 验证仅限结构层：checkpoint 可精确加载到原生模型，但与上游 demo 的视觉一致性未确立。
  - 2B 规模：质量低于 13B 以上的文生视频模型。
  recommended_benchmarks:
  - id: vbench
    reason: Standard T2V quality suite.
    reason_zh: 标准文生视频质量评测。
