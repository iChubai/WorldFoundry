id: videocrafter
name: VideoCrafter
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: videocrafter
runtime_profile: runtime-profile:videocrafter2-t2v
tasks:
- text-to-video
- image-to-video
source_status:
  status: confirmed_official_github
  github:
    url: https://github.com/VideoCrafter/VideoCrafter
    verified_by: git ls-remote --symref https://github.com/VideoCrafter/VideoCrafter.git HEAD
    default_branch: main
    head_sha: f6c7f7f28f71d3069a9ee0e002d2f4b019eb78f6
checkpoint:
  status: confirmed_public_hf
  verified_by: GET https://huggingface.co/api/models/<repo_id>
  repos:
  - id: VideoCrafter/VideoCrafter2
    sha: 7b4079838622fcba3fc2c9575210df3ed1cb8d69
    license: apache-2.0
    private: false
    gated: false
    tasks:
    - text-to-video
  - id: VideoCrafter/Text2Video-1024
    sha: 3919b21f62d5c14498e4d25c831c6df031da18a6
    private: false
    gated: false
    tasks:
    - text-to-video
    license_status: pending
  - id: VideoCrafter/Image2Video-512
    sha: 36d5fca839f041121c576b1cd76c58d4eb238408
    private: false
    gated: false
    tasks:
    - image-to-video
    license_status: pending
  notes: Some official older HF repos expose no license in cardData; do not infer a license from the org name.
demo_parity:
  status: pending
  notes:
  - The in-tree VideoCrafter1 I2V, VideoCrafter1 T2V, and VideoCrafter2 T2V routes are wired with checkpoint, fps, frame count,
    and seed controls.
  - Full upstream parity remains pending; per-run artifact checks are tracked outside the model catalog.
notes: The VideoCrafter2 HF card exposes Apache-2.0; older Text2Video/Image2Video cards need license review.
catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight video generation models. Checkpoints
  are not tracked in git; local validation may download selected repos under cache/hfd.
catalog_policy:
  github: Validated with git ls-remote, preferring git ls-remote --symref <repo>.git HEAD for default branch and HEAD SHA.
  huggingface: Validated with the Hugging Face /api/models endpoint. Recorded repo id, sha, private, gated, license, and selected
    task tags only.
  parity: This manifest does not claim WorldFoundry runtime parity unless an explicit parity run and expected artifact are
    recorded.
official_sources:
  project_page: https://ailab-cvc.github.io/videocrafter2/
  paper: https://arxiv.org/abs/2401.09047
integration:
  status: integrated
  notes:
  - WorldFoundry wraps the in-tree VideoCrafter infer-only runtimes.
runner_parity:
  status: pending
  notes:
  - WorldFoundry pipeline targets are registered for VideoCrafter1 I2V, VideoCrafter1 T2V, and VideoCrafter2 T2V.
  - Exhaustive upstream benchmark parity remains a longer validation stage.
docs:
  publisher: Tencent AI Lab
  publisher_kind: company
  publisher_zh: 腾讯 AI Lab
  overview: VideoCrafter is Tencent AI Lab's open video generation toolbox. The family groups the in-tree infer-only runtimes for VideoCrafter1 I2V, VideoCrafter1 T2V, and VideoCrafter2 T2V; each route also has its own model page (videocrafter1-i2v, videocrafter1-t2v, videocrafter2-t2v).
  overview_zh: VideoCrafter 是腾讯 AI Lab 的开源视频生成工具箱。该系列包含 VideoCrafter1 I2V、VideoCrafter1 T2V 与 VideoCrafter2 T2V 的树内仅推理运行时；每条路径也有独立的模型页（videocrafter1-i2v、videocrafter1-t2v、videocrafter2-t2v）。
  architecture: 'U-Net latent video diffusion models: VideoCrafter1 offers T2V (up to 1024x576) and I2V; VideoCrafter2 improves the T2V model by decoupling appearance learning (low-quality video + high-quality image data). Training, dataset, and download helpers are not included.'
  architecture_zh: U-Net 潜空间视频扩散模型：VideoCrafter1 提供 T2V（最高 1024x576）与 I2V；VideoCrafter2 通过解耦外观学习（低质量视频 + 高质量图像数据）改进 T2V。不包含训练、数据集与下载辅助脚本。
  usage_notes: VideoCrafter2 T2V is the default route. The VideoCrafter2 Hugging Face card declares Apache-2.0; the older Text2Video/Image2Video cards declare no license.
  usage_notes_zh: 默认路径是 VideoCrafter2 T2V。VideoCrafter2 的 HF 卡片声明 Apache-2.0；更早的 Text2Video/Image2Video 卡片未声明许可。
  limitations:
  - The older VideoCrafter1 checkpoints declare no license; check the terms before redistribution.
  limitations_zh:
  - 较早的 VideoCrafter1 checkpoint 未声明许可；再分发前请核实条款。
  recommended_benchmarks:
  - id: evalcrafter
    reason: The benchmark developed alongside the VideoCrafter effort.
    reason_zh: 与 VideoCrafter 项目同源的评测。
  - id: vbench
    reason: Standard T2V suite.
    reason_zh: 标准文生视频评测。
