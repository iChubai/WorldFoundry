id: videocrafter1-i2v
name: VideoCrafter1 I2V
aliases:
- videocrafter1_i2v
tasks:
- image-to-video
- video-generation
output_artifacts:
- generated_video
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/VideoCrafter/VideoCrafter
official_sources:
  project_page: https://ailab-cvc.github.io/videocrafter2/
  paper: https://arxiv.org/abs/2401.09047
integration:
  status: integrated
  notes:
  - In-tree infer-only runtime wraps the official VideoCrafter image-to-video path.
  - Training, dataset, and download scripts are intentionally not packaged.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
runtime_profile: runtime-profile:videocrafter1-i2v
runner_parity:
  status: pending
  notes:
  - The in-tree VideoCrafter1 I2V route is wired with local checkpoint, fps, frame
    count, and seed controls.
  - Per-run artifact checks are tracked outside the model catalog.
notes:
- Checkpoint provenance is tracked on the top-level videocrafter catalog entry to
  avoid duplicate HF repo aliases.
pipeline_binding: videocrafter1-i2v
catalog_category: video
catalog_scope: Video-generation and video-token catalog entries. Integrated entries
  expose WorldFoundry pipeline targets; metadata-only entries retain upstream provenance
  without runnable WorldFoundry backends.
docs:
  publisher: Tencent AI Lab
  publisher_kind: company
  publisher_zh: 腾讯 AI Lab
  overview: 'VideoCrafter1 I2V is the image-to-video member of Tencent AI Lab''s VideoCrafter1 release: it animates a still image while preserving its content, style, and structure. The in-tree infer-only runtime wraps the official path with local checkpoint, fps, frame count, and seed controls.'
  overview_zh: VideoCrafter1 I2V 是腾讯 AI Lab VideoCrafter1 发布中的图生视频成员：在保持内容、风格与结构的前提下让静态图动起来。树内仅推理运行时封装官方路径，提供本地 checkpoint、fps、帧数与 seed 控制。
  architecture: A U-Net latent video diffusion model conditioned on the input image embedding (per the upstream release). Training and download scripts are not included.
  architecture_zh: 以输入图像嵌入为条件的 U-Net 潜空间视频扩散模型（见上游发布）。不包含训练与下载脚本。
  usage_notes: 'Expect 2023-era quality: short clips, modest motion. For higher fidelity image animation use DynamiCrafter or the DiT-based I2V models.'
  usage_notes_zh: 预期是 2023 年代的质量：短片、运动幅度有限。若要更高保真的图像动画，请用 DynamiCrafter 或 DiT 系图生视频模型。
  limitations:
  - Legacy generation quality compared with newer image-to-video models.
  limitations_zh:
  - 生成质量属旧代水平，不及较新的图生视频模型。
  recommended_benchmarks:
  - id: evalcrafter
    reason: Companion benchmark of the VideoCrafter effort.
    reason_zh: VideoCrafter 项目的配套评测。
