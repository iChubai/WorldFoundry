id: videocrafter1-t2v
name: VideoCrafter1 T2V
aliases:
- videocrafter1_t2v
tasks:
- text-to-video
- video-generation
output_artifacts:
- generated_video
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/VideoCrafter/VideoCrafter
official_sources:
  project_page: https://ailab-cvc.github.io/videocrafter2/
  paper: https://arxiv.org/abs/2401.09047
integration:
  status: integrated
  notes:
  - In-tree infer-only runtime wraps the official VideoCrafter text-to-video 1024 path.
  - Training, dataset, and download scripts are intentionally not packaged.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
runtime_profile: runtime-profile:videocrafter1-t2v
runner_parity:
  status: pending
  notes:
  - The in-tree VideoCrafter1 T2V route is wired with local checkpoint, fps, frame
    count, and seed controls.
  - Per-run artifact checks are tracked outside the model catalog.
notes:
- Checkpoint provenance is tracked on the top-level videocrafter catalog entry to
  avoid duplicate HF repo aliases.
pipeline_binding: videocrafter1-t2v
catalog_category: video
catalog_scope: Video-generation and video-token catalog entries. Integrated entries
  expose WorldFoundry pipeline targets; metadata-only entries retain upstream provenance
  without runnable WorldFoundry backends.
docs:
  publisher: Tencent AI Lab
  publisher_kind: company
  publisher_zh: 腾讯 AI Lab
  overview: VideoCrafter1 T2V is the text-to-video member of the VideoCrafter1 release, generating clips up to 1024x576 from a prompt. WorldFoundry runs the official text-to-video 1024 path for inference, with local checkpoint, fps, frame count, and seed controls.
  overview_zh: VideoCrafter1 T2V 是 VideoCrafter1 发布中的文生视频成员，按提示词生成最高 1024x576 的视频。WorldFoundry 以仅推理方式运行官方 1024 文生视频路径，提供本地 checkpoint、fps、帧数与 seed 控制。
  architecture: U-Net latent video diffusion at up to 1024x576 (per the upstream release).
  architecture_zh: U-Net 潜空间视频扩散，最高 1024x576（见上游发布）。
  usage_notes: Prefer VideoCrafter2 T2V for better visual quality from the same family, or the DiT models for current-generation quality.
  usage_notes_zh: 同系列中建议优先使用 VideoCrafter2 T2V 以获得更好画质，或直接使用 DiT 模型获得当前一代质量。
  limitations:
  - Legacy generation quality; review the license on the older Hugging Face cards before use.
  limitations_zh:
  - 属旧代生成质量；使用前请审阅较早 Hugging Face 卡片上的许可。
  recommended_benchmarks:
  - id: evalcrafter
    reason: Companion benchmark of the VideoCrafter effort.
    reason_zh: VideoCrafter 项目的配套评测。
