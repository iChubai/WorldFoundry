integration:
  status: integrated
  notes:
  - VACE is assembled from the canonical Wan network, UMT5 conditioner, VAE codec, scheduler, initializer, and native runner roles.
  - Loading, placement, offload, sampling, media normalization, and artifact writing are owned by the shared WorldFoundry infra.
  - Image references, source video/mask conditions, and precomputed VACE context tensors are supported without an official-runtime backend.
runner_parity:
  status: integrated
  notes:
  - The native defaults preserve the official VACE-14B 1280x720, 81-frame, 50-step, guidance-scale 5.0 inference shape.
  - Full checkpoint visual parity remains a GPU artifact-validation task rather than a separate backend route.
runtime_profile: runtime-profile:wan2.1-vace
catalog_category: video
catalog_scope: Video-generation and video-token catalog entries. Integrated entries expose WorldFoundry pipeline targets;
  metadata-only entries retain upstream provenance without runnable WorldFoundry backends.
docs:
  publisher: Alibaba (Tongyi Lab)
  publisher_kind: company
  publisher_zh: 阿里巴巴（通义实验室）
  overview: 'Wan2.1 VACE is the all-in-one video creation and editing member of the Wan2.1 family: reference-image guidance, video-to-video editing, and mask/control-conditioned generation in one checkpoint. WorldFoundry assembles it from the standard Wan components and supports image references, source video/mask conditions, and precomputed VACE context tensors; no upstream VACE runtime is needed.'
  overview_zh: Wan2.1 VACE 是 Wan2.1 系列中「创作与编辑一体」的成员：参考图引导、视频到视频编辑与掩码/控制条件生成集于一个 checkpoint。WorldFoundry 用标准 Wan 组件装配它，支持图像参考、源视频/掩码条件与预计算的 VACE 上下文张量，无需上游 VACE 运行时。
  architecture: 'VACE adds a video-condition-and-editing context branch to the Wan2.1 DiT. Native defaults preserve the official VACE-14B inference shape: 1280x720, 81 frames, 50 steps, guidance scale 5.0. Both the 14B checkpoint and the 1.3B diffusers variant are supported.'
  architecture_zh: VACE 在 Wan2.1 DiT 上增加了视频条件与编辑上下文分支。原生默认保留官方 VACE-14B 推理形状：1280x720、81 帧、50 步、guidance scale 5.0。同时支持 14B checkpoint 与 1.3B diffusers variant。
  usage_notes: Prepare reference images or source video + mask pairs depending on the editing mode you want.
  usage_notes_zh: 按所需编辑模式准备参考图或「源视频 + 掩码」组合。
  limitations:
  - Editing quality depends on input preparation (masks, references).
  limitations_zh:
  - 编辑质量取决于输入准备（掩码、参考图）。
  recommended_benchmarks:
  - id: vbench
    reason: Baseline generation quality.
    reason_zh: 基础生成质量。
