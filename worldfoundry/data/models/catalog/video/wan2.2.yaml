docs:
  publisher: Alibaba (Tongyi Lab)
  publisher_kind: company
  publisher_zh: 阿里巴巴（通义实验室）
  overview: 'Wan2.2 is the next Wan generation after Wan2.1, with its own code and checkpoints. It has three variants: T2V A14B and I2V A14B (MoE) and TI2V 5B, a compact text+image-to-video model. Validated with the released checkpoint: TI2V 5B generates 121 frames at 1280x704, 24 FPS, with 50 steps.'
  overview_zh: Wan2.2 是 Wan2.1 之后的下一代 Wan，代码与 checkpoint 独立发布。它有三个 variant：T2V A14B 与 I2V A14B（MoE），以及紧凑的图文生视频模型 TI2V 5B。已用发布的 checkpoint 验证：TI2V 5B 以 50 步生成 1280x704、24 FPS 的 121 帧视频。
  architecture: 'Upstream Wan2.2 introduces MoE denoising in its larger variants and a high-compression VAE in the TI2V 5B, which is a dense model. Contract: prompt/image/video/actions in, generated_video out.'
  architecture_zh: 上游 Wan2.2 在大 variant 中引入 MoE 去噪，在 TI2V 5B 中使用高压缩 VAE；TI2V 5B 是稠密模型。契约：输入 prompt/image/video/actions，输出 generated_video。
  usage_notes: 'Start with `wan2.2-ti2v-5b`: its default is 121 frames at 1280x704, 24 FPS, and 50 steps, and it needs 24 GB of VRAM. Stage the official checkpoint locally before running it; the A14B variants need their own checkpoints and 80 GB of VRAM.'
  usage_notes_zh: 从 `wan2.2-ti2v-5b` 起步：默认 1280x704、24 FPS、121 帧、50 步，需要 24 GB 显存。运行前请在本地准备官方 checkpoint；A14B variant 需要各自的 checkpoint 与 80 GB 显存。
  limitations:
  - Only the TI2V 5B variant has been validated; the A14B variants have not been compared with official output.
  limitations_zh:
  - 只有 TI2V 5B variant 已验证；A14B variant 尚未与官方输出对照。
  recommended_benchmarks:
  - id: vbench
    reason: Standard quality suite.
    reason_zh: 标准质量评测。
