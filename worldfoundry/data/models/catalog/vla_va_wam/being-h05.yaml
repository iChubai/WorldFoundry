docs:
  publisher: BeingBeyond
  publisher_kind: company
  publisher_zh: BeingBeyond（北京智在无界）
  overview: "Being-H0.5 is BeingBeyond's 2B-parameter cross-embodiment VLA policy. Four checkpoint lines are available: base, LIBERO, RoboCasa, and a combined LIBERO+RoboCasa variant. Validated with the LIBERO checkpoint: GPU get_action runs through the public pipeline and writes an action_trace artifact."
  overview_zh: Being-H0.5 是 BeingBeyond 的 2B 参数跨本体 VLA 策略。提供四条 checkpoint 线：base、LIBERO、RoboCasa，以及 LIBERO+RoboCasa 合并变体。已用 LIBERO checkpoint 验证：通过公开 pipeline 在 GPU 上运行 get_action，并输出 action_trace 产物。
  architecture: Inference-only Being-H0.5 policy runtime; the validated LIBERO path uses efficient SDPA attention.
  architecture_zh: 推理专用的 Being-H0.5 策略运行时；已验证的 LIBERO 路径使用高效 SDPA 注意力。
  usage_notes: Start with the GPU-validated Being-H05-2B_libero checkpoint. The Being-H05 Hugging Face repos publish no license; confirm licensing before production use.
  usage_notes_zh: 建议从 GPU 已验证的 Being-H05-2B_libero checkpoint 起步。Being-H05 的 Hugging Face 仓库均未声明许可证，生产使用前请确认许可。
  limitations:
  - The upstream Hugging Face repos publish no license.
  - Only the LIBERO checkpoint is validated with GPU get_action; the other checkpoints have load checks only.
  limitations_zh:
  - 上游 Hugging Face 仓库未声明许可证。
  - 仅 LIBERO checkpoint 通过 GPU get_action 验证；其余 checkpoint 只做过加载检查。
  recommended_benchmarks:
  - id: libero
    reason: GPU-validated LIBERO policy checkpoint.
    reason_zh: GPU 已验证的 LIBERO 策略 checkpoint。
  - id: robocasa
    reason: Dedicated RoboCasa checkpoint line.
    reason_zh: 有专门的 RoboCasa checkpoint 线。
