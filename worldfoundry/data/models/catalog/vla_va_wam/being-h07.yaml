docs:
  publisher: BeingBeyond
  publisher_kind: company
  publisher_zh: BeingBeyond（北京智在无界）
  overview: "Being-H0.7 is the successor in BeingBeyond's Being-H family: a latent world-action model (WAM) plus robot policy that maps an image, a prompt, and robot state to an action trace. WorldFoundry runs it through an in-tree port of the official policy runtime from the Being-H07 subdirectory of the official repository."
  overview_zh: Being-H0.7 是 BeingBeyond Being-H 家族的后继模型：隐式世界-动作模型（WAM）加机器人策略，从图像、提示与机器人状态生成动作轨迹。WorldFoundry 通过树内移植的官方策略运行时运行它，源码来自官方仓库的 Being-H07 子目录。
  architecture: 'A latent world-action model: the policy predicts in a learned latent world space rather than raw pixels.'
  architecture_zh: 隐式世界-动作模型：策略在学习到的隐式世界空间而非原始像素中预测。
  usage_notes: Stage BeingBeyond/Being-H07 once BeingBeyond releases the weights; until then a run returns a plan listing the missing assets. For a GPU-validated BeingBeyond policy, use being-h05.
  usage_notes_zh: 待 BeingBeyond 发布权重后就位 BeingBeyond/Being-H07；在此之前运行只返回列出缺失资产的计划。需要 GPU 已验证的 BeingBeyond 策略时，使用 being-h05。
  limitations:
  - Weights are not yet available; runs return a runtime plan only, not actions.
  - License terms are not documented; check the upstream repository before use.
  limitations_zh:
  - 权重尚未可用；运行只返回运行时计划，不输出动作。
  - 许可证条款未注明，使用前请查看上游仓库。
