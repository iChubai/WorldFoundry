docs:
  publisher: GigaAI
  publisher_kind: company
  publisher_zh: 极佳科技（GigaAI）
  overview: "GigaBrain-0 is GigaAI's 3.5B VLA foundation policy with subtask prediction, released as GigaBrain-0-3.5B-Base and the 0.1 refresh under Apache-2.0. Validated with the GigaBrain-0.1 checkpoint: the in-tree runtime produces a CUDA action_trace using converted LeRobot RoboTwin statistics."
  overview_zh: GigaBrain-0 是极佳科技（GigaAI）的 3.5B VLA 基础策略，支持子任务预测，发布 GigaBrain-0-3.5B-Base 与 0.1 更新版，Apache-2.0 许可。已使用 GigaBrain-0.1 权重验证：树内运行时使用转换的 LeRobot RoboTwin 统计输出 CUDA action_trace。
  architecture: A 3.5B policy on a PaliGemma tokenizer base using the FAST action tokenizer for discrete action encoding, plus subtask prediction heads.
  architecture_zh: 3.5B 策略，PaliGemma tokenizer 基座，用 FAST 动作 tokenizer 做离散动作编码，另有子任务预测头。
  usage_notes: Stage the PaliGemma tokenizer model and the physical-intelligence FAST tokenizer. PaliGemma is gated (manual review) and requires Hugging Face auth.
  usage_notes_zh: 需准备 PaliGemma tokenizer 模型与 physical-intelligence FAST tokenizer。PaliGemma 为门控模型（需人工审查），需要 Hugging Face 认证。
  limitations:
  - 'Official task scores are not reproduced: they need the gated task-specific norm_stats/delta_mask assets.'
  limitations_zh:
  - 尚未复现官方任务分数：需要门控的任务专用 norm_stats/delta_mask 资产。
  recommended_benchmarks:
  - id: robotwin
    reason: CUDA action trace was produced with converted RoboTwin statistics.
    reason_zh: CUDA 动作轨迹以转换的 RoboTwin 统计产出。
