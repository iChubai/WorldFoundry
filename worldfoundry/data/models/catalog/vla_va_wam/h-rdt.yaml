docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'H-RDT (Human-to-Robotics Diffusion Transformer) pretrains a diffusion-transformer policy on large-scale human manipulation data before robot fine-tuning (paper: arXiv 2507.23523, MPL-2.0). The official release is the 48-dimensional human-motion pretraining checkpoint (embodiedfoundation/H-RDT).'
  overview_zh: H-RDT（Human-to-Robotics Diffusion Transformer）先在大规模人类操作数据上预训练扩散 transformer 策略，再做机器人微调（论文：arXiv 2507.23523，MPL-2.0）。官方发布为 48 维人体动作预训练 checkpoint（embodiedfoundation/H-RDT）。
  architecture: A diffusion transformer with flow-matching sampling; vision uses DINOv2 plus SigLIP and language optionally uses T5. The official checkpoint loads with strict parameter-name matching.
  architecture_zh: 扩散 transformer 配 flow-matching 采样；视觉用 DINOv2 加 SigLIP，语言可选 T5。官方 checkpoint 按参数名严格匹配加载。
  usage_notes: The integration covers inference only; training, datasets, ROS, robot drivers, and simulator clients are not included.
  usage_notes_zh: 集成仅覆盖推理；不包含训练、数据集、ROS、机器人驱动与模拟器客户端。
  limitations:
  - Only the 48-dimensional human-motion pretraining checkpoint is released; the 14-dimensional robot fine-tune is not, so robot deployment needs your own fine-tuning.
  limitations_zh:
  - 仅发布 48 维人体动作预训练 checkpoint；14 维机器人微调版未发布，机器人部署需自行微调。
