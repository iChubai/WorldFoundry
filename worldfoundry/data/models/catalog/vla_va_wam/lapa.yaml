docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'LAPA (Latent Action Pretraining) learns actions without action labels: it pretrains a video-action model on unlabeled video by discovering latent actions, then transfers to real robot control. WorldFoundry runs latent-action inference with the MIT-licensed LAPA-7B-openx checkpoint.'
  overview_zh: LAPA（Latent Action Pretraining）无需动作标签学习动作：在无标注视频上通过发现隐式动作预训练视频-动作模型，再迁移到真实机器人控制。WorldFoundry 使用 MIT 许可的 LAPA-7B-openx checkpoint 运行隐式动作推理。
  architecture: A 7B video-action model trained on Open X-Embodiment scale data with latent action quantization.
  architecture_zh: 7B 视频-动作模型，在 Open X-Embodiment 规模数据上以隐式动作量化训练。
  usage_notes: Run it in the dedicated JAX environment worldfoundry-lapa-jax-cu118. Plan-only execution works; full 7B inference needs a compatible JAX environment with tux installed.
  usage_notes_zh: 请在专用 JAX 环境 worldfoundry-lapa-jax-cu118 中运行。仅计划执行可用；完整 7B 推理需要装有 tux 且 JAX 版本兼容的环境。
  limitations:
  - 'Full 7B inference does not run yet: the prepare environment lacks tux and the gpu-jax0325 environment has an incompatible JAX version.'
  - JAX/Flax stack, not PyTorch, so environment setup differs from most models.
  limitations_zh:
  - 完整 7B 推理暂不可用：prepare 环境缺少 tux，gpu-jax0325 环境的 JAX 版本不兼容。
  - 使用 JAX/Flax 栈而非 PyTorch，环境配置与多数模型不同。
