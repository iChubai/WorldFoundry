runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
availability: open_source
id: libero-para
integration:
  status: blocked
  notes:
  - The pipeline binding is registered, but its official-policy runtime rejects
    the configured external LeRobot source before planning.
  - Removing the source option only exposes the external lerobot.policies.xvla
    target, which the in-tree runtime also rejects. No trained action trace is verified.
  - The lerobot/xvla-libero weights are staged; the required LeRobot source/package
    is absent, and the in-tree X-VLA loader cannot read that checkpoint as-is.
license: mit
name: LIBERO-Para
output_artifacts:
- action_trace
official_sources:
  project_page: https://cau-hai-lab.github.io/LIBERO-Para/
  github:
    head_sha: dec2d93ad591a6f55d50e792dea4637a3b9dc1dd
    url: https://github.com/cau-hai-lab/LIBERO-Para
  huggingface:
  - repo_id: HAI-Lab/LIBERO-Para
    status: confirmed
    type: dataset
  paper: https://huggingface.co/papers/2603.28301
provider: official_repo
runtime_profile: runtime-profile:libero-para
pipeline_binding: libero-para
tasks:
- vla
- policy_rollout
- embodied_benchmark
catalog_category: vla_va_wam
catalog_scope: VLA / VA(VAM) / WAM model entries tracked as upstream provenance,
  checkpoint metadata, and runtime status. A registered pipeline target does not
  imply that checkpoint-backed inference is ready.
docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'LIBERO-Para tests how VLA policies respond to paraphrased LIBERO instructions (paper: hf.co/papers/2603.28301, MIT license). Its dataset is confirmed on Hugging Face. WorldFoundry has a registered policy adapter, but public action inference is currently blocked by incompatible external LeRobot source and policy targets.'
  overview_zh: LIBERO-Para 测试 VLA 策略面对改写后的 LIBERO 指令时的表现（论文：hf.co/papers/2603.28301，MIT 许可）。其数据集已在 Hugging Face 确认。WorldFoundry 已注册策略适配器，但公共动作推理目前被不兼容的外部 LeRobot 源码与策略目标阻塞。
  architecture: This entry centers on an evaluation dataset rather than a new policy architecture. The registered adapter targets a LeRobot X-VLA policy checkpoint, but its source and target configuration fails the in-tree runtime contract before a policy is loaded.
  architecture_zh: 本条目以评测数据集为中心，而非新的策略架构。已注册适配器指向 LeRobot X-VLA 策略权重，但其源码与目标配置不符合树内运行时约束，尚未加载策略即失败。
  usage_notes: The dataset/result-import evaluation path is separate from policy inference. The staged lerobot/xvla-libero weights do not make this public pipeline runnable; a reviewed in-tree LeRobot-compatible loader is still required.
  usage_notes_zh: 数据集与结果导入评测路径独立于策略推理。虽然 lerobot/xvla-libero 权重已就位，公共 pipeline 仍不可运行；还需经过验证的树内 LeRobot 兼容加载器。
  limitations:
  - No policy checkpoint of its own; it evaluates other policies.
  - The registered policy runner is blocked before planning; no checkpoint-backed action trace has been validated.
  limitations_zh:
  - 自身无策略 checkpoint；用于评测其他策略。
  - 已注册的策略 runner 在规划前即被阻塞；尚未验证加载权重生成的动作轨迹。
  recommended_benchmarks:
  - id: libero-para
    reason: This entry is the LIBERO-Para evaluation itself.
    reason_zh: 本条目即 LIBERO-Para 评测本身。
  - id: libero
    reason: Built on the LIBERO task suite.
    reason_zh: 构建于 LIBERO 任务套件之上。
