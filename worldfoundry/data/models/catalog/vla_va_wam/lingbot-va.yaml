docs:
  publisher: Robbyant (Ant Group)
  publisher_kind: company
  publisher_zh: 蚂蚁灵波科技（Robbyant，蚂蚁集团）
  overview: LingBot-VA is Robbyant's video-action model, served through a vendored server/client runtime, with a base checkpoint plus RoboTwin and LIBERO-Long post-trained checkpoints (Apache-2.0). On an 80GB GPU the base transformer runs a CUDA forward pass and the LIBERO-Long server starts and listens on its websocket; end-to-end client rollout is not yet validated.
  overview_zh: LingBot-VA 是蚂蚁灵波科技（Robbyant）的视频-动作模型，经内置的 server/client 运行时提供服务，提供 base 以及 RoboTwin、LIBERO-Long 后训练 checkpoint（Apache-2.0）。在 80GB GPU 上，base transformer 可完成 CUDA 前向，LIBERO-Long 服务可启动并监听 websocket；端到端客户端 rollout 尚未验证。
  architecture: A transformer video-action backbone. The provided configs set attn_mode=torch, and the vendored server is launched with --checkpoint-dir pointing at the chosen checkpoint.
  architecture_zh: transformer 视频-动作骨干。随附配置设 attn_mode=torch，内置服务启动时通过 --checkpoint-dir 指向所选 checkpoint。
  usage_notes: 'Runs use a server/client split: the vendored server loads the checkpoint and the client drives the rollout.'
  usage_notes_zh: 运行采用 server/client 分离：内置服务加载 checkpoint，客户端驱动 rollout。
  limitations:
  - Client rollout and action decoding are not yet validated end to end.
  - The validated server paths need an 80GB-class GPU.
  limitations_zh:
  - 客户端 rollout 与动作解码尚未端到端验证。
  - 已验证的服务路径需要 80GB 级 GPU。
  recommended_benchmarks:
  - id: libero
    reason: A LIBERO-Long post-trained checkpoint is available.
    reason_zh: 提供 LIBERO-Long 后训练 checkpoint。
  - id: robotwin
    reason: A RoboTwin post-trained checkpoint is available.
    reason_zh: 提供 RoboTwin 后训练 checkpoint。
