docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'MME-VLA is the policy-learning line of the RoboMME project, centered on perceptual frame sampling for memory-heavy manipulation. It ships four Apache-2.0 checkpoint repos: the best perceptual-framesamp module, the mme_vla_suite collection, a pi05 baseline, and a VLM subgoal predictor.'
  overview_zh: MME-VLA 是 RoboMME 项目的策略学习线，核心是面向重记忆操作的感知帧采样。它提供四个 Apache-2.0 checkpoint 仓库：最佳感知帧采样模块、mme_vla_suite 集合、pi05 基线与 VLM 子目标预测器。
  architecture: Combines a perceptual frame-sampling module with policy learning and an optional VLM subgoal predictor. WorldFoundry runs the policy in process without an external source checkout.
  architecture_zh: 将感知帧采样模块与策略学习及可选的 VLM 子目标预测器结合。WorldFoundry 在进程内运行策略，无需外部源码检出。
  usage_notes: Stage the perceptual frame-sampling module checkpoint (`Yinpei/perceptual-framesamp-modul`) first.
  usage_notes_zh: 请先就位感知帧采样模块 checkpoint（`Yinpei/perceptual-framesamp-modul`）。
  recommended_benchmarks:
  - id: robomme
    reason: Native benchmark of the RoboMME project.
    reason_zh: RoboMME 项目的原生基准。
