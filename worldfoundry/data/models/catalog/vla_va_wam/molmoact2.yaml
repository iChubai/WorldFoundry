tasks:
- vla
- vla.action_prediction
- vla.policy_rollout
- robot_policy
variants:
- checkpoint_refs:
  - license: apache-2.0
    repo_id: allenai/MolmoAct2-DROID
  id: molmoact2-droid
  integration_status: integrated
  notes:
  - DROID defaults use external_cam, external_cam_2, wrist_cam, franka_droid normalization, and an
    8-D state vector.
  task: vla.policy_rollout
- checkpoint_refs:
  - license: apache-2.0
    repo_id: allenai/MolmoAct2-BimanualYAM
  id: molmoact2-bimanual-yam
  integration_status: integrated
  notes:
  - YAM defaults use top_cam, left_cam, right_cam, yam_dual_molmoact2 normalization,
    and a 14-D state vector.
  task: vla.policy_rollout
- checkpoint_refs:
  - license: apache-2.0
    repo_id: allenai/MolmoAct2-SO100_101
  id: molmoact2-so100-101
  integration_status: integrated
  notes:
  - SO100/SO101 defaults use top_cam, side_cam, so100_so101_molmoact2 normalization,
    and a 6-D state vector.
  task: vla.policy_rollout
- checkpoint_refs:
  - license: apache-2.0
    repo_id: allenai/MolmoAct2-LIBERO
  id: molmoact2-libero
  integration_status: integrated
  notes:
  - LIBERO checkpoint is cataloged, but the in-tree runtime defaults are currently
    validated with the agentview/wrist RGB schema and libero normalization.
  task: vla.policy_rollout
- checkpoint_refs:
  - license: apache-2.0
    repo_id: allenai/MolmoAct2-Think-LIBERO
  id: molmoact2-think-libero
  integration_status: integrated
  notes:
  - Think-LIBERO uses the LIBERO camera/state schema with depth reasoning enabled.
  task: vla.policy_rollout
runner_parity:
  notes:
  - Plan-only pipeline creation is covered by test/eval_core/test_molmoact2_in_tree_integration.py.
  - The runtime loads DROID, YAM, SO100/SO101, LIBERO, and Think-LIBERO checkpoints
    through explicit retained model and processor classes with remote Python disabled.
  - Per-run action trace evidence is tracked outside the model catalog.
  status: verified
catalog_category: vla_va_wam
catalog_scope: VLA / VA(VAM) / WAM model entries tracked as upstream provenance, checkpoint
  metadata, and runtime-profile planning records. Runner or pipeline targets are present
  only after a complete in-tree WorldFoundry model runtime is registered and validated.
docs:
  publisher: Allen Institute for AI (AI2)
  publisher_kind: lab
  publisher_zh: 艾伦人工智能研究所（AI2）
  overview: "MolmoAct2 is AI2's second-generation action reasoning model with a broad Apache-2.0 checkpoint zoo: base, Think (depth-reasoning), DROID (Franka), Bimanual YAM, SO100/101, and LIBERO checkpoints. WorldFoundry runs the official DROID/YAM predict_action contracts as an action_trace pipeline; no external source checkout is needed."
  overview_zh: MolmoAct2 是 AI2 的第二代动作推理模型，Apache-2.0 checkpoint 阵容齐全：base、Think（深度推理）、DROID（Franka）、双臂 YAM、SO100/101 与 LIBERO。WorldFoundry 将官方 DROID/YAM predict_action 契约作为 action_trace pipeline 运行，无需外部源码检出。
  architecture: MolmoAct2 builds on the Molmo open VLM line with action-reasoning heads; the Think variant adds depth-based reasoning before acting. The DROID, YAM, SO100, LIBERO, and Think-LIBERO variants each run their own checkpoint and return an action trace.
  architecture_zh: MolmoAct2 基于 Molmo 开放 VLM 线并加动作推理头；Think 变体在行动前增加基于深度的推理。DROID、YAM、SO100、LIBERO 与 Think-LIBERO 变体各自加载对应 checkpoint 并返回动作轨迹。
  usage_notes: 'Pick the checkpoint per embodiment: DROID for Franka arms, BimanualYAM for dual-arm YAM, SO100_101 for SO-ARM, LIBERO/Think-LIBERO for simulation. Camera and state inputs differ by variant: DROID uses external_cam, external_cam_2, and wrist_cam with an 8-D state; YAM uses top_cam, left_cam, and right_cam with a 14-D state; SO100/SO101 uses top_cam and side_cam with a 6-D state; LIBERO and Think-LIBERO use agentview and wrist RGB.'
  usage_notes_zh: 按本体选择 checkpoint：Franka 机械臂用 DROID，双臂 YAM 用 BimanualYAM，SO-ARM 用 SO100_101，仿真用 LIBERO/Think-LIBERO。各变体的相机与状态输入不同：DROID 使用 external_cam、external_cam_2、wrist_cam 与 8 维状态；YAM 使用 top_cam、left_cam、right_cam 与 14 维状态；SO100/SO101 使用 top_cam、side_cam 与 6 维状态；LIBERO 与 Think-LIBERO 使用 agentview 与腕部 RGB。
  limitations:
  - GPU policy rollouts are not yet validated; validation covers checkpoint loading for all five variants.
  limitations_zh:
  - 尚未验证 GPU 策略 rollout；已验证的是全部五个变体的 checkpoint 加载。
  recommended_benchmarks:
  - id: libero
    reason: Dedicated LIBERO and Think-LIBERO checkpoints.
    reason_zh: 有专门的 LIBERO 与 Think-LIBERO checkpoint。
