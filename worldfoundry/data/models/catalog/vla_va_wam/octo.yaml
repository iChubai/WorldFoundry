docs:
  publisher: University of California, Berkeley (RAIL)
  publisher_kind: university
  publisher_zh: 加州大学伯克利分校（RAIL 实验室）
  overview: "Octo is Berkeley RAIL's generalist robot policy trained on Open X-Embodiment data, released as octo-base-1.5 and octo-small-1.5 with pinned revisions. Validated on an A100 with the official octo-small-1.5 checkpoint: the Orbax tree restores (136.7M parameters) and sample_actions returns a finite (1, 4, 7) action chunk."
  overview_zh: Octo 是伯克利 RAIL 在 Open X-Embodiment 数据上训练的通用机器人策略，发布 octo-base-1.5 与 octo-small-1.5 并锁定 revision。已在 A100 上用官方 octo-small-1.5 checkpoint 验证：Orbax 树可恢复（1.367 亿参数），sample_actions 返回有限的 (1, 4, 7) 动作块。
  architecture: A transformer generalist policy with diffusion action heads, implemented in JAX/Flax.
  architecture_zh: 带扩散动作头的 transformer 通用策略，以 JAX/Flax 实现。
  usage_notes: Choose octo-small-1.5 (GPU-validated) or octo-base-1.5; both use the same modeling code. No upstream source checkout is needed.
  usage_notes_zh: 选择 octo-small-1.5（已在 GPU 上验证）或 octo-base-1.5；两者共用同一建模代码。无需上游源码 checkout。
  limitations:
  - JAX/Flax stack — environment differs from PyTorch models.
  - The license is not stated; confirm upstream terms before use.
  limitations_zh:
  - JAX/Flax 栈——环境与 PyTorch 模型不同。
  - 许可证未注明；使用前请确认上游条款。
  recommended_benchmarks:
  - id: simpler-env
    reason: Common evaluation venue for Open X generalist policies.
    reason_zh: Open X 通用策略的常用评测场。
