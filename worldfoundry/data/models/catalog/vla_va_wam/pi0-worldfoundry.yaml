docs:
  publisher: Physical Intelligence
  publisher_kind: company
  publisher_zh: Physical Intelligence（PI）
  overview: PI0 (WorldFoundry native) is the WorldFoundry-native route to the pi0 policy. It uses the same in-tree OpenPI runtime as the pi0 model, so native pipelines can call pi0 without a separate integration.
  overview_zh: PI0（WorldFoundry native）是 pi0 策略的 WorldFoundry 原生路由，与 pi0 模型共用同一树内 OpenPI 运行时，使原生 pipeline 无需单独集成即可调用 pi0。
  architecture: 'Identical to pi0: a PaliGemma backbone with a flow-matching action expert, served through the in-tree OpenPI component pipeline.'
  architecture_zh: 与 pi0 相同：PaliGemma 骨干加 flow-matching 动作专家，经树内 OpenPI 组件 pipeline 提供服务。
  usage_notes: Checkpoint-backed inference needs a local checkpoint, tokenizer, and normalization statistics. Prefer the pi0 model unless you specifically need the native route.
  usage_notes_zh: checkpoint 驱动的推理需要本地 checkpoint、tokenizer 与归一化统计。除非确需原生路由，否则建议使用 pi0 模型。
