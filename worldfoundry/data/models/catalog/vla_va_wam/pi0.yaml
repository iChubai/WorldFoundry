docs:
  publisher: Physical Intelligence
  publisher_kind: company
  publisher_zh: Physical Intelligence（PI）
  overview: "pi0 is Physical Intelligence's flagship flow-matching VLA: a PaliGemma-based backbone with an action expert that decodes continuous action chunks via flow matching. WorldFoundry runs the concrete pi0 algorithm on the OpenPI runtime with pi0-specific configuration."
  overview_zh: pi0 是 Physical Intelligence 的旗舰 flow-matching VLA：基于 PaliGemma 的骨干加动作专家，经 flow matching 解码连续动作块。WorldFoundry 在 OpenPI 运行时上以 pi0 专用配置运行具体的 pi0 算法。
  architecture: A PaliGemma VLM backbone plus a flow-matching action expert producing action chunks. Checkpoints are GCS-hosted (gs://openpi-assets).
  architecture_zh: PaliGemma VLM 骨干加 flow-matching 动作专家，输出动作块。checkpoint 托管于 GCS（gs://openpi-assets）。
  usage_notes: Stage the GCS checkpoints with gsutil/gcloud (not Hugging Face). The default config is pi0_droid; its Orbax checkpoint must already be local.
  usage_notes_zh: 用 gsutil/gcloud 准备 GCS checkpoint（非 Hugging Face）。默认配置为 pi0_droid，对应的 Orbax checkpoint 必须已在本地。
  limitations:
  - GCS-hosted checkpoints require gsutil/gcloud tooling.
  - No pi0-specific license is listed; OpenPI is released under Apache-2.0.
  limitations_zh:
  - GCS 托管 checkpoint 需要 gsutil/gcloud 工具。
  - 未标明 pi0 专属许可证；OpenPI 以 Apache-2.0 发布。
  recommended_benchmarks:
  - id: libero
    reason: LIBERO is the OpenPI family's validated benchmark, through the pi05_libero config.
    reason_zh: LIBERO 是 OpenPI 家族已验证的评测（通过 pi05_libero 配置）。
