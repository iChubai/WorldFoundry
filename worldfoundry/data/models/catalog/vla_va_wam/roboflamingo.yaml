docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: "RoboFlamingo adapts the OpenFlamingo vision-language model into a robot imitation policy: a lightweight policy head turns the VLM's visual-language features into actions. Validated on GPU: with the RoboFlamingo, OpenFlamingo, and MPT checkpoints staged, the public pipeline produces a CUDA action trace."
  overview_zh: RoboFlamingo 将 OpenFlamingo 视觉-语言模型改造为机器人模仿策略：轻量策略头把 VLM 的视觉-语言特征转为动作。已在 GPU 上验证：就位 RoboFlamingo、OpenFlamingo 与 MPT checkpoint 后，公开 pipeline 可产出 CUDA 动作轨迹。
  architecture: An OpenFlamingo backbone (MPT language model with cross-attention vision fusion) plus a recurrent policy head for action prediction.
  architecture_zh: OpenFlamingo 骨干（MPT 语言模型加交叉注意力视觉融合），配循环策略头做动作预测。
  usage_notes: Stage the RoboFlamingo policy, OpenFlamingo backbone, and MPT language model checkpoints locally under WORLDFOUNDRY_HFD_ROOT.
  usage_notes_zh: 在本地 WORLDFOUNDRY_HFD_ROOT 下就位 RoboFlamingo 策略、OpenFlamingo 骨干与 MPT 语言模型 checkpoint。
  limitations:
  - Three separate checkpoint stacks (policy, backbone, LM) must be staged.
  - No license is listed; confirm the RoboFlamingo, OpenFlamingo, and MPT terms before production use.
  limitations_zh:
  - 需就位三套 checkpoint（策略、骨干、语言模型）。
  - 未列出许可证；生产使用前请确认 RoboFlamingo、OpenFlamingo 与 MPT 的条款。
  recommended_benchmarks:
  - id: calvin
    reason: RoboFlamingo's standard long-horizon evaluation suite.
    reason_zh: RoboFlamingo 的标准长时程评测套件。
