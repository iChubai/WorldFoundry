  publisher_zh: Spirit AI（千寻智能）
  overview: Spirit-VLA v1.5 is Spirit AI's vision-language-action policy on a Qwen3-VL backbone, released as the Spirit-AI-robotics/Spirit-v1.5 base checkpoint. WorldFoundry runs the native inference architecture and preprocessing in-tree and loads the official checkpoint and Qwen3-VL backbone with remote code disabled.
  overview_zh: Spirit-VLA v1.5 是 Spirit AI（千寻智能）基于 Qwen3-VL 骨干的视觉-语言-动作策略，发布为 Spirit-AI-robotics/Spirit-v1.5 base checkpoint。WorldFoundry 在树内运行原生推理架构与预处理，加载官方 checkpoint 与 Qwen3-VL 骨干，并禁用远程代码。
  architecture: A Qwen3-VL vision-language backbone with Spirit's action prediction head.
  architecture_zh: Qwen3-VL 视觉-语言骨干配 Spirit 的动作预测头。
  usage_notes: Stage the 21.6 GB Spirit-v1.5 checkpoint and the Qwen/Qwen3-VL-4B-Instruct backbone locally before running.
  usage_notes_zh: 运行前需在本地就位 21.6 GB 的 Spirit-v1.5 checkpoint 与 Qwen/Qwen3-VL-4B-Instruct 骨干。
