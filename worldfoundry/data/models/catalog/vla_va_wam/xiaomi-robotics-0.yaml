docs:
  publisher: Xiaomi Robotics
  publisher_kind: company
  publisher_zh: 小米机器人（Xiaomi Robotics）
  overview: "Xiaomi-Robotics-0 is Xiaomi's open VLA policy line with an unusually complete Apache-2.0 benchmark zoo: checkpoints for LIBERO, CALVIN ABCD-D, CALVIN ABC-D, SimplerEnv Google Robot, and SimplerEnv WidowX, plus a pretrained base checkpoint. The LIBERO checkpoint is the default."
  overview_zh: Xiaomi-Robotics-0 是小米的开放 VLA 策略线，Apache-2.0 基准阵容非常完整：提供 LIBERO、CALVIN ABCD-D、CALVIN ABC-D、SimplerEnv Google Robot 与 SimplerEnv WidowX 的 checkpoint，以及一个预训练基座 checkpoint。默认使用 LIBERO checkpoint。
  architecture: The released checkpoints share one policy design, fine-tuned separately for each benchmark; see the official repository (XiaomiRobotics/Xiaomi-Robotics-0) for architecture details.
  architecture_zh: 发布的 checkpoint 共享同一策略设计，按基准分别微调；架构细节请查阅官方仓库（XiaomiRobotics/Xiaomi-Robotics-0）。
  usage_notes: 'Pick the checkpoint matching your benchmark: LIBERO, either CALVIN split, or the SimplerEnv embodiments. For the newer generation see xiaomi-robotics-1. Validated on A100: all six released checkpoints load and produce action chunks.'
  usage_notes_zh: 按基准选择 checkpoint：LIBERO、任一 CALVIN 划分或 SimplerEnv 本体。更新一代请见 xiaomi-robotics-1。已在 A100 上验证：六个发布的 checkpoint 均可加载并输出动作块。
  limitations:
  - Validation covers action inference only; benchmark rollout success rates have not been measured.
  limitations_zh:
  - 验证仅覆盖动作推理；尚未测量基准 rollout 成功率。
  recommended_benchmarks:
  - id: libero
    reason: Dedicated LIBERO policy checkpoint.
    reason_zh: 有专门的 LIBERO 策略 checkpoint。
  - id: calvin
    reason: Dedicated CALVIN ABCD-D and ABC-D checkpoints.
    reason_zh: 有专门的 CALVIN ABCD-D 与 ABC-D checkpoint。
  - id: simpler-env
    reason: Dedicated Google Robot and WidowX checkpoints.
    reason_zh: 有专门的 Google Robot 与 WidowX checkpoint。
