docs:
  publisher: Xiaomi Robotics
  publisher_kind: company
  publisher_zh: 小米机器人（Xiaomi Robotics）
  overview: "Xiaomi-Robotics-1 is Xiaomi's next-generation VLA (Apache-2.0): a Qwen3-VL policy-token graph with a rectified-flow DiT action decoder emitting relative actions. Checkpoints are staged locally under WORLDFOUNDRY_CKPT_DIR."
  overview_zh: Xiaomi-Robotics-1 是小米的下一代 VLA（Apache-2.0）：Qwen3-VL 策略 token 图配 rectified flow DiT 动作解码器，输出相对动作。checkpoint 需在本地就位于 WORLDFOUNDRY_CKPT_DIR。
  architecture: A Qwen3-VL backbone produces policy tokens consumed by a rectified-flow DiT that decodes relative actions. Normalization metadata in checkpoint-side Python files is parsed as literals and never executed.
  architecture_zh: Qwen3-VL 骨干产生策略 token，由 rectified-flow DiT 消费并解码相对动作。checkpoint 侧 Python 文件中的归一化元数据仅按字面量解析，绝不执行。
  usage_notes: Stage checkpoints under ${WORLDFOUNDRY_CKPT_DIR}/embodied_action/xiaomi-robotics-1. The model, processor, and checkpoint load only from local files.
  usage_notes_zh: checkpoint 就位于 ${WORLDFOUNDRY_CKPT_DIR}/embodied_action/xiaomi-robotics-1。模型、processor 与 checkpoint 只从本地文件加载。
  limitations:
  - The public repository is a pre-release project page; the inference snapshot is not published there.
  limitations_zh:
  - 公开仓库为预发布项目页，推理快照未在其中发布。
