docs:
  publisher: The Hong Kong University of Science and Technology / MIT
  publisher_kind: university
  publisher_zh: 香港科技大学 / 麻省理工学院
  overview: AdaWorld extracts latent actions from video to condition an adaptable world model. WorldFoundry runs the released checkpoint on a supplied source video.
  overview_zh: AdaWorld 从视频中提取潜在动作来驱动可适配世界模型。WorldFoundry 使用发布权重和用户提供的源视频推理。
  architecture: Per the upstream project, a latent action autoencoder extracts transferable action representations that condition an autoregressive world model. WorldFoundry runs the official FDM inference path in-tree.
  architecture_zh: 按上游项目，潜在动作自编码器提取可迁移的动作表示，用于条件化自回归世界模型。WorldFoundry 在仓内运行官方 FDM 推理路径。
  usage_notes: Supply the released adaworld.safetensors checkpoint and a readable source video. The main checkpoint includes
    the active CLIP and LAM encoder weights; a separate lam.ckpt is not needed for this inference path.
  usage_notes_zh: 提供发布的 adaworld.safetensors 权重和可读取的源视频。主权重已包含推理所需的 CLIP 与 LAM 编码器参数，此推理路径不需要单独的 lam.ckpt。
  limitations:
  - Validation covers a short rollout only (four frames, two sampling steps, synthetic source video); task behavior and long-horizon consistency are not measured.
  limitations_zh:
  - 验证只覆盖短时推理（合成源视频、生成 4 帧、采样 2 步）；任务效果和长时一致性尚未测量。
