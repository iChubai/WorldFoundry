docs:
  publisher: AlayaLab
  publisher_kind: lab
  publisher_zh: AlayaLab
  overview: 'AlayaWorld is a camera-controlled interactive world model for long video: from an image it rolls out world video autoregressively with action control and DA3-backed spatial memory. Validated with the released 33.6 GB merged checkpoint: the pipeline generates the official case1 first chunk (32 H.264 frames at 544×960, 24 fps) on an A100 with spatial memory enabled.'
  overview_zh: AlayaWorld 是面向长视频的相机可控交互式世界模型：从一张图出发，带动作控制与 DA3 空间记忆自回归滚动生成世界视频。已用发布的 33.6 GB 合并 checkpoint 验证：pipeline 在 A100 上开启空间记忆，生成官方 case1 的首个 chunk（32 帧 H.264，544×960，24 fps）。
  architecture: AlayaWorld extends WorldFoundry's in-tree LTX-2.3 model and reuses its Transformer, VAE, Gemma connector, RoPE, patchifier, attention dispatcher, and distributed helpers; the Alaya-specific weights add action AdaLN and a temporal-history encoder. Spatial memory uses the in-tree Depth Anything 3 model.
  architecture_zh: AlayaWorld 在 WorldFoundry 树内 LTX-2.3 模型上扩展，复用其 Transformer、VAE、Gemma 连接器、RoPE、patchifier、注意力分发器与分布式辅助；Alaya 专属权重新增动作 AdaLN 与时间历史编码器。空间记忆使用树内 Depth Anything 3 模型。
  usage_notes: Attention dispatch is capability-based. Multi-GPU runs use Ulysses context parallelism over WorldFoundry core collectives.
  usage_notes_zh: 注意力分发按硬件能力选择。多卡运行使用基于 WorldFoundry 核心集合通信的 Ulysses 上下文并行。
  limitations:
  - The 33.6 GB merged checkpoint requires substantial disk and GPU memory.
  - Validation covers the first chunk of the official case1 on a single A100; multi-GPU Ulysses is validated for tensor parity only, not for end-to-end video generation.
  limitations_zh:
  - 33.6 GB 合并 checkpoint 需要可观的磁盘与显存。
  - 验证覆盖单张 A100 上官方 case1 的首个 chunk；多卡 Ulysses 仅验证了张量一致性，尚未验证端到端视频生成。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-control quality of interactive rollouts.
    reason_zh: 交互滚动生成的相机控制质量。
  - id: memobench
    reason: Long-horizon spatial-memory consistency evaluation.
    reason_zh: 长时程空间记忆一致性评测。
