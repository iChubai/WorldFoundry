  - Official garden_1 Sekai demo runs through the in-tree Studio/API path with forward_left camera control, 97 frames, 832x480, and 20fps output.
catalog_category: world_models
catalog_scope: world-model/interactive starred models
docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'Astra is an interactive world model with camera control built over a Wan2.1 backbone: from a single image it rolls out navigable world video following camera actions. Validated with the released checkpoints: the official garden_1 Sekai demo with forward_left camera control produces 97 frames at 832x480 and 20 fps.'
  overview_zh: Astra 是基于 Wan2.1 基座、带相机控制的交互式世界模型：从单张图出发，跟随相机动作滚动生成可导航的世界视频。已用发布的 checkpoint 验证：官方 garden_1 Sekai demo 使用 forward_left 相机控制，输出 832x480、20 fps 的 97 帧。
  architecture: 'Astra runs camera-controlled rollout on a Wan2.1-T2V-1.3B backbone: it loads the EvanEternal/Astra checkpoint together with the Wan2.1-T2V-1.3B DiT, T5, and VAE assets (apache-2.0; paper arXiv 2512.08931).'
  architecture_zh: Astra 以 Wan2.1-T2V-1.3B 为基座做相机控制滚动生成：加载 EvanEternal/Astra checkpoint 以及 Wan2.1-T2V-1.3B 的 DiT、T5 与 VAE 资产（apache-2.0；论文 arXiv 2512.08931）。
  usage_notes: Studio defaults mirror the official Wan2.1-backed Sekai image rollout — start from those before customizing camera trajectories. Stage the Astra and Wan2.1 checkpoints locally first.
  usage_notes_zh: Studio 默认值对齐官方 Wan2.1 支撑的 Sekai 图像滚动生成——自定义相机轨迹前请先从默认配置出发。请先在本地就位 Astra 与 Wan2.1 checkpoint。
  limitations:
  - 'Research-scale backbone (Wan2.1 1.3B): visual quality is research-preview level.'
  limitations_zh:
  - 研究规模基座（Wan2.1 1.3B）：视觉质量属研究预览级。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-following accuracy of interactive rollouts.
    reason_zh: 交互滚动生成的相机跟随精度。
