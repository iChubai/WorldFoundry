docs:
  publisher: Astronex-Robotics
  publisher_kind: lab
  publisher_zh: Astronex-Robotics
  overview: Astronex-World exposes causal and bidirectional camera/action-conditioned video inference.
  overview_zh: Astronex-World 支持相机和动作条件下的因果及双向视频推理。
  architecture: Wan2.2 TI2V-5B with PRoPE camera conditioning, 64-dimensional actions and embodiment conditioning.
    The causal and bidirectional samplers are adapted from Astronex-Robotics/Astronex-World at 27584bf1; the network
    is a WorldFoundry Wan variant on the shared Wan, UMT5 and Wan2.2 VAE modules.
  architecture_zh: 基于 Wan2.2 TI2V-5B，加入 PRoPE 相机条件、64 维动作和 embodiment 条件。因果与双向采样器改编自 Astronex-Robotics/Astronex-World（27584bf1），网络为基于
    WorldFoundry 共享 Wan、UMT5 与 Wan2.2 VAE 模块的 Wan 变体。
  usage_notes: Select mode=causal or bidirectional and supply checkpoint_dir. execute=True runs inference. latent_frames
    counts generated latent frames, not video frames; causal blocks require (latent_frames + reference_count) %
    8 == 0.
  usage_notes_zh: 选择 mode=causal 或 bidirectional，并提供 checkpoint_dir。execute=True 执行推理。latent_frames 为生成潜帧数；因果模式要求
    (latent_frames + reference_count) 能被 8 整除。
  limitations:
  - Checkpoint-backed generation has not been validated; only the official inference command construction has been
    checked on CPU.
  - The released action prediction head is zero initialized, so action prediction is not offered.
  limitations_zh:
  - 尚未验证基于 checkpoint 的生成，仅在 CPU 上检查过官方推理命令的构造。
  - 发布的动作预测头为零初始化，因此不提供动作预测。
  recommended_benchmarks: []
