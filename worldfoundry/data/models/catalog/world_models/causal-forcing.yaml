docs:
  publisher: Tsinghua University (thu-ml)
  publisher_kind: university
  publisher_zh: 清华大学（thu-ml）
  overview: Causal-Forcing distills bidirectional video diffusion into a causal, autoregressive generator — including Causal-Forcing++ few-step variants — so video can be generated chunk by chunk or frame by frame. WorldFoundry serves every released student as a native diffusion recipe, with the chunk-wise student as the default and the frame-wise and ++ students selected by variant.
  overview_zh: Causal-Forcing 把双向视频扩散蒸馏为因果自回归生成器——包括 Causal-Forcing++ 少步 variant——使视频可以逐 chunk 或逐帧生成。WorldFoundry 以原生扩散 recipe 提供全部已发布的学生模型，默认是 chunk-wise 学生，frame-wise 与 ++ 学生通过 variant 选择。
  architecture: Per the paper (arXiv 2602.02214), a Wan2.1-based teacher is distilled into causal students with chunk-wise or frame-wise attention; the ++ variants push to 1-2 step sampling. Recorded checkpoints include chunk-wise plus frame-wise and two ++ few-step variants under zhuhz22/Causal-Forcing.
  architecture_zh: 按论文（arXiv 2602.02214），基于 Wan2.1 的教师被蒸馏为 chunk-wise 或 frame-wise 注意力的因果学生；++ variant 进一步压缩到 1-2 步采样。记录的 checkpoint 包括 chunk-wise，以及 zhuhz22/Causal-Forcing 下的 frame-wise 与两个 ++ 少步 variant。
  usage_notes: Defaults follow the official CLI (480x832, 81 frames, guidance 1.0, 16 fps) with each variant's released step count. Only the frame-wise student accepts an input image, which becomes the first latent frame.
  usage_notes_zh: 默认值沿用官方 CLI（480x832、81 帧、guidance 1.0、16 fps），步数取各 variant 发布的步数。只有 frame-wise 学生接受输入图像，图像成为第一个潜帧。
  limitations:
  - Distilled causal students trade some quality for autoregressive speed versus the bidirectional teacher.
  - Image-to-video is available on the frame-wise student only.
  limitations_zh:
  - 蒸馏的因果学生以部分质量换取自回归速度，弱于双向教师。
  - 只有 frame-wise 学生支持图生视频。
  recommended_benchmarks:
  - id: vbench
    reason: Standard multi-dimension quality suite for text/image-to-video.
    reason_zh: 文/图生视频的标准多维质量评测。
