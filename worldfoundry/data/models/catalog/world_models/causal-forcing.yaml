integration:
  notes:
  - NativeCausalForcingPipeline runs every released Causal-Forcing generator as a native diffusion recipe on the
    autoregressive-window runner, offline and as a resident realtime session.
  - The public causal-forcing ID loads the chunk-wise student; variant (or model_id) selects causal-forcing-framewise,
    causal-forcing-framewise-1step or causal-forcing-framewise-2step. Each variant reads its own file from
    zhuhz22/Causal-Forcing, and the Wan2.1 text encoder, tokenizer and VAE resolve from Wan-AI/Wan2.1-T2V-1.3B.
