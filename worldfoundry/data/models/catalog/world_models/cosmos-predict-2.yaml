docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: Cosmos Predict 2 is the previous generation of NVIDIA's world foundation model, covering image-to-video and video-to-world generation with 2B and 14B video2world variants. WorldFoundry assembles it from its own denoiser, T5 conditioner, Rectified Flow AB2 scheduler, Wan codec, and standard runner; no NVIDIA runtime package or Diffusers pipeline is invoked.
  overview_zh: Cosmos Predict 2 是英伟达世界基础模型的上一代，覆盖图生视频与视频到世界生成，含 2B 与 14B 两个 video2world variant。WorldFoundry 用自有的去噪器、T5 条件器、Rectified Flow AB2 调度器、Wan 编解码器与标准 runner 组装它，不调用英伟达运行时包或 Diffusers pipeline。
  architecture: Predict2 and Predict2.5 share one checkpoint-shaped transformer implementation in WorldFoundry; recipes set the version-specific architecture and sampling values. Predict 2 conditions on T5-11B text embeddings and samples with a Rectified Flow AB2 scheduler.
  architecture_zh: 在 WorldFoundry 中，Predict2 与 Predict2.5 共享同一按 checkpoint 形状实现的 transformer；版本差异的架构与采样值由配方设定。Predict 2 以 T5-11B 文本嵌入为条件，使用 Rectified Flow AB2 调度器采样。
  usage_notes: Accept NVIDIA's gated terms before staging the Video2World checkpoints. Prefer cosmos-predict-2.5 for new work unless you need the T5-conditioned v2 recipe.
  usage_notes_zh: 就位 Video2World checkpoint 前需先接受 NVIDIA 的 gated 条款。除非需要 T5 条件的 v2 配方，新工作建议优先使用 cosmos-predict-2.5。
  limitations:
  - Architecture construction, conditioning masks, and AB2 scheduler numerics are validated, but generated output has not been checked on GPU with the gated weights.
  - Superseded by Predict 2.5 for most use cases.
  limitations_zh:
  - 架构构建、条件掩码与 AB2 调度器数值已验证，但尚未用 gated 权重在 GPU 上检查生成结果。
  - 多数场景已被 Predict 2.5 取代。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: World-generation quality across conditions.
    reason_zh: 各条件下世界生成质量评测。
  - id: physics-iq
    reason: Physical plausibility of predicted world video.
    reason_zh: 预测世界视频的物理合理性。
