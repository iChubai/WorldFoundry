availability: open_source
catalog_category: world_models
catalog_scope: world-model/interactive starred models
catalog_policy:
  checkpoint_rule: Use the official nvidia/Cosmos3-Nano and nvidia/Cosmos3-Super Diffusers repositories.
    Catalog loading never downloads weights.
  integration_rule: Cosmos3 inference is assembled from the canonical native diffusion roles;
    official safetensors are loaded directly without a framework backend.
  open_source_rule: Model provenance comes from NVIDIA/cosmos and is recorded beside the native
    checkpoint-shaped transformer implementation.
checkpoints:
- nvidia/Cosmos3-Nano
- nvidia/Cosmos3-Super
family: NVIDIA Cosmos
id: cosmos3
integration:
  notes:
  - Cosmos3 uses the shared loader, joint-modality runner, core attention, native Karras
    flow-UniPC scheduler, shared Wan VAE38, and an inference-only AVAE sound decoder.
  - Nano structural checks match 814 transformer, 196 VAE, and 182 AVAE checkpoint tensors.
    The 35-step schedule and solver trajectory match the official scheduler numerically.
  - The previous backend runtime's Workspace evidence is retained as historical context only;
    end-to-end GPU output parity must be rerun for this native path.
  - Current-revision evidence requires the exact variant SHA. The prepare script emits a structured
    checkpoint report and an explicit pinned snapshot model-ref so an older local directory is not
    silently described as current.
  - Guardrails and reasoner/serving stacks are orchestration extensions, not dependencies of
    this infer-only model recipe.
  status: integrated
