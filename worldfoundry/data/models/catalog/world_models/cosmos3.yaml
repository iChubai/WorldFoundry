docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: 'Cosmos3 is the newest, broadest Cosmos generation: one joint-modality model covering text-to-image/video, image/video-to-video, synchronized sound, and structured action inference (policy, forward and inverse dynamics), in Nano and Super variants. It runs natively through a joint-modality runner with a Karras flow-UniPC scheduler, the Wan VAE38, and an inference-only AVAE sound decoder.'
  overview_zh: Cosmos3 是最新、覆盖面最广的 Cosmos 世代：单一联合模态模型覆盖文生图/视频、图/视频到视频、同步声音，以及结构化动作推断（策略、正向与逆向动力学），含 Nano 与 Super 两个 variant。它通过联合模态 runner 原生运行，使用 Karras flow-UniPC 调度器、Wan VAE38 与仅推理的 AVAE 声音解码器。
  architecture: 'The native transformer follows the official Cosmos3-Nano and Cosmos3-Super parameter layout. Validated on Nano: the released transformer, VAE, and AVAE weights load completely, and the 35-step schedule matches the official scheduler numerically. Guardrails and the reasoner/serving stacks are not included.'
  architecture_zh: 原生 transformer 沿用官方 Cosmos3-Nano 与 Cosmos3-Super 的参数布局。已在 Nano 上验证：发布的 transformer、VAE 与 AVAE 权重可完整加载，35 步调度与官方调度器数值一致。不包含 guardrail 与 reasoner/serving 栈。
  usage_notes: Base selection routes to Nano; pick the cosmos3-super variant for the Super checkpoint. The prepare script reports the staged checkpoint revision and pins the snapshot it uses, so an older local directory is not mistaken for the current release.
  usage_notes_zh: 基础选择路由到 Nano；需要 Super checkpoint 请选 cosmos3-super variant。准备脚本会报告已就位的 checkpoint 版本并固定所用 snapshot，避免把旧的本地目录误当作当前版本。
  limitations:
  - Reasoner, training, guardrails, and vLLM serving workflows are not included; only inference is supported.
  limitations_zh:
  - 不包含 Reasoner、训练、guardrail 与 vLLM serving 工作流；仅支持推理。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: World-generation quality across conditions.
    reason_zh: 各条件下世界生成质量评测。
  - id: physics-iq
    reason: Physical plausibility of generated world video.
    reason_zh: 生成世界视频的物理合理性。
