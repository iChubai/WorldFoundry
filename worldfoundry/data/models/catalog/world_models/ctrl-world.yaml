docs:
  publisher: Tsinghua University / Stanford University
  publisher_kind: university
  publisher_zh: 清华大学 / 斯坦福大学
  overview: 'Ctrl-World is a controllable generative world model for robot manipulation: conditioned on robot actions, it predicts future observation video so policies can be evaluated or improved inside the model. Validated with the released checkpoint: a five-frame synthetic-three-view run at the released 25-step sampler default keeps scene detail in all three views.'
  overview_zh: Ctrl-World 是面向机器人操作的可控生成式世界模型：以机器人动作为条件预测未来观测视频，使策略可以在模型内被评估或改进。已用发布权重验证：按官方默认 25 步采样的五帧合成三视角推理在三个视角中都保留了场景细节。
  architecture: Ctrl-World builds on a Stable Video Diffusion image-to-video backbone (stabilityai/stable-video-diffusion-img2vid) with CLIP conditioning (openai/clip-vit-base-patch32) and adds its own action-conditioning weights (yjguo/Ctrl-World).
  architecture_zh: Ctrl-World 以 Stable Video Diffusion 图生视频模型（stabilityai/stable-video-diffusion-img2vid）为基座，使用 CLIP 条件（openai/clip-vit-base-patch32），并加入自有的动作条件权重（yjguo/Ctrl-World）。
  usage_notes: The pipeline requires the Ctrl-World, SVD, and CLIP checkpoints and synchronized three-view inputs. A single-image synthetic-three-view mode is available only for smoke validation; use the released 25-step sampler default for normal inference.
  usage_notes_zh: pipeline 需要 Ctrl-World、SVD、CLIP 权重及同步的三视角输入。单图合成三视角模式只适合冒烟验证；正常推理应使用官方默认的 25 步采样。
  limitations:
  - Action quality remains unmeasured without synchronized robot views and matching actions.
  - 'SVD-era backbone: visual fidelity trails newer DiT-based world models.'
  limitations_zh:
  - 缺少同步机器人视角与匹配动作时，无法评估动作质量。
  - SVD 时代基座：视觉保真度弱于较新的 DiT 世界模型。
  recommended_benchmarks:
  - id: worldarena
    reason: Ctrl-World is listed on WorldArena for robot world-model evaluation.
    reason_zh: Ctrl-World 已收录于 WorldArena 的机器人世界模型评测。
