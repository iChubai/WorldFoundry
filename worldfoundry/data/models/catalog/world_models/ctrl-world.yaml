integration:
  status: runtime_ported
  notes:
  - WorldFoundry registers an in-tree runtime manifest pipeline for the vendored Ctrl-World source.
  - Official WorldArena-listed source is vendored in-tree under worldfoundry/synthesis/visual_generation/ctrl_world/ctrl_world_runtime.
runtime_profile: runtime-profile:ctrl-world
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: ctrl-world
runner_parity:
  status: verified_inference_only
  notes:
  - The compatibility launcher executed the released checkpoint with local SVD and CLIP components.
  - A five-frame synthetic-three-view GPU run at the released sampler default of 25 steps
    preserved scene detail in all three views. The former four-step smoke default
    collapsed the third view and is not suitable for quality validation.
  - The default consumes synchronized ALOHA high/left-wrist/right-wrist images without synthesizing camera views.
  - Synchronized checkpoint-matched robot views and actions remain necessary for action-quality parity.
catalog_category: world_models
catalog_scope: World-model catalog entries. Integrated entries expose in-tree WorldFoundry runtimes; blocked entries retain
