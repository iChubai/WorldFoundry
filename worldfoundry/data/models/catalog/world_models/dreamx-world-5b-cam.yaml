docs:
  publisher: Alibaba (Amap, AMAP-ML)
  publisher_kind: company
  publisher_zh: 阿里巴巴（高德地图 AMAP-ML）
  overview: "DreamX-World 5B Cam is the camera-controlled model of Amap's DreamX-World. It generates world video from an image under explicit camera-pose control, and a resident session can continue each segment from the previous final frame. Validated on a single A100 with the released checkpoints: it generates finite, decodable 1280x704 frames from the official example image."
  overview_zh: DreamX-World 5B Cam 是高德 DreamX-World 的相机控制模型：在显式相机位姿控制下从图像生成世界视频，常驻会话可从上一段的最终帧续接生成。已在单张 A100 上用官方 checkpoint 验证：从官方示例图生成有限、可解码的 1280x704 帧。
  architecture: The camera-conditioned 5B diffusion model adds pose controls and runs on top of the Wan2.2 support checkpoint Wan-AI/Wan2.2-TI2V-5B, which provides the VAE and umT5 text encoder. The resident session caches weights and prompt embeddings and uses native 1+4k windows; multi-GPU inference supports Ulysses sequence parallelism on 1, 2, 3, 4, 6, or 8 GPUs.
  architecture_zh: 相机条件的 5B 扩散模型加入位姿控制，运行在 Wan2.2 支持 checkpoint Wan-AI/Wan2.2-TI2V-5B 之上，后者提供 VAE 与 umT5 文本编码器。常驻会话缓存权重与提示词嵌入，使用原生 1+4k 窗口；多卡推理支持 1、2、3、4、6、8 卡的 Ulysses 序列并行。
  usage_notes: Use the default 30-step recipe for quality output and expect long runtimes. For a quick functional check, an 8-step, 5-frame window runs on a single A100.
  usage_notes_zh: 追求质量请使用默认的 30 步配方，并预期较长的运行时间。快速功能检查可在单张 A100 上使用 8 步、5 帧窗口。
  limitations:
  - Validation used an 8-step, 5-frame window; output quality with the default 30-step recipe is not validated.
  - Requires local GD-ML/DreamX-World-5B-Cam and Wan-AI/Wan2.2-TI2V-5B checkpoints.
  limitations_zh:
  - 验证使用 8 步、5 帧窗口；默认 30 步配方下的输出质量尚未验证。
  - 需要本地 GD-ML/DreamX-World-5B-Cam 与 Wan-AI/Wan2.2-TI2V-5B checkpoint。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-pose adherence of controlled rollouts.
    reason_zh: 受控滚动生成的相机位姿贴合度。
  - id: worldmodelbench
    reason: General world-rollout quality.
    reason_zh: 世界滚动生成的总体质量。
