docs:
  publisher: The Hong Kong University of Science and Technology (Guangzhou) (EnVision Lab)
  publisher_kind: university
  publisher_zh: 香港科技大学（广州）EnVision 实验室
  overview: 'DualCamCtrl controls video generation with a camera trajectory plus a depth image: the RGB and depth conditions together pin down scene geometry so the generated camera move stays physically grounded. WorldFoundry follows the official RGB/depth/camera demo inputs.'
  overview_zh: DualCamCtrl 用「相机轨迹 + 深度图」控制视频生成：RGB 与深度条件共同确定场景几何，使生成的相机运动保持物理可信。WorldFoundry 沿用官方 RGB/深度/相机 demo 的输入。
  architecture: 'Built on the Wan2.1-Fun-V1.1-1.3B camera-control model, with the text encoder and VAE from Wan2.1-T2V-1.3B and the CLIP image encoder from Wan2.1-I2V-14B-480P. The default run follows the official recipe: an image, a depth image, a camera .torch trajectory file, 61 frames at 320x480, 50 steps.'
  architecture_zh: 基于 Wan2.1-Fun-V1.1-1.3B 相机控制模型，文本编码器与 VAE 来自 Wan2.1-T2V-1.3B，CLIP 图像编码器来自 Wan2.1-I2V-14B-480P。默认运行遵循官方配方：一张图、一张深度图、一个相机 .torch 轨迹文件，61 帧 320x480、50 步。
  usage_notes: Checkpoints load through the default Hugging Face cache/download path; pass pre-staged local assets through checkpoint_path, base_model_path, or WORLDFOUNDRY_MODEL_DIR.
  usage_notes_zh: checkpoint 默认通过 Hugging Face 缓存/下载路径加载；已就位的本地资产可通过 checkpoint_path、base_model_path 或 WORLDFOUNDRY_MODEL_DIR 传入。
  limitations:
  - Needs a depth image alongside the RGB input — pair with a depth prior when you only have RGB.
  - 'Fixed demo contract (61 frames, 320x480): other shapes are untested.'
  limitations_zh:
  - 除 RGB 输入外还需要深度图——只有 RGB 时请配合深度先验使用。
  - demo 契约固定（61 帧、320x480）：其他输出形状未经测试。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-trajectory adherence of controlled generation.
    reason_zh: 受控生成的相机轨迹贴合度。
