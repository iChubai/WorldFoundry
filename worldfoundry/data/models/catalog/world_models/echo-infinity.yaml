docs:
  publisher: JD.com (Joy Future Academy)
  publisher_kind: company
  publisher_zh: 京东（Joy Future Academy）
  overview: "Echo-Infinity is JD's autoregressive long-video generator: text in, arbitrarily long video out, generated block by block."
  overview_zh: Echo-Infinity 是京东的自回归长视频生成器：输入文本，逐块生成任意长度的视频。
  architecture: A Wan2.1-based autoregressive text-to-video design from the same JD team as Echo-Memory. The runtime is inference-only; training, prompt datasets, demo scripts, and checkpoint download helpers are not included.
  architecture_zh: 基于 Wan2.1 的自回归文生视频设计，与 Echo-Memory 出自同一京东团队。运行时仅含推理；不包含训练、提示词数据集、demo 脚本与 checkpoint 下载辅助。
  usage_notes: Stage the Echo-Infinity and Wan2.1 weights as local paths under WORLDFOUNDRY_CKPT_DIR before running.
  usage_notes_zh: 运行前请把 Echo-Infinity 与 Wan2.1 权重就位到 WORLDFOUNDRY_CKPT_DIR 下的本地路径。
  limitations:
  - 'Research-scale backbone: expect research-preview visual quality.'
  limitations_zh:
  - 研究规模基座：视觉质量属研究预览级。
  recommended_benchmarks:
  - id: vbench
    reason: Video quality evaluation for long text-to-video generation.
    reason_zh: 长文生视频的质量评测。
  - id: chronomagic-bench
    reason: Long-horizon temporal coherence evaluation.
    reason_zh: 长时程时间连贯性评测。
