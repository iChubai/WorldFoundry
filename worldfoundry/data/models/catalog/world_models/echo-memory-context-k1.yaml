docs:
  publisher: JD.com (Joy Future Academy)
  publisher_kind: company
  publisher_zh: 京东（Joy Future Academy）
  overview: "Echo-Memory Context K=1 is one model in JD's Echo-Memory family, a controlled study of how memory mechanisms affect interactive, action-conditioned world models. It is bound to the context_k1/epoch-0.safetensors checkpoint and is the minimal-context baseline: each new chunk conditions on only K=1 context frame. The checkpoint comes from the main branch of the official Hugging Face repository."
  overview_zh: Echo-Memory Context K=1（单帧上下文）是京东 Echo-Memory 家族中的一个模型，该家族对「记忆机制如何影响交互式动作条件世界模型」做受控研究。它绑定 context_k1/epoch-0.safetensors checkpoint，是最小上下文基线：每个新 chunk 仅以 K=1 帧上下文为条件。checkpoint 来自官方 Hugging Face 仓库的 main 分支。
  architecture: Per the Echo-Memory release (arXiv 2606.09803), every variant is a Wan2.1-T2V-1.3B-based interactive world model that differs only in its memory mechanism. NativeDiffusionPipeline assembles the model from shared Wan components plus a frozen-context strategy. The sampler uses target noise plus a clean-context suffix, target-only CFG, context relocking after every solver step, and target-only decode.
  architecture_zh: 按 Echo-Memory 发布（arXiv 2606.09803），所有 variant 都是基于 Wan2.1-T2V-1.3B 的交互式世界模型，差异只在记忆机制。NativeDiffusionPipeline 用共享 Wan 组件加 frozen-context 策略组装模型。采样器采用「目标噪声+干净上下文后缀」、仅目标 CFG、每个求解步后重锁上下文、仅解码目标帧。
  usage_notes: The checkpoint downloads from Echo-Team/Echo-Memory (cc-by-4.0) with the Wan2.1-T2V-1.3B base (apache-2.0). Each memory method is a separate model id; you do not select a memory method at runtime.
  usage_notes_zh: checkpoint 从 Echo-Team/Echo-Memory（cc-by-4.0）下载，基座为 Wan2.1-T2V-1.3B（apache-2.0）。每种记忆方法是独立的模型 id，运行时不选择记忆方法。
  limitations:
  - 'Research-scale backbone (Wan2.1 1.3B): expect research-preview visual quality, not production output.'
  limitations_zh:
  - 研究规模基座（Wan2.1 1.3B）：视觉质量属研究预览级，而非生产级输出。
  recommended_benchmarks:
  - id: memobench
    reason: Purpose-built for evaluating long-horizon memory in interactive world models.
    reason_zh: 专为评估交互式世界模型的长时程记忆而设。
