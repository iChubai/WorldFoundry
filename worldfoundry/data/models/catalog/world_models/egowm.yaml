docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'EgoWM is an egocentric navigation world model: from a first-person view and navigation actions it predicts the video a moving agent would see. It has a 3-DoF action variant and a 25-DoF state/action variant (egowm-svd-3dof / egowm-svd-25dof). Validated on GPU with one paired 25-DoF EVE1x sample and one paired 3-DoF SCAND trajectory.'
  overview_zh: EgoWM 是第一人称导航世界模型：给定第一视角画面与导航动作，预测移动智能体将看到的视频。提供 3 自由度动作与 25 自由度状态／动作两个 variant（egowm-svd-3dof / egowm-svd-25dof）。已在 GPU 上用一条配对 25 自由度 EVE1x 样例和一条配对 3 自由度 SCAND 轨迹验证。
  architecture: A Stable Video Diffusion backbone (stabilityai/stable-video-diffusion-img2vid) conditioned on 3-DoF navigation actions or a 25-DoF physical state and actions; the EgoWM weights come from anuragba/egowm.
  architecture_zh: 以 Stable Video Diffusion（stabilityai/stable-video-diffusion-img2vid）为基座，条件为 3 自由度导航动作或 25 自由度物理状态与动作；EgoWM 权重来自 anuragba/egowm。
  usage_notes: Stage the official EgoWM source checkout under `$WORLDFOUNDRY_MODEL_SOURCE_DIR/egowm`, the matching EgoWM checkpoint, and the SVD base model locally. The default 25-DoF variant needs an initial image and a paired `conditions_path` JSON from the same trajectory; the 3-DoF variant needs a paired `actions_path` JSON.
  usage_notes_zh: 在本地就位官方 EgoWM 源码检出（`$WORLDFOUNDRY_MODEL_SOURCE_DIR/egowm`）、对应的 EgoWM checkpoint 与 SVD 基座。默认 25 自由度 variant 需要同一轨迹的首帧图像和配对的 `conditions_path` JSON；3 自由度 variant 需要配对的 `actions_path` JSON。
  limitations:
  - Validation covers one trajectory per variant; it does not establish calibrated displacement or reliable reverse motion.
  - '`smoke_synthetic=true` and `action_scale` are synthetic smoke controls and do not test robot motion.'
  limitations_zh:
  - 验证只覆盖每个 variant 的一条轨迹，不能证明位移标定或可靠的倒退运动。
  - '`smoke_synthetic=true` 与 `action_scale` 只是合成 smoke 控制，不能检验机器人运动。'
