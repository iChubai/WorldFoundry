docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: 'GEN3C generates camera-controlled video with an explicit 3D cache: it builds a rough 3D scene from the input image (via depth), warps it along the requested camera path, and lets the video model fill in the rest — precise camera control with 3D consistency (CVPR 2025). It runs natively on the same denoiser, conditioner, and scheduler stack as the Cosmos Predict1 family.'
  overview_zh: GEN3C 用显式 3D 缓存生成相机可控视频：先从输入图（借助深度）搭出粗略 3D 场景，沿目标相机路径前向扭曲，再让视频模型补全其余部分——兼顾精确相机控制与 3D 一致性（CVPR 2025）。它原生运行在与 Cosmos Predict1 家族相同的去噪器、条件器与调度器栈上。
  architecture: Named camera trajectories, MoGe depth, and RGBD forward warping run as native preprocessing when the latents are initialized; callers may also provide pre-rendered 3D-cache tensors. The stack uses a T5 conditioner and a Karras x0 AB2 scheduler.
  architecture_zh: 命名相机轨迹、MoGe 深度与 RGBD 前向扭曲在潜变量初始化时作为原生预处理运行；调用方也可直接提供预渲染的 3D 缓存张量。栈使用 T5 条件器与 Karras x0 AB2 调度器。
  usage_notes: Stage nvidia/GEN3C-Cosmos-7B and the Ruicheng/moge-vitl depth model locally, then run the official-single-image task profile.
  usage_notes_zh: 先把 nvidia/GEN3C-Cosmos-7B 与 Ruicheng/moge-vitl 深度模型放到本地，再运行 official-single-image task profile。
  limitations:
  - 'NVIDIA source-code license: review terms before downstream use.'
  limitations_zh:
  - 英伟达源码许可：下游使用前请审阅条款。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-trajectory adherence of controlled generation.
    reason_zh: 受控生成的相机轨迹贴合度。
