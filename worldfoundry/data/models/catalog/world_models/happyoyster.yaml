id: happyoyster
name: HappyOyster
tasks:
- world-model
- api-product
- world-generation
output_artifacts:
- generated_world
provider: api
source:
  status: api
  official_repo_url: https://www.happyoyster.cn
official_sources:
  project_page: https://www.happyoyster.cn
runtime_profile: runtime-profile:happyoyster
integration:
  status: runtime_ported
  notes:
  - HappyOyster API route is registered; API credentials/endpoint are runtime-gated.
runner_parity:
  status: implemented_checkpoint_pending
  notes:
  - resolve_model_zoo_config and pipeline import are expected to pass; real generation
    emits a runtime plan until required checkpoints/assets are staged.
catalog_category: world_models
catalog_scope: World-model catalog entries. Integrated entries expose in-tree WorldFoundry
  runtimes; blocked entries retain upstream provenance without runnable backends.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: happyoyster
docs:
  publisher: HappyOyster (commercial product)
  publisher_kind: company
  publisher_zh: HappyOyster（商业产品，机构主体未记录）
  overview: 'HappyOyster is a commercial world-model API product published through its product site (happyoyster.cn) rather than a code repository. WorldFoundry lists it for reference only: no runnable API client or generation pipeline exists for it.'
  overview_zh: HappyOyster 是商业世界模型 API 产品，通过产品官网（happyoyster.cn）而非代码仓库发布。WorldFoundry 仅将其列作参考：没有可运行的 API 客户端或生成 pipeline。
  architecture: HappyOyster is a hosted commercial product; the vendor has not published its architecture.
  architecture_zh: HappyOyster 是托管的商业产品，厂商未公开其架构。
  usage_notes: Real usage requires a vendor account and API credentials. `wf run` emits a runtime plan only and does not generate output.
  usage_notes_zh: 真实使用需要厂商账号与 API 凭据。`wf run` 只输出运行时计划，不会生成结果。
  limitations:
  - No runnable API client is available, so WorldFoundry cannot generate output with HappyOyster.
  - Vendor architecture, pricing, and quality are not published.
  limitations_zh:
  - 没有可运行的 API 客户端，WorldFoundry 无法用 HappyOyster 生成结果。
  - 厂商架构、定价与质量均未公开。
