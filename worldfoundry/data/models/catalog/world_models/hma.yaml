docs:
  publisher: Massachusetts Institute of Technology (MIT)
  publisher_kind: university
  publisher_zh: 麻省理工学院（MIT）
  overview: HMA (Heterogeneous Masked Autoregression) models robot action-video dynamics across heterogeneous embodiments and datasets, fast enough for real-time interaction. Variants cover a MAGVIT-style 362M discrete model and a 1B MAR continuous model. WorldFoundry runs the official generator from a locally staged source checkout; checkpoints and robot assets must be staged locally.
  overview_zh: HMA（异构掩码自回归）跨异构机器人形态与数据集建模「动作-视频」动力学，速度足以支撑实时交互。variant 覆盖 MAGVIT 风格的 362M 离散模型与 1B MAR 连续模型。WorldFoundry 从本地就位的官方源码运行生成器；checkpoint 与机器人资产需在本地就位。
  architecture: Per the paper (arXiv 2502.04296), masked autoregression over video tokens handles heterogeneous action spaces through modality-specific heads; discrete (hma-base-disc) and continuous (hma-base-cont) checkpoints are published under liruiw (apache-2.0).
  architecture_zh: 按论文（arXiv 2502.04296），对视频 token 的掩码自回归通过按模态划分的输出头处理异构动作空间；liruiw 发布了离散（hma-base-disc）与连续（hma-base-cont）checkpoint（apache-2.0）。
  usage_notes: Stage the official HMA source at the pinned commit and the HMA checkpoint. The continuous model also needs the Stable Video Diffusion temporal VAE; the discrete model needs the official MAGVIT2 tokenizer checkpoint. For a paired rollout, pass trajectory_path with prompt frames and raw LangTable delta actions.
  usage_notes_zh: 就位固定 commit 的 HMA 官方源码与 HMA checkpoint。连续模型还需要 Stable Video Diffusion 时序 VAE；离散模型需要官方 MAGVIT2 tokenizer 权重。运行配对轨迹时，通过 trajectory_path 传入历史帧与原始 LangTable 增量动作。
  limitations:
  - The default route repeats one image and a constant action; it is a smoke configuration, so pass trajectory_path for a real paired rollout.
  - 'Research-scale resolution: outputs target dynamics fidelity, not cinematic quality.'
  limitations_zh:
  - 默认路径重复同一张图并施加恒定动作，只是 smoke 配置；真实配对轨迹需传入 trajectory_path。
  - 研究规模分辨率：输出以动力学保真为先，而非影视级画质。
  recommended_benchmarks:
  - id: ewmbench
    reason: Embodied world-model video prediction quality.
    reason_zh: 具身世界模型视频预测质量。
