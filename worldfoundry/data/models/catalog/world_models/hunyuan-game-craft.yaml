docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: 'Hunyuan GameCraft generates action-conditioned world video from a scene image: each action steers the next chunk of the rollout.'
  overview_zh: Hunyuan GameCraft 从场景图像生成动作条件的世界视频：每个动作驱动滚动生成的下一段。
  architecture: HunyuanVideo transformer with a GameCraft camera network and history-conditioned autoregressive sampling.
  architecture_zh: HunyuanVideo Transformer 结合 GameCraft 相机网络与历史条件自回归采样。
  usage_notes: 'Provide local GameCraft checkpoints. Each action generates 33 frames; explicit num_frames must equal 33 times the action count. CPU offload and output_path export are supported. Validated on a single H100 with CPU offload: one forward action produces 33 frames at 1216x704 with 50 steps.'
  usage_notes_zh: 就位本地 GameCraft 权重。每个动作生成 33 帧；显式 num_frames 必须等于动作数量乘以 33。支持 CPU offload 与 output_path 导出。已在单张 H100 上以 CPU offload 验证：单个前进动作以 50 步生成 1216x704 的 33 帧。
  limitations:
  - Multi-GPU inference is untested and FP8 conversion is not supported.
  - Requires the dedicated HYGameCraft environment (Python 3.10, torch 2.5.1).
  - The Tencent Hunyuan community license applies; see the included license and provenance.
  limitations_zh:
  - 多卡推理未经测试，不支持 FP8 转换。
  - 需要专属环境 HYGameCraft（Python 3.10，torch 2.5.1）。
  - 遵循腾讯混元社区许可，见附带许可与来源说明。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-following world-rollout quality.
    reason_zh: 动作跟随的世界滚动生成质量。
