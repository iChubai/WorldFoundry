docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: "GameCraft generates action-conditioned world video from a scene image. This public release retains its catalog and pipeline binding, but inference is blocked because its runtime package is absent."
  overview_zh: "GameCraft 从场景图像生成动作条件世界视频。公开分支保留了目录和 pipeline 绑定，但缺少运行时包，当前无法推理。"
  architecture: "The upstream model builds on HunyuanVideo with continuous action-space injection and history-conditioned autoregressive extension. Its runtime implementation is not included in this public release."
  architecture_zh: "上游模型基于 HunyuanVideo，采用连续动作空间注入与历史条件自回归扩展。此公开版本不包含其运行时实现。"
  usage_notes: "Local checkpoints do not resolve the missing runtime package. Use the upstream inference entrypoint until the public-release integration is restored."
  usage_notes_zh: "本地权重不能解决运行时源码缺失。公开分支恢复集成前，请使用上游推理入口。"
  limitations:
  - Dedicated environment (Python 3.10 / torch 2.5.1) isolated from the unified profile.
  - The upstream demo recipe uses 8 GPUs; it is not validated in this public release.
  - 'Tencent Hunyuan community license: check territory/usage terms.'
  limitations_zh:
  - 专属环境（Python 3.10 / torch 2.5.1），与统一档案隔离。
  - 上游 demo 配方使用 8 卡；本公开版本未验证该配方。
  - 腾讯混元社区许可：请核对地域/用途条款。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-following world-rollout quality.
    reason_zh: 动作跟随的世界滚动生成质量。
