docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: HunyuanWorld 1.0 generates immersive, explorable 3D worlds from text or an image — the first generation of Tencent's open world-generation stack, exporting layered panoramas and mesh scenes. WorldFoundry runs the official source route; checkpoints and third-party assets must be staged before generation.
  overview_zh: HunyuanWorld 1.0 从文本或一张图生成沉浸式、可探索的 3D 世界——腾讯开源世界生成栈的第一代，导出分层全景与网格场景。WorldFoundry 运行官方源码路径；生成前需就位 checkpoint 与第三方资产。
  architecture: 'Per the upstream release, generation goes panorama-first: a panoramic proxy is generated, semantically layered, and lifted to a 3D world representation.'
  architecture_zh: 按上游发布，生成以全景为先：先生成全景代理图，再做语义分层并提升为 3D 世界表示。
  usage_notes: Until the required checkpoints and assets are staged, a run returns a runtime plan that lists the missing assets instead of generating. For the newer stack, see hy-world-2.0.
  usage_notes_zh: 所需 checkpoint 与资产就位前，运行只输出列出缺失资产的运行时计划，不会生成内容。较新的栈请见 hy-world-2.0。
  limitations:
  - Superseded by HY-World 2.0 for most world-generation use.
  limitations_zh:
  - 多数世界生成用途已被 HY-World 2.0 取代。
  recommended_benchmarks:
  - id: worldscore
    reason: Standard scoring for generated explorable worlds.
    reason_zh: 生成可探索世界的标准评分。
