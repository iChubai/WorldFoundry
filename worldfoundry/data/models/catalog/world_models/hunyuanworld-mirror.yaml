catalog_policy:
  checkpoint_rule: Only list checkpoints that were confirmed on official Hugging Face
    model pages. Do not download weights.
  integration_rule: Closed, API-only, or unknown releases stay blocked or planned
    until an official integration surface is available.
  open_source_rule: Only mark open_source when an official GitHub repository or official
    Hugging Face model page was confirmed. Do not infer checkpoint availability from
    papers, demos, or third-party mirrors.
docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: "HunyuanWorld-Mirror is Tencent's universal 3D reconstruction model: feed it images and it returns point clouds, Gaussian splats, depth, normals, and camera parameters in one pass. Validated with the tencent/HunyuanWorld-Mirror checkpoint: GPU inference produces point-cloud PLY, Gaussian-splat PLY, depth maps, normal maps, and a scene.rrd."
  overview_zh: HunyuanWorld-Mirror 是腾讯的通用 3D 重建模型：输入图像，一次前向返回点云、高斯泼溅、深度、法线与相机参数。已用 tencent/HunyuanWorld-Mirror checkpoint 验证：GPU 推理产出点云 PLY、高斯泼溅 PLY、深度图、法线图与 scene.rrd。
  architecture: WorldFoundry runs the model through HunyuanMirrorPipeline with bundled inference code; the official repository is not needed at runtime. The environment needs onnxruntime, pycolmap, open3d, and gsplat.
  architecture_zh: WorldFoundry 通过 HunyuanMirrorPipeline 和内置的推理代码运行该模型，运行时不需要官方仓库。运行环境需要 onnxruntime、pycolmap、open3d 与 gsplat。
  usage_notes: HunyuanMirrorPipeline accepts image, input, images, or image_path payloads and writes reconstruction artifacts to the sample output directory. gsplat may need a CUDA/PyTorch-specific wheel that matches the local torch build.
  usage_notes_zh: HunyuanMirrorPipeline 接受 image、input、images 或 image_path 负载，并把重建产物写入样例输出目录。gsplat 可能需要与本地 torch 构建匹配的 CUDA/PyTorch 专用 wheel。
  limitations:
  - Requires GPU-compatible torch/gsplat packages in the runtime environment.
  - 'Reconstruction-oriented: it does not generate new content, it reconstructs what it sees.'
  limitations_zh:
  - 运行环境需要 GPU 兼容的 torch/gsplat 包。
  - 面向重建：它不生成新内容，只重建所见。
