catalog_policy:
  checkpoint_rule: Only list checkpoints that were confirmed on official Hugging Face
    model pages. Do not download weights.
  integration_rule: Closed, API-only, or unknown releases stay blocked or planned
    until an official integration surface is available.
  open_source_rule: Only mark open_source when an official GitHub repository or official
    Hugging Face model page was confirmed. Do not infer checkpoint availability from
    papers, demos, or third-party mirrors.
docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: 'HunyuanWorld-Voyager generates RGB-D video along a camera path from an input image. Validated on the official case1 example: the public runner, bridged to the licensed upstream checkout, produces a decodable 45-frame RGB-D video at 768×1024, 24 fps, including with the upstream 50-step default.'
  overview_zh: HunyuanWorld-Voyager 从输入图像出发，沿相机路径生成 RGB-D 视频。已在官方 case1 示例上验证：公开 runner 通过桥接已授权的上游源码，生成可完整解码的 45 帧 RGB-D 视频（768×1024，24 fps），上游默认的 50 步配置同样跑通。
  architecture: Per the upstream release, Voyager combines a HunyuanVideo-based generator with joint RGB-D output and a world-cache mechanism for long-range consistency. The official case1 defaults are num_frames=49, infer_steps=50, flow_shift=7.0, embedded_cfg_scale=6.0, i2v_stability=true.
  architecture_zh: 按上游发布，Voyager 将基于 HunyuanVideo 的生成器与 RGB-D 联合输出及世界缓存机制结合，实现长程一致性。官方 case1 默认值为：num_frames=49、infer_steps=50、flow_shift=7.0、embedded_cfg_scale=6.0、i2v_stability=true。
  usage_notes: Provide a separate official checkout at revision 6218ccd36df77d0254dcf24ad1fb77312f75b04a, the checkpoint, an official-dependency Python environment, and a 49-frame rendered condition directory. Set WORLDFOUNDRY_VOYAGER_SOURCE_ROOT and WORLDFOUNDRY_VOYAGER_PYTHON. The Tencent community license excludes use in the EU, UK, and South Korea and restricts redistribution.
  usage_notes_zh: 需提供固定版本 6218ccd36df77d0254dcf24ad1fb77312f75b04a 的外部官方源码、权重、官方依赖环境及含 49 帧的已渲染条件目录，并设置 WORLDFOUNDRY_VOYAGER_SOURCE_ROOT 和 WORLDFOUNDRY_VOYAGER_PYTHON。腾讯社区许可证排除欧盟、英国、韩国境内使用，并限制再分发。
  limitations:
  - The official case1 requests 49 frames but the latent-concat I2V pipeline discards four conditioning frames, yielding 45 video frames; longer voyages need iterative extension.
  - Depth quality is generative, not sensor-grade — validate before metric use.
  - Validation covers the official case1 example only; arbitrary camera paths, long-range extension, and quantitative depth or camera fidelity are not validated.
  limitations_zh:
  - 官方 case1 请求 49 帧，但 latent-concat I2V 流程丢弃 4 帧条件帧，最终视频为 45 帧；更长的游走需要迭代扩展。
  - 深度是生成式的、非传感器级——用于米制用途前请先验证。
  - 验证只覆盖官方 case1 示例；任意相机路径、长程扩展以及深度或相机精度的定量评估均未验证。
  recommended_benchmarks:
  - id: worldscore
    reason: Scoring for camera-navigable generated worlds.
    reason_zh: 相机可游走生成世界的评分。
  - id: camerabench
    reason: Camera-path adherence evaluation.
    reason_zh: 相机路径贴合度评测。
