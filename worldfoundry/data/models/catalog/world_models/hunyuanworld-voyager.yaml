integration:
  notes:
  - >-
    The public pipeline cannot load because its in-tree Voyager config.py and
    runtime.py sources are missing, leaving only pycache files. The upstream pinned
    tree is a different package and lacks the WorldFoundry runtime adapter.
  status: blocked
