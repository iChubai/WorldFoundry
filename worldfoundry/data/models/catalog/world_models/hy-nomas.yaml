docs:
  publisher: Tencent Hunyuan
  publisher_kind: company
  publisher_zh: 腾讯混元
  overview: Segment-autoregressive text and camera controlled world generation with the distilled Hy-Nomas DiT and PixelUMM decoder.
  overview_zh: 基于蒸馏 Hy-Nomas DiT 与 PixelUMM 解码器的文本和相机控制分段自回归世界生成。
  architecture: Native Hy-Nomas components reuse shared attention, RMSNorm, modulation, MLP, Qwen2.5-VL backbone, checkpoint loading, Euler scheduling and compressed KV storage.
  architecture_zh: 原生 Hy-Nomas 组件复用共享 attention、RMSNorm、调制、MLP、Qwen2.5-VL 基座、checkpoint 加载、Euler 调度与压缩 KV 存储。
  usage_notes: Ordered prompts are successive segments of one world. Use normalized camera-to-world matrices for explicit camera control. Stage the floating-point DiT, PixelUMM and Qwen2.5-VL-7B weights separately.
  usage_notes_zh: 有序 prompt 表示同一世界的连续片段。显式相机控制使用归一化 camera-to-world 矩阵。分别准备浮点 DiT、PixelUMM 与 Qwen2.5-VL-7B 权重。
  limitations:
  - Real-checkpoint generation, CUDA quantization and Studio performance require GPU validation.
  - Low-memory inference uses native runtime INT8/FP8 transforms of floating-point checkpoints, not the upstream packed export ABI.
  limitations_zh:
  - 真实权重生成、CUDA 量化和 Studio 性能需要 GPU 验证。
  - 低显存推理使用原生运行时对浮点 checkpoint 进行 INT8/FP8 变换，不使用上游打包导出的 ABI。
