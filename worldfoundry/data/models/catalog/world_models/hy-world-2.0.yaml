docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: 'HY-World 2.0 is Tencent''s second-generation world stack. WorldFoundry runs its WorldMirror 2.0 reconstruction component, verified through the Workspace infer path; it exports depth, normals, point cloud, Gaussian splat, cameras, COLMAP files, and RRD scene metadata.'
  overview_zh: HY-World 2.0 是腾讯第二代世界生成栈。WorldFoundry 运行其中的 WorldMirror 2.0 重建组件，已通过 Workspace 推理路径验证，可导出深度、法线、点云、高斯泼溅、相机参数、COLMAP 文件与 RRD 场景元数据。
  architecture: WorldMirror 2.0 is a feed-forward reconstruction network that predicts depth, normals, cameras, point clouds and Gaussian splats from images or video. The upstream HY-Pano 2.0 panorama generator and five-stage world generation are not part of WorldFoundry.
  architecture_zh: WorldMirror 2.0 是前馈式重建网络，从图像或视频预测深度、法线、相机、点云与高斯泼溅。上游的 HY-Pano 2.0 全景生成与五阶段世界生成不在 WorldFoundry 中。
  usage_notes: Run task worldrecon for WorldMirror 2.0 reconstruction from an image directory or video.
  usage_notes_zh: 使用 worldrecon 任务，从图像目录或视频运行 WorldMirror 2.0 重建。
  limitations:
  - Only the WorldMirror 2.0 reconstruction component is available; panorama and world generation are not.
  limitations_zh:
  - 仅提供 WorldMirror 2.0 重建组件；全景生成与世界生成不可用。
  recommended_benchmarks:
  - id: worldscore
    reason: Standard scoring for generated explorable worlds.
    reason_zh: 生成可探索世界的标准评分。
