docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: "HY-World 2.0 is Tencent's second-generation world stack with three components: HY-Pano 2.0 panorama generation, WorldMirror 2.0 reconstruction, and full text/image-to-3D-world generation. WorldFoundry runs the panorama and reconstruction components; full world generation runs upstream only. The validated WorldMirror 2.0 reconstruction path exports depth, normals, point cloud, Gaussian splat, cameras, COLMAP files, and RRD scene metadata."
  overview_zh: HY-World 2.0 是腾讯第二代世界生成栈，包含三个组件：HY-Pano 2.0 全景生成、WorldMirror 2.0 重建，以及完整文/图到 3D 世界生成。WorldFoundry 运行全景与重建组件；完整世界生成仅能用上游代码运行。已验证的 WorldMirror 2.0 重建路径导出深度、法线、点云、高斯泼溅、相机参数、COLMAP 文件与 RRD 场景元数据。
  architecture: The upstream five-stage world generation chains WorldNav trajectory generation, trajectory rendering, video generation, GS data preparation, and 3DGS composition (traj_generate.py through world_gs_trainer.py) plus a VLM endpoint. WorldFoundry runs HY-Pano 2.0 and WorldMirror 2.0; the other stages run upstream only.
  architecture_zh: 上游的五阶段世界生成串联 WorldNav 轨迹生成、轨迹渲染、视频生成、GS 数据准备与 3DGS 组合（traj_generate.py 到 world_gs_trainer.py），另需 VLM 端点。WorldFoundry 运行 HY-Pano 2.0 与 WorldMirror 2.0；其余阶段仅能用上游代码运行。
  usage_notes: Use the WorldMirror 2.0 reconstruction path for 3D outputs; run full world generation with the upstream code. The trajectory-render stage is available separately as hyworld-worldgen.
  usage_notes_zh: 需要 3D 输出时使用 WorldMirror 2.0 重建路径；完整世界生成请用上游代码运行。轨迹渲染阶段单独提供为 hyworld-worldgen。
  limitations:
  - Full text/image-to-3D-world generation is not available in WorldFoundry; use the upstream code.
  - The worldgen stages need native extensions and a VLM endpoint.
  limitations_zh:
  - WorldFoundry 不提供完整文/图到 3D 世界生成，请使用上游代码。
  - worldgen 各阶段需要原生扩展与 VLM 端点。
  recommended_benchmarks:
  - id: worldscore
    reason: Standard scoring for generated explorable worlds.
    reason_zh: 生成可探索世界的标准评分。
