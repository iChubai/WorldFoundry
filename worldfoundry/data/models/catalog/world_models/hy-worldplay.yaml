catalog_policy:
  checkpoint_rule: Only list checkpoints that were confirmed on official Hugging Face
    model pages. Do not download weights.
  integration_rule: Closed, API-only, or unknown releases stay blocked or planned
    until an official integration surface is available.
  open_source_rule: Only mark open_source when an official GitHub repository or official
    Hugging Face model page was confirmed. Do not infer checkpoint availability from
    papers, demos, or third-party mirrors.
docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: "HY-WorldPlay is Tencent's real-time interactive world video model: starting from an image, it follows pose/action input to roll the world forward — the interactive arm of the Hunyuan world stack. Validated on the official image-pose-video route with the official 8-GPU execution profile."
  overview_zh: HY-WorldPlay 是腾讯的实时交互世界视频模型：从一张图出发，跟随位姿/动作输入向前滚动世界——混元世界栈的交互分支。已按官方 image-pose-video 路径与官方 8 卡执行档案验证。
  architecture: tencent/HY-WorldPlay action weights run on tencent/HunyuanVideo-1.5 video-model assets, with Qwen2.5-VL-7B-Instruct, byt5-small, and FLUX.1-Redux-dev as support components. The in-tree pipeline follows the official demo contract.
  architecture_zh: tencent/HY-WorldPlay 动作权重运行在 tencent/HunyuanVideo-1.5 视频模型资产之上，辅以 Qwen2.5-VL-7B-Instruct、byt5-small 与 FLUX.1-Redux-dev 支持组件。树内 pipeline 遵循官方 demo 契约。
  usage_notes: The official route launches 8 torchrun ranks; stage all five checkpoint sets before running.
  usage_notes_zh: 官方路径启动 8 个 torchrun rank；运行前请就位全部五套 checkpoint。
  limitations:
  - Official execution profile needs 8 GPUs.
  - Benchmark scores and long interaction suites have not been measured.
  limitations_zh:
  - 官方执行档案需要 8 卡。
  - 尚未测量 benchmark 分数与长交互套件。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Interactive world-rollout quality.
    reason_zh: 交互式世界滚动生成质量。
  - id: camerabench
    reason: Pose/camera-following accuracy.
    reason_zh: 位姿/相机跟随精度。
