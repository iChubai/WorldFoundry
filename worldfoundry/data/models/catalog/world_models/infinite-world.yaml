docs:
  publisher: Meituan (MeiGen-AI)
  publisher_kind: company
  publisher_zh: 美团（MeiGen-AI）
  overview: "Infinite-World is MeiGen-AI's long-horizon world video model: from one image it navigates and extends a world over long durations. Validated on GPU with the official image-conditioned navigation demo settings: the pipeline produces a long-horizon world video with preview metadata."
  overview_zh: Infinite-World 是美团 MeiGen-AI 的长时程世界视频模型：从一张图出发，长时间地在世界中导航与扩展。已在 GPU 上按官方图像条件导航 demo 设置验证：pipeline 生成长时程世界视频及预览元数据。
  architecture: WorldFoundry runs Infinite-World in-tree from either a local or a Hugging Face checkpoint layout; inference does not need an external source checkout.
  architecture_zh: WorldFoundry 在树内运行 Infinite-World，可使用本地或 Hugging Face checkpoint 布局；推理不需要外部源码检出。
  usage_notes: Stage the checkpoint in the official local/Hugging Face layout and start from the official image-conditioned navigation demo settings.
  usage_notes_zh: 按官方本地/Hugging Face 布局就位 checkpoint，并从官方图像条件导航 demo 设置出发。
  limitations:
  - Long-horizon quality naturally drifts; validate outputs for your duration targets.
  limitations_zh:
  - 长时程质量会自然漂移；请针对你的时长目标验证输出。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Long-horizon world-rollout quality.
    reason_zh: 长时程世界滚动生成质量。
  - id: memobench
    reason: Long-horizon consistency evaluation.
    reason_zh: 长时程一致性评测。
