docs:
  publisher: InSpatio
  publisher_kind: lab
  publisher_zh: InSpatio
  overview: 'InSpatio-World is a 1.3B video-conditioned world generator: given a video and a target trajectory it synthesizes trajectory-conditioned novel views of the same world. Validated with the released checkpoint: the pipeline generates a visually correct 297-frame video.'
  overview_zh: InSpatio-World 是 1.3B 的视频条件世界生成器：给定一段视频与目标轨迹，合成同一世界的轨迹条件新视角。已用发布的 checkpoint 验证：pipeline 生成的 297 帧视频通过了视觉检查。
  architecture: The checkpoint is inspatio/world (apache-2.0), used with the Wan2.1-T2V-1.3B base, Depth Anything 3 for geometry reconstruction, and Florence-2-large for video captioning. An optional use_tae path loads taew2_1.pth from the shared checkpoint root; the default Wan VAE path does not need it.
  architecture_zh: checkpoint 为 inspatio/world（apache-2.0），配合 Wan2.1-T2V-1.3B 基座、用于几何重建的 Depth Anything 3 以及用于视频描述的 Florence-2-large 使用。可选的 use_tae 路径会从共享 checkpoint 根加载 taew2_1.pth；默认 Wan VAE 路径不需要它。
  usage_notes: 'All default components load from local checkpoint storage only: stage inspatio/world, Wan-AI/Wan2.1-T2V-1.3B, depth-anything/DA3NESTED-GIANT-LARGE-1.1, and microsoft/Florence-2-large before running.'
  usage_notes_zh: 所有默认组件只从本地 checkpoint 存储加载：运行前请就位 inspatio/world、Wan-AI/Wan2.1-T2V-1.3B、depth-anything/DA3NESTED-GIANT-LARGE-1.1 与 microsoft/Florence-2-large。
  limitations:
  - 'Video-conditioned by design: it needs an input video, not just an image or prompt.'
  limitations_zh:
  - 设计上以视频为条件：需要输入视频，而不仅是图像或提示词。
  recommended_benchmarks:
  - id: camerabench
    reason: Trajectory-following accuracy of generated views.
    reason_zh: 生成视角的轨迹跟随精度。
