integration:
  status: runtime_ported
  notes:
  - WorldFoundry exposes an infer-only wrapper for the official LeWorldModel eval route under synthesis/visual_generation/le_wm.
  - Runtime eval configs live under data/models/runtime/configs/le_wm/config/eval; train configs are not required for inference.
runner_parity:
  status: pending
  notes:
  - The route matches the official eval.py config flow and reports missing stable-worldmodel packages, task datasets, or non-random policy checkpoints before execution.
  - Official PushT evaluation parity remains pending; per-run validation evidence
    is tracked outside the model catalog.
runtime_profile: runtime-profile:leworldmodel
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: leworldmodel
output_artifacts:
- generated_world
catalog_category: world_models
catalog_scope: World-model catalog entries. Integrated entries expose in-tree WorldFoundry runtimes; blocked
  entries retain upstream provenance without runnable backends.
docs:
  publisher: Mila – Quebec AI Institute / Université de Montréal
  publisher_kind: university
  publisher_zh: Mila 魁北克人工智能研究所 / 蒙特利尔大学
  overview: 'LeWorldModel (le-wm) studies latent world models: JEPA-style and pixel-space world models trained and evaluated on control tasks such as PushT. WorldFoundry runs the official evaluation route for inference only; execution needs stable-worldmodel packages, task datasets, and policy checkpoints when the policy is not random.'
  overview_zh: LeWorldModel（le-wm）研究潜空间世界模型：在 PushT 等控制任务上训练与评估 JEPA 式及像素空间世界模型。WorldFoundry 以仅推理方式运行官方评估路径；执行需要 stable-worldmodel 包、任务数据集，以及策略非随机时的策略 checkpoint。
  architecture: It covers latent (JEPA) and pixel world-model variants, with checkpoints at eren23/lewm-models. Inference uses the official eval configs; training configs are not required.
  architecture_zh: 覆盖潜空间（JEPA）与像素两类世界模型 variant，checkpoint 位于 eren23/lewm-models。推理使用官方 eval 配置，不需要训练配置。
  usage_notes: The route follows the official eval.py config flow and checks for stable-worldmodel packages, task datasets, and non-random policy checkpoints before execution.
  usage_notes_zh: 该路径遵循官方 eval.py 配置流程，并在执行前检查 stable-worldmodel 包、任务数据集与非随机策略 checkpoint。
  limitations:
  - 'Evaluation-oriented world model: it scores dynamics and does not render showcase video.'
  - Results have not been compared against the official PushT evaluation.
  limitations_zh:
  - 面向评估的世界模型：用于评价动力学，不渲染演示视频。
  - 结果尚未与官方 PushT 评估对齐。
