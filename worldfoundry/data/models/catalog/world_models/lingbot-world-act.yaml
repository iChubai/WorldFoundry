id: lingbot-world-act
name: LingBot-World Base Act
tasks: [interactive-world-model, action-conditioned-video]
provider: Robbyant
availability: open_source
checkpoints: [robbyant/lingbot-world-base-act-preview]
source:
  status: open_source
  official_repo_url: https://github.com/robbyant/lingbot-world
  license: apache-2.0
official_sources:
  project_page: https://technology.robbyant.com/lingbot-world
  paper: https://arxiv.org/abs/2601.20540
  github:
    url: https://github.com/robbyant/lingbot-world
    revision: a43bec7f8091c83e9b30b16b912f6fc906236fa6
  huggingface:
  - repo_id: robbyant/lingbot-world-base-act-preview
    type: model
integration:
  status: integrated
  notes:
  - Base-Act is independently cataloged and resolves the official action checkpoint rather than Base-Cam.
  - The inference path reuses the in-tree LingBot runtime and central Wan base modules.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: lingbot-world-act
runtime_profile: runtime-profile:lingbot-world-act
runner_parity:
  status: verified_configuration
  notes:
  - The dedicated LingBot environment loaded the Base-Act preview checkpoint with control_type=act. An earlier 49-frame, 40-step room example and a current 17-frame, 8-step cat example both generated checkpoint-backed action-conditioned MP4s.
  - The public WorldFoundryPipelineRunner binding also generated the cat example at 17 frames and 8 steps. Its 544x720, 16 fps MP4 decoded fully; first, middle, and last frames were visually reviewed with non-black, changing content. Action-only adherence and the official 161-frame recipe remain untested.
catalog_category: world_models
docs:
  publisher: Robbyant (Ant Group)
  publisher_kind: company
  publisher_zh: 蚂蚁灵波科技（Robbyant，蚂蚁集团）
  overview: 'LingBot-World Base Act is the action-conditioned sibling of LingBot-World: instead of camera poses it consumes an action matrix, making it the interactive-control profile of the family. It loads the official Base-Act preview checkpoint, not Base-Cam.'
  overview_zh: LingBot-World Base Act 是 LingBot-World 的动作条件同门：它消费动作矩阵而非相机位姿，是该家族的交互控制档案。它加载官方 Base-Act 预览 checkpoint，而不是 Base-Cam。
  architecture: The inference path reuses the in-tree LingBot runtime and central Wan base modules (apache-2.0). Inputs are prompt, image, pose, and action_matrix.
  architecture_zh: 推理路径复用树内 LingBot 运行时与中央 Wan 基座模块（apache-2.0）。输入为提示词、图像、位姿与 action_matrix。
  usage_notes: 'Validated with the Base-Act preview checkpoint: the public runner generates a 17-frame, 8-step clip (544×720, 16 fps) from an image and a forward WASD action matrix in the dedicated LingBot environment.'
  usage_notes_zh: 已用 Base-Act 预览权重验证：公开 runner 在专属 LingBot 环境中，根据一张图像和前进 WASD 动作矩阵生成 17 帧、8 步的视频（544×720，16 fps）。
  limitations:
  - Only the 17-frame, 8-step configuration is validated; action adherence and the official 161-frame recipe are untested.
  - Must run in the dedicated LingBot environment; act2cam output in the unified environment is near-black.
  limitations_zh:
  - 仅验证了 17 帧、8 步配置；动作贴合度与官方 161 帧配方尚未测试。
  - 必须在专属 LingBot 环境运行；统一环境下 act2cam 输出近黑画面。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-conditioned world-rollout quality.
    reason_zh: 动作条件世界滚动生成质量。
