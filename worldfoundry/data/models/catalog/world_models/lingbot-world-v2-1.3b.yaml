  notes:
  - Independent 1536-wide, 30-layer, 12-head architecture; the 14B entry remains unchanged.
  - Root-level indexed transformer shards use shared Wan T5, tokenizer and VAE assets.
  - Four-latent causal sampling uses shift 5, integer timesteps and a request-owned FP32 noise bank.
