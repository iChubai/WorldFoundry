  publisher_zh: 蚂蚁灵波科技（Robbyant，蚂蚁集团）
  overview: LingBot-World-V2 1.3B is Robbyant's causal-fast camera-controlled world model, a smaller sibling of the 14B lingbot-world-v2 with its own checkpoint and defaults.
  overview_zh: LingBot-World-V2 1.3B 是 Robbyant 的 causal-fast 相机控制世界模型，是 14B lingbot-world-v2 的小规模版本，拥有独立的 checkpoint 与默认配置。
  architecture: 30 transformer layers, hidden width 1536, FFN width 8960 and 12 attention heads; shared Wan2.1 VAE and UMT5 text encoding.
  architecture_zh: 30 层 Transformer、1536 隐藏宽度、8960 FFN 宽度、12 个注意力头，复用 Wan2.1 VAE 与 UMT5 文本编码。
  usage_notes: Offline-first. Supply shared_assets_path pointing to the Wan2.1 T5/tokenizer/VAE assets.
  usage_notes_zh: 离线优先；shared_assets_path 指向 Wan2.1 的 T5、tokenizer 和 VAE 资产目录。
  limitations:
  - CC BY-NC-SA 4.0 non-commercial license.
