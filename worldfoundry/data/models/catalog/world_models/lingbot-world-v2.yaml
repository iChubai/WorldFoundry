- generated_world_video
catalog_category: world_models
catalog_scope: World-model catalog entries with in-tree inference runtimes.
docs:
  publisher: Robbyant (Ant Group)
  publisher_kind: company
  publisher_zh: 蚂蚁灵波科技（Robbyant，蚂蚁集团）
  overview: "LingBot-World-V2 (also aliased lingbot-world-infinity) is the second generation of Robbyant's world model: a 14B causal-fast model for image-to-world video with camera control. Validated with the released checkpoint: the causal-fast route generates a decodable 9-frame 848x464 video at 16 FPS on one 80 GB GPU."
  overview_zh: LingBot-World-V2（别名 lingbot-world-infinity）是蚂蚁灵波世界模型的第二代：14B causal-fast 模型，用于带相机控制的图到世界视频。已用发布权重验证：causal-fast 路径可在单张 80 GB GPU 上生成可解码的 9 帧 848x464、16 FPS 视频。
  architecture: Uses WorldFoundry's shared Wan, T5, VAE, scheduler, FSDP, and media components. Only the released causal-fast route is included; training and the unreleased causal-pretrain and bidirectional routes are not. The checkpoint is robbyant/lingbot-world-v2-14b-causal-fast.
  architecture_zh: 使用 WorldFoundry 共享的 Wan、T5、VAE、调度器、FSDP 与媒体组件。仅包含已发布的 causal-fast 路径；不包含训练与未发布的 causal-pretrain、双向路径。checkpoint 为 robbyant/lingbot-world-v2-14b-causal-fast。
  usage_notes: The official causal-fast recipe uses eight GPUs; a four-GPU compact topology is also supported. When launched inside an existing torchrun process group, inference runs in that group without starting nested torchrun workers.
  usage_notes_zh: 官方 causal-fast 配方为八卡，也支持四卡紧凑拓扑。在已有 torchrun 进程组内启动时，推理直接在该组内运行，不再嵌套启动 torchrun。
  limitations:
  - 'CC BY-NC-SA 4.0: non-commercial license.'
  - Only a short single-GPU run is validated; the official 8-GPU 361-frame output and camera-control accuracy are not yet verified.
  - '14B model: high GPU memory requirements.'
  limitations_zh:
  - CC BY-NC-SA 4.0：非商用许可。
  - 仅验证了单卡短视频；官方 8 卡 361 帧输出与相机控制精度尚未验证。
  - 14B 模型：显存需求高。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-control adherence of world rollouts.
    reason_zh: 世界滚动生成的相机控制贴合度。
  - id: worldmodelbench
    reason: General world-rollout quality.
    reason_zh: 世界滚动生成的总体质量。
