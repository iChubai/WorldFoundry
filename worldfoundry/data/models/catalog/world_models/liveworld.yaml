docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'LiveWorld is a camera-controlled video-to-video world model with a monitor-centric workflow: it consumes a video plus a geometry NPZ and re-renders the scene under new camera behavior. WorldFoundry runs the official source with a dedicated geometry-NPZ input route.'
  overview_zh: LiveWorld 是相机可控的视频到视频世界模型，采用以监控画面为中心的工作流：输入视频加几何 NPZ，在新的相机行为下重新渲染场景。WorldFoundry 以官方源码运行，并提供专用的几何 NPZ 输入路径。
  architecture: LiveWorld adds its own LoRA and state adapter (ZichengD/LiveWorld) to the Wan2.1-T2V-14B base model, and uses Qwen3-VL-8B-Instruct for entity detection, SAM3 for segmentation, STream3R for reconstruction, and DINOv3 for matching.
  architecture_zh: LiveWorld 在 Wan2.1-T2V-14B 基座上叠加自有的 LoRA 与 state adapter（ZichengD/LiveWorld），并用 Qwen3-VL-8B-Instruct 做实体检测、SAM3 做分割、STream3R 做重建、DINOv3 做匹配。
  usage_notes: 'Inputs are prompt, video, and geometry_npz. Stage all six checkpoint snapshots locally before running: ZichengD/LiveWorld, Wan2.1-T2V-14B, Qwen3-VL-8B-Instruct, SAM3, STream3R, and DINOv3.'
  usage_notes_zh: 输入为提示词、视频与 geometry_npz。运行前需在本地就位全部六个 checkpoint snapshot：ZichengD/LiveWorld、Wan2.1-T2V-14B、Qwen3-VL-8B-Instruct、SAM3、STream3R 与 DINOv3。
  limitations:
  - Needs a geometry NPZ alongside the video input.
  limitations_zh:
  - 除视频输入外还需要几何 NPZ。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-behavior adherence of re-rendered video.
    reason_zh: 重渲染视频的相机行为贴合度。
