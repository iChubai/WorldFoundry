catalog_policy:
  checkpoint_rule: Only list checkpoints that were confirmed on official Hugging Face
    model pages. Do not download weights.
  integration_rule: Closed, API-only, or unknown releases stay blocked or planned
    until an official integration surface is available.
  open_source_rule: Only mark open_source when an official GitHub repository or official
    Hugging Face model page was confirmed. Do not infer checkpoint availability from
    papers, demos, or third-party mirrors.
docs:
  publisher: Skywork AI (Kunlun Tech)
  publisher_kind: company
  publisher_zh: 昆仑万维（Skywork AI）
  overview: "Matrix-Game 2.0 is Skywork's real-time-oriented interactive world model generation: an auto-regressive diffusion design that follows keyboard/mouse actions across game scenes. Validated against the official universal mode with a 15-latent-frame run at 12 fps and 352x640 using official bench actions."
  overview_zh: Matrix-Game 2.0 是昆仑万维面向实时的交互式世界模型：自回归扩散设计，在游戏场景中跟随键鼠动作。已使用官方 bench 动作，在 12 fps、352x640 下以 15 个 latent 帧的短流程对照官方 universal 模式验证。
  architecture: The in-tree runtime needs no external source checkout and generates the official benchmark action trajectories (Bench_actions_*) itself. The `matrix-game-2-universal-action-validation` variant runs the official universal mode for checking action fidelity.
  architecture_zh: 树内运行时不需要外部源码检出，并自带官方 bench 动作轨迹（Bench_actions_*）生成器。`matrix-game-2-universal-action-validation` variant 运行官方 universal 模式，用于检验动作保真度。
  usage_notes: Start with the `matrix-game-2-universal-action-validation` variant. The official default is 150 latent frames at 12 fps, seed=42, 352x640, with bench actions. Needs at least 24 GB of VRAM.
  usage_notes_zh: 从 `matrix-game-2-universal-action-validation` variant 起步。官方默认设置为 150 个 latent 帧、12 fps、seed=42、352x640，并使用 bench 动作。显存至少需要 24 GB。
  limitations:
  - 352x640 default resolution targets real-time interaction, not cinematic quality.
  - Validation covers a 15-latent-frame run; the full 150-latent-frame default has not been compared with the official implementation.
  limitations_zh:
  - 默认 352x640 分辨率面向实时交互，而非影视级画质。
  - 验证只覆盖 15 个 latent 帧的短流程；官方默认的完整 150 个 latent 帧尚未与官方实现对照。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-conditioned game-world rollout quality.
    reason_zh: 动作条件游戏世界滚动生成质量。
