  publisher_zh: 生数科技（Shengshu AI）
  overview: minWM HY Action2V generates camera-controlled video from a prompt, image and trajectory on a HunyuanVideo-1.5 base.
  overview_zh: minWM HY Action2V 基于 HunyuanVideo-1.5，从提示词、图像和轨迹生成相机可控视频。
  architecture: The inference-only camera transformer keeps the upstream PRoPE and autoregressive caches and uses the HunyuanVideo-1.5 VAE and encoders.
  architecture_zh: 仅推理的相机 Transformer 保留上游 PRoPE 和自回归缓存，使用 HunyuanVideo-1.5 的 VAE 与编码器。
  usage_notes: 'Stage HY15/Action2V/dmd plus the HunyuanVideo-1.5 encoders and VAE; only this subset of the minWM repository is needed. The public pipeline uses camera-conditioned four-step autoregressive inference and spatially tiled VAE decoding. Validated on a single H100: 77 frames at 832×480 with four DMD steps and a camera trajectory.'
  usage_notes_zh: 准备 HY15/Action2V/dmd 及 HunyuanVideo-1.5 的编码器、VAE；minWM 仓库只需这一子集。公开入口使用相机条件四步自回归推理和 VAE 空间分块解码。已在单张 H100 上验证：带相机轨迹、四步 DMD 生成 832×480 的 77 帧视频。
  limitations:
  - Only camera-conditioned generation is supported; non-camera modes are not available in this runtime.
  - HY15-derived files retain Tencent Hunyuan license terms; see the included licenses and provenance.
  limitations_zh:
  - 仅支持相机条件生成；该运行时不提供无相机条件模式。
  - HY15 衍生文件保留腾讯混元许可条款，见附带许可与来源说明。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera/motion-trajectory adherence.
    reason_zh: 相机/运动轨迹贴合度。
