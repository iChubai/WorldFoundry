catalog_category: world_models
docs:
  publisher: Shengshu Technology
  publisher_kind: company
  publisher_zh: 生数科技（Shengshu AI）
  overview: "minWM HY Action2V generates camera-controlled video from a prompt, image and trajectory on a HunyuanVideo-1.5 base. Its vendored entrypoint currently depends on WorldPlay runtime modules absent from this public release."
  overview_zh: "minWM HY Action2V 基于 HunyuanVideo-1.5，从提示词、图像和轨迹生成相机可控视频。内置入口依赖此公开分支缺失的 WorldPlay 运行时模块。"
  architecture: The official source is vendored at a pinned revision (apache-2.0). Only the HY15/Action2V/dmd subset of the 384.97 GB upstream minWM repository is required — the entry deliberately avoids pulling the full research archive.
  architecture_zh: 官方源码以固定 revision 内置（apache-2.0）。仅需上游 384.97 GB minWM 仓库中的 HY15/Action2V/dmd 子集——该条目有意避免拉取完整研究归档。
  usage_notes: "Inference is blocked by missing WorldPlay modules, even with the HY15 DMD checkpoints staged. The independently runnable Wan sibling is cataloged as minwm-wan-action2v."
  usage_notes_zh: "即使 HY15 DMD 权重已就位，推理仍被缺失的 WorldPlay 模块阻塞。可独立运行的 Wan 版本记录为 minwm-wan-action2v。"
  limitations:
  - Runner parity is blocked by missing WorldPlay runtime modules.
  - The upstream repository is enormous (384.97 GB) — stage only the required subset.
  limitations_zh:
  - runner parity 被缺失的 WorldPlay 运行时模块阻塞。
  - 上游仓库极大（384.97 GB）——请只就位所需子集。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera/motion-trajectory adherence.
    reason_zh: 相机/运动轨迹贴合度。
