  publisher_zh: 生数科技（Shengshu AI）
  overview: "minWM Wan Action2V is the Wan2.1 sibling of Shengshu's minimal world-model recipe: trajectory in, action-conditioned camera-controllable video out, through a distilled DMD entrypoint. WorldFoundry runs the dedicated Wan2.1 Action2V route with native action tokens."
  overview_zh: minWM Wan Action2V 是生数科技极简世界模型配方的 Wan2.1 同门：输入轨迹，经蒸馏 DMD 入口输出动作条件、相机可控的视频。WorldFoundry 运行专用的 Wan2.1 Action2V 路径，使用原生动作 token。
  architecture: Built on the official minWM source (apache-2.0). Only Wan21/Action2V/dmd/model.pt is required from the 384.97 GB upstream minWM repository.
  architecture_zh: 基于官方 minWM 源码（apache-2.0）。上游 384.97 GB 的 minWM 仓库中仅需 Wan21/Action2V/dmd/model.pt。
  usage_notes: Inputs are prompt and trajectory. Stage the single required model.pt before running; the HunyuanVideo sibling is minwm-hy-action2v.
  usage_notes_zh: 输入为提示词与轨迹。运行前请先就位唯一所需的 model.pt；HunyuanVideo 同门为 minwm-hy-action2v。
  limitations:
  - Prompt and trajectory input only; this route does not accept an input image.
  limitations_zh:
  - 仅支持提示词与轨迹输入；该路径不接受输入图像。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera/motion-trajectory adherence.
    reason_zh: 相机/运动轨迹贴合度。
