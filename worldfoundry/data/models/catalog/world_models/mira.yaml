docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'MIRA is a multiplayer interactive world model: several players act in one shared, action-conditioned generated world (paper arXiv 2607.05352). WorldFoundry runs inference only; it needs a compatible local checkpoint and a local Rocket Science dataset split containing index.json.'
  overview_zh: MIRA 是多人交互世界模型：多名玩家在同一个动作条件生成世界中行动（论文 arXiv 2607.05352）。WorldFoundry 仅支持推理，需要兼容的本地 checkpoint 与包含 index.json 的本地 Rocket Science 数据集切分。
  architecture: Per the paper, MIRA builds multiplayer interactive world models on representation autoencoders; the code is released under apache-2.0. The local-checkpoint variant runs the Rocket Science rollout task.
  architecture_zh: 按论文，MIRA 基于表征自编码器构建多人交互世界模型；代码以 apache-2.0 发布。local-checkpoint variant 运行 Rocket Science 滚动生成任务。
  usage_notes: The public Rocket Science dataset is about 29.24 TB and is never downloaded automatically; stage the split you need locally. Video decoding falls back to PyAV when TorchCodec is ABI-incompatible.
  usage_notes_zh: 公开的 Rocket Science 数据集约 29.24 TB，不会自动下载；请在本地就位所需切分。TorchCodec ABI 不兼容时视频解码回退到 PyAV。
  limitations:
  - 'Inference only: training and metric entrypoints are not included.'
  - The public dataset is ~29.24 TB — plan storage before staging.
  limitations_zh:
  - 仅支持推理：不包含训练与指标入口。
  - 公开数据集约 29.24 TB——就位前请规划存储。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Multiplayer world-rollout quality.
    reason_zh: 多人世界滚动生成质量。
