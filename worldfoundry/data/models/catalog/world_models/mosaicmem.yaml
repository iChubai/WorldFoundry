docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'MosaicMem is a memory-augmented world-model component: it ingests keyframe patches, retrieves target views, summarizes coverage, and composes latent canvases — producing a memory index rather than video. It is exposed through worldfoundry.core.memory.'
  overview_zh: MosaicMem 是记忆增强的世界模型组件：摄取关键帧 patch、检索目标视图、汇总覆盖度并组合潜空间画布——产物是记忆索引而非视频。它通过 worldfoundry.core.memory 暴露。
  architecture: The upstream source is MIT-licensed. The output artifact type is memory_index.
  architecture_zh: 上游源码为 MIT 许可。产物类型为 memory_index。
  usage_notes: Until the required checkpoints and assets are staged, generation returns a runtime plan that lists the missing assets. Use it as the memory side of a world-model stack, not as a standalone generator.
  usage_notes_zh: 在所需 checkpoint 与资产就位前，生成会返回列出缺失资产的运行时计划。请把它当作世界模型栈的记忆侧组件使用，而非独立生成器。
  limitations:
  - Produces memory indexes, not video artifacts.
  limitations_zh:
  - 产物是记忆索引，不是视频。
  recommended_benchmarks:
  - id: memobench
    reason: Long-horizon memory consistency evaluation.
    reason_zh: 长时程记忆一致性评测。
