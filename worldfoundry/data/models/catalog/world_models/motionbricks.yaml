docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: "MotionBricks is part of NVIDIA's GR00T-WholeBodyControl stack: it generates humanoid whole-body motion — the action side of embodied world modeling, emitting action traces rather than video (paper arXiv 2604.24833)."
  overview_zh: MotionBricks 属于英伟达 GR00T-WholeBodyControl 栈：生成人形机器人全身运动——具身世界建模的动作侧，产物是动作轨迹而非视频（论文 arXiv 2604.24833）。
  architecture: WorldFoundry runs the official Apache-2.0 MotionBricks source from the GR00T-WholeBodyControl repository at a pinned commit and returns an action_trace artifact.
  architecture_zh: WorldFoundry 以固定 commit 运行 GR00T-WholeBodyControl 仓库中 Apache-2.0 许可的官方 MotionBricks 源码，产物为 action_trace。
  usage_notes: Place the official source at ${WORLDFOUNDRY_MODEL_SOURCE_DIR}/GR00T-WholeBodyControl/motionbricks and stage the MotionBricks checkpoints and robot assets. Until they are staged, a run writes a runtime plan (motionbricks_runtime_plan.json) that lists the missing assets instead of generating motion.
  usage_notes_zh: 将官方源码放在 ${WORLDFOUNDRY_MODEL_SOURCE_DIR}/GR00T-WholeBodyControl/motionbricks，并准备 MotionBricks checkpoint 与机器人资产。资产就位前，运行只会写出列出缺失资产的运行时计划（motionbricks_runtime_plan.json），不会生成运动。
  limitations:
  - Emits action traces, not video artifacts.
  limitations_zh:
  - 产物是动作轨迹，不是视频。
