docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'MoVerse turns one image into a navigable world: it builds a panoramic Gaussian scaffold from the input and generates camera-controlled video as you move through it. Validated on an H100: the pipeline runs the complete 161-frame path.'
  overview_zh: MoVerse 把一张图变成可游走的世界：从输入构建全景高斯脚手架，并在移动过程中生成相机可控视频。已在 H100 上验证：pipeline 可跑通完整的 161 帧路径。
  architecture: Assembles GeoCalib AutoLevel, Depth Anything 3, SHARP panorama, Wan (Wan2.1-T2V-1.3B video base), and TAEHV components, plus FLUX.1-Fill-dev as the panorama base and MoVerse's own component weights.
  architecture_zh: 组合 GeoCalib AutoLevel、Depth Anything 3、SHARP 全景、Wan（视频基座 Wan2.1-T2V-1.3B）与 TAEHV 组件，另加作为全景基座的 FLUX.1-Fill-dev 与 MoVerse 自有组件权重。
  usage_notes: Execution is offline and needs four pre-staged Hugging Face snapshots (`Orange-3DV-Team/MoVerse`, `black-forest-labs/FLUX.1-Fill-dev`, `depth-anything/DA3NESTED-GIANT-LARGE-1.1`, `Wan-AI/Wan2.1-T2V-1.3B`) plus ffmpeg, gsplat, and compatible CUDA kernels.
  usage_notes_zh: 执行为离线模式，需要预先就位四个 Hugging Face snapshot（`Orange-3DV-Team/MoVerse`、`black-forest-labs/FLUX.1-Fill-dev`、`depth-anything/DA3NESTED-GIANT-LARGE-1.1`、`Wan-AI/Wan2.1-T2V-1.3B`），另加 ffmpeg、gsplat 与兼容的 CUDA 内核。
  limitations:
  - 'No upstream license file: legal review required.'
  - Needs gated FLUX access and ≥24 GB VRAM.
  - Outputs have not been compared against upstream artifacts, and camera accuracy is not calibrated.
  limitations_zh:
  - 上游无许可文件：需要法律审查。
  - 需要 gated FLUX 权限与 ≥24 GB 显存。
  - 输出尚未与上游产物对照，相机精度未经标定。
  recommended_benchmarks:
  - id: worldscore
    reason: Navigable generated-world quality.
    reason_zh: 可游走生成世界的质量。
  - id: camerabench
    reason: Camera-control adherence during navigation.
    reason_zh: 游走过程的相机控制贴合度。
