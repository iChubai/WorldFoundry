  notes:
  - The headless inference closure is integrated in-tree with local-only checkpoint resolution and shared WorldFoundry GeoCalib, DA3, SHARP, Wan, and TAEHV components.
  - Runtime planning and missing-asset diagnostics work without importing the heavyweight model stack.
runtime_profile: runtime-profile:moverse
