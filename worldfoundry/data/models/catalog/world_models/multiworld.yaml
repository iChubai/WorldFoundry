docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: "MultiWorld (\"It Takes Two\") is a multi-agent interactive video generator: two players' actions drive one shared generated game world. WorldFoundry runs the ItTakesTwo variant in-tree with local checkpoints."
  overview_zh: MultiWorld（「It Takes Two」）是多智能体交互视频生成器：两名玩家的动作驱动同一个共享生成游戏世界。WorldFoundry 在树内运行 ItTakesTwo 变体，使用本地权重。
  architecture: MultiWorld builds on Wan2.2-TI2V-5B (base model and VAE) with an action encoder and VGGT-1B as the environment encoder; the ItTakesTwo weights are Haoyuwu/MultiWorldCheckpoint.
  architecture_zh: MultiWorld 以 Wan2.2-TI2V-5B（基座与 VAE）为底座，配动作编码器，并以 VGGT-1B 作为环境编码器；ItTakesTwo 权重为 Haoyuwu/MultiWorldCheckpoint。
  usage_notes: 'Supply an initial image and two-player discrete and continuous action tensors (or an action CSV). Validated with the released toydata checkpoint: the pipeline generates 81 frames at 480x480 with 35 steps.'
  usage_notes_zh: 提供首帧图像和双玩家离散、连续动作张量（或动作 CSV）。已用发布的 toydata 权重验证：pipeline 以 35 步生成 480x480 的 81 帧视频。
  limitations:
  - The upstream license is custom; review it before redistribution.
  - Validation used synthetic actions and a non-game image; it does not establish game-domain action control or realistic world dynamics.
  limitations_zh:
  - 上游许可为自定义条款，再分发前请审查。
  - 验证使用合成动作和非游戏图像，不能证明游戏场景的动作控制能力或真实世界动态。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Multi-agent world-rollout quality.
    reason_zh: 多智能体世界滚动生成质量。
