id: omniforcing
name: OmniForcing
tasks:
- audio-visual-world-model
- real-time-generation
- distillation
output_artifacts:
- generated_video
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/OmniForcing/OmniForcing
  license: manual_review:missing_root_license
official_sources:
  paper: https://arxiv.org/abs/2603.11647
  github:
    url: https://github.com/OmniForcing/OmniForcing
    revision: cd6791433e3de4cbe156c125730d45a45d52fcae
    head_sha: cd6791433e3de4cbe156c125730d45a45d52fcae
runtime_profile: runtime-profile:omniforcing
integration:
  status: runtime_ported
  notes:
  - OmniForcing official source route is registered; checkpoints/runtime assets are
    runtime-gated.
runner_parity:
  status: implemented_checkpoint_pending
  notes:
  - resolve_model_zoo_config and pipeline import are expected to pass; real generation
    emits a runtime plan until required checkpoints/assets are staged.
catalog_category: world_models
catalog_scope: World-model catalog entries. Integrated entries expose in-tree WorldFoundry
  runtimes; blocked entries retain upstream provenance without runnable backends.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: omniforcing
docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'OmniForcing is a real-time audio-visual world model built with distillation: it targets joint audio-video generation at interactive speed. WorldFoundry binds the official source at a pinned commit; generation needs the checkpoints and runtime assets staged locally.'
  overview_zh: OmniForcing 是以蒸馏构建的实时音视频世界模型：目标是交互速度下的音视频联合生成。WorldFoundry 将官方源码绑定在固定 commit；生成前需在本地就位 checkpoint 与运行时资产。
  architecture: ''
  architecture_zh: ''
  usage_notes: Stage the required checkpoints and runtime assets first. Until they are in place, a run writes a runtime plan (`omniforcing_runtime_plan.json`) that lists the missing assets instead of generating video.
  usage_notes_zh: 先就位所需 checkpoint 与运行时资产。资产就位前，运行只写出列出缺失资产的运行时计划（`omniforcing_runtime_plan.json`），不会生成视频。
  limitations:
  - 'The upstream repository has no root license: legal review is required before use.'
  limitations_zh:
  - 上游仓库缺少根许可文件：使用前需要法律审查。
