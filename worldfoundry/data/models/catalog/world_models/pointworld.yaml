docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: "PointWorld is NVIDIA's point-cloud world model for robotics: instead of predicting pixels it predicts future 3D point-cloud states under actions, giving geometry-native world modeling."
  overview_zh: PointWorld 是英伟达面向机器人的点云世界模型：不预测像素，而是在动作条件下预测未来 3D 点云状态，实现几何原生的世界建模。
  architecture: Predicted point-cloud states are written as a generated_3d_asset artifact. The code is Apache-2.0; checkpoints are at nvidia/PointWorld_models.
  architecture_zh: 预测的点云状态以 generated_3d_asset 产物输出。代码采用 apache-2.0 许可；checkpoint 位于 nvidia/PointWorld_models。
  usage_notes: Stage the nvidia/PointWorld_models checkpoints and the point-cloud assets before running; until they are staged, a run returns a plan that lists the missing assets instead of generating. Inputs include point clouds alongside the usual prompt/image/video/actions.
  usage_notes_zh: 运行前需准备 nvidia/PointWorld_models checkpoint 与点云资产；在它们就位前，运行只会返回列出缺失资产的计划，而不会生成结果。输入除常规的提示词/图像/视频/动作外还包括点云。
  limitations:
  - Point-cloud outputs need downstream rendering for visual inspection.
  limitations_zh:
  - 点云输出需要下游渲染才能可视化检查。
  recommended_benchmarks:
  - id: ewmbench
    reason: Embodied world-model prediction quality.
    reason_zh: 具身世界模型预测质量。
