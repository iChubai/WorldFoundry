docs:
  publisher: Tencent (ARC Lab) / Nanyang Technological University
  publisher_kind: company
  publisher_zh: 腾讯（ARC Lab）/ 南洋理工大学
  overview: 'RollingForcing streams minutes-long video autoregressively: rolling-window denoising with an attention sink lets it generate long text-to-video without the drift that kills naive streaming (paper arXiv 2509.25161). Validated with the released checkpoint on A100: 126 latent frames decode to a 31.31-second H.264 video (501 frames at 832x480, 16 fps).'
  overview_zh: RollingForcing 自回归地流式生成数分钟长的视频：滚动窗口去噪加 attention sink，避免了朴素流式生成的漂移崩坏（论文 arXiv 2509.25161）。已在 A100 上用发布的 checkpoint 验证：126 个潜帧解码为 31.31 秒的 H.264 视频（501 帧，832x480，16 fps）。
  architecture: WorldFoundry runs it on a causal Wan backbone with an attention sink and KV cache, following the official five-step, three-latent-frame block configuration.
  architecture_zh: WorldFoundry 在带 attention sink 与 KV 缓存的因果 Wan 骨干上运行，遵循官方五步、三潜帧块配置。
  usage_notes: The released route is text-to-video only. BF16 support and enough GPU memory are required; the official 126 latent frames decode to a long 16 fps video, and smaller multiples of three give shorter test runs. Upstream terms allow academic use only.
  usage_notes_zh: 发布路径仅支持文生视频。需要支持 BF16 且显存充足的 GPU；官方 126 潜帧解码为 16 fps 长视频，更小的三的倍数可用于较短的测试运行。上游条款仅允许学术使用。
  limitations:
  - 'Academic-use-only license: all commercial and production use is prohibited.'
  - Text-to-video only in the released route.
  - Pixel-level parity with an upstream reference output is not established.
  limitations_zh:
  - 仅限学术使用的许可：禁止一切商用与生产用途。
  - 发布路径仅支持文生视频。
  - 与上游参考产物的像素级一致性未确立。
  recommended_benchmarks:
  - id: vbench
    reason: Video quality for long text-to-video output.
    reason_zh: 长文生视频输出的质量评测。
  - id: chronomagic-bench
    reason: Long-horizon temporal coherence.
    reason_zh: 长时程时间连贯性评测。
