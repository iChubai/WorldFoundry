docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'SCOPE is an interactive game world model over a Wan backbone: image plus per-step actions in, game-world video out (paper arXiv 2605.23345). Validated with the zizhaotong/SCOPE weights: the image-action-to-video demo runs end to end from the example image and an action parquet.'
  overview_zh: SCOPE 是基于 Wan 基座的交互式游戏世界模型：输入图像与逐步动作，输出游戏世界视频（论文 arXiv 2605.23345）。已用 zizhaotong/SCOPE 权重验证：图像+动作到视频的 demo 可基于示例图与动作 parquet 端到端运行。
  architecture: SCOPE adds action conditioning to the Wan network and uses the Wan encoders and VAE (apache-2.0).
  architecture_zh: SCOPE 在 Wan 网络上加入动作条件，并使用 Wan 编码器与 VAE（apache-2.0）。
  usage_notes: Pass execute=True to SCOPEPipeline to run generation; without it the pipeline stops immediately. Point model_dir/checkpoint_root or SCOPE_MODEL_DIR at the staged zizhaotong/SCOPE weights.
  usage_notes_zh: 向 SCOPEPipeline 传入 execute=True 才会执行生成；未传入时 pipeline 会立即停止。通过 model_dir/checkpoint_root 或 SCOPE_MODEL_DIR 指向本地的 zizhaotong/SCOPE 权重。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-conditioned game-world rollout quality.
    reason_zh: 动作条件游戏世界滚动生成质量。
