runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: shotstream
docs:
  publisher: Kuaishou (Kling Team)
  publisher_kind: company
  publisher_zh: 快手（可灵团队）
  overview: "ShotStream is Kling AI Research's real-time interactive streaming video generator: it targets continuous, interactively steered video streams rather than fixed clips. WorldFoundry runs the official 4-step causal generator from a user-staged source checkout at a pinned commit."
  overview_zh: ShotStream 是快手可灵研究团队的实时交互流式视频生成器：目标是连续、可交互操控的视频流，而非固定片段。WorldFoundry 从用户准备的固定 commit 官方源码运行其 4 步因果生成器。
  architecture: A 4-step causal video generator built on the Wan2.1-T2V-1.3B base model; weights are published at KlingTeam/ShotStream.
  architecture_zh: 基于 Wan2.1-T2V-1.3B 基座的 4 步因果视频生成器；权重发布于 KlingTeam/ShotStream。
  usage_notes: Stage the official ShotStream source checkout at the pinned revision under ${WORLDFOUNDRY_MODEL_SOURCE_DIR}/ShotStream, plus the KlingTeam/ShotStream checkpoint and Wan2.1-T2V-1.3B weights; until they are staged, a generation request returns a runtime plan listing the missing assets. A plain prompt becomes the official one-shot input; pass a full multi-shot CSV with data_path/input_csv.
  usage_notes_zh: 需在 ${WORLDFOUNDRY_MODEL_SOURCE_DIR}/ShotStream 准备固定 revision 的 ShotStream 官方源码，以及 KlingTeam/ShotStream checkpoint 与 Wan2.1-T2V-1.3B 权重；资产就位前，生成请求会返回列出缺失资产的运行时计划。普通 prompt 会转换为官方单镜头输入；完整多镜头 CSV 通过 data_path/input_csv 传入。
  limitations:
  - The upstream repository has no root license; review licensing before use.
  limitations_zh:
  - 上游仓库缺少根许可文件；使用前需审查许可。
