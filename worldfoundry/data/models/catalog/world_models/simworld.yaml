pipeline_binding: simworld
docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'SimWorld is a simulator-control model rather than a video generator: it drives multi-agent embodied simulation (policy rollouts, world state) through a simulator server and produces world_state artifacts.'
  overview_zh: SimWorld 是模拟器控制模型而非视频生成器：通过模拟器服务器驱动多智能体具身仿真（策略滚动、世界状态），产出 world_state 产物。
  architecture: A simulation platform interface, not a neural network.
  architecture_zh: 仿真平台接口，不是神经网络。
  usage_notes: A running simulator server is the key prerequisite. Until the required assets are staged, a run returns a runtime plan that lists what is missing.
  usage_notes_zh: 关键前置条件是一个运行中的模拟器服务器。在所需资产就位前，运行只返回列出缺失项的运行时计划。
  limitations:
  - Needs an external simulator server; no standalone generation.
  limitations_zh:
  - 需要外部模拟器服务器；无法独立生成。
