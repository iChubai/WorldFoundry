docs:
  publisher: New York University (VisionX)
  publisher_kind: university
  publisher_zh: 纽约大学（VisionX 实验室）
  overview: 'Solaris is a multi-agent interactive video world model from NYU''s VisionX group (paper arXiv 2602.22208):
    multiple agents act inside one generated world. WorldFoundry runs the in-tree inference runtime with the official
    Orbax checkpoint (nyu-visionx/solaris) and the official eval datasets, loaded from Hugging Face or a local mirror.'
  overview_zh: Solaris 是纽约大学 VisionX 组的多智能体交互视频世界模型（论文 arXiv 2602.22208）：多个智能体在同一个生成世界中行动。WorldFoundry 使用官方 Orbax
    checkpoint（nyu-visionx/solaris）与官方评估数据集运行树内推理代码，二者从 Hugging Face 或本地镜像加载。
  architecture: The runtime is JAX-based and loads the official Orbax checkpoint.
  architecture_zh: 运行时基于 JAX，加载官方 Orbax checkpoint。
  usage_notes: Inference uses the installed Solaris package module. runtime_root anchors relative asset paths and
    the working directory. Inference launches one sample per visible GPU — eval_num_samples must be a multiple of
    the visible GPU count. Official weights and eval datasets resolve from HF or a same-layout local mirror.
  usage_notes_zh: 推理由已安装的 Solaris 包模块执行。runtime_root 是相对资产路径与工作目录的基准。推理按每张可见 GPU 启动一个样本——eval_num_samples 必须是可见
    GPU 数的整数倍。官方权重与评估数据集从 HF 或同布局本地镜像解析。
  limitations:
  - Review the upstream license before use.
  - eval_num_samples must match the GPU-count multiple constraint.
  limitations_zh:
  - 使用前请审查上游许可。
  - eval_num_samples 须满足 GPU 数整数倍约束。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Multi-agent world-rollout quality.
    reason_zh: 多智能体世界滚动生成质量。
