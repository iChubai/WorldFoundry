docs:
  publisher: Junchao-cs
  publisher_kind: lab
  publisher_zh: Junchao-cs
  overview: SolarWM provides dataset-indexed camera-controlled inference across Wan
    5B/14B, LTX-2.5 and MiniMax-H3 releases.
  overview_zh: SolarWM 支持从数据索引读取相机轨迹，在 Wan 5B/14B、LTX-2.5 和 MiniMax-H3 路线上执行推理。
  architecture: A single WorldFoundry launcher runs the released solarwm infer route
    in its dedicated backend environment. The solarwm package (Junchao-cs/SolarWM at
    2fe1ea9a) and the LTX-2 v1.2.0 packages used by its LTX-2.5 backend are vendored;
    only the infer action is exposed.
  architecture_zh: WorldFoundry 统一启动官方 solarwm infer 路线，在对应独立环境中运行。solarwm 包（Junchao-cs/SolarWM，2fe1ea9a）及其
    LTX-2.5 后端使用的 LTX-2 v1.2.0 包已 vendor 进仓库；仅开放 infer 动作。
  usage_notes: Default variant=wan-5b-dmd. Provide checkpoint_dir, base_path and data_root.
    Prompts, images and camera tracks come from the indexed samples. Use a separate
    interpreter for Wan, LTX and H3; route process counts follow the official configs.
  usage_notes_zh: 默认 variant=wan-5b-dmd，需提供 checkpoint_dir、base_path 和 data_root。提示词、图像和相机轨迹来自索引样本。Wan、LTX、H3
    使用独立解释器，进程数遵循官方推理配置。
  limitations:
  - Only the infer action is exposed. Training, preencoding and data-engine commands
    are excluded.
  - Code is Apache-2.0; LTX and H3 base/adapter weights retain their respective community
    licenses and restrictions.
  - Checkpoint-backed GPU generation is pending.
  limitations_zh:
  - 当前工作区仅完成 CPU 可执行的检查，GPU 推理和 checkpoint 产物仍待验证。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Long-horizon camera-controlled world consistency.
    reason_zh: 长时程相机控制下的世界一致性。
