docs:
  publisher: SolarWM authors
  publisher_kind: lab
  publisher_zh: SolarWM 作者团队
  overview: SolarWM is an open data and scalable training foundation for camera-controlled, long-horizon video world models. It supports Wan2.2 5B/14B, LTX-2.5 22B, and MiniMax-H3 33B backbones; the 5B line releases the full bidirectional FM, TF-AnyFlow, and SGF progression.
  overview_zh: SolarWM 是面向相机控制、长时程视频世界模型的开放数据与可扩展训练基础设施，覆盖 Wan2.2 5B/14B、LTX-2.5 22B 与 MiniMax-H3 33B；其中 5B 路线完整发布了双向 FM、TF-AnyFlow 与 SGF 三阶段流程。
  architecture: The complete 5B route adapts Wan2.2 through Stage0.5 bidirectional flow matching, Stage1 teacher-forced AnyFlow, and Stage2 distribution matching via self-gradient forcing. The final causal model performs four-step autoregressive camera-conditioned rollout from short training clips.
  architecture_zh: 完整 5B 路线以 Wan2.2 为基座，依次进行 Stage0.5 双向流匹配、Stage1 teacher-forced AnyFlow，以及 Stage2 基于 self-gradient forcing 的分布匹配；最终因果模型以四步自回归方式执行相机条件滚动生成。
  usage_notes: Stage the pinned SolarWM checkout, accept the gated Hugging Face repositories, download the Wan2.2-5B bundle and SolarWM-Data, then set source/base/checkpoint/data paths if they differ from WorldFoundry defaults. Inference consumes SolarWM dataset rows and camera trajectories; it is not a prompt-only T2V route.
  usage_notes_zh: 请先就位锁定版本的 SolarWM checkout，接受 Hugging Face gated 仓库条款并下载 Wan2.2-5B 权重包与 SolarWM-Data；若目录不同于 WorldFoundry 默认值，再显式设置源码、基座、checkpoint 与数据路径。推理消费 SolarWM 数据行和相机轨迹，并非纯 prompt 文生视频接口。
  limitations:
  - The default route requires a CUDA 12.4 environment, the gated Wan2.2-5B assets, and the released dataset indexes/raw shards.
  - Checkpoint-backed GPU parity is pending in WorldFoundry.
  - LTX-2.5 and MiniMax-H3 derivatives carry backbone-specific licenses and are metadata-only variants in this integration.
  limitations_zh:
  - 默认路线需要 CUDA 12.4 环境、受限访问的 Wan2.2-5B 资产，以及已发布的数据索引和原始分片。
  - WorldFoundry 尚未完成基于真实 checkpoint 的 GPU 一致性验证。
  - LTX-2.5 与 MiniMax-H3 衍生权重受各自基座许可约束，在本次集成中仅登记元数据。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Long-horizon camera-controlled world consistency.
    reason_zh: 长时程相机控制下的世界一致性。
