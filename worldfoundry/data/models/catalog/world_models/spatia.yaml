catalog_category: world_models
docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'Spatia is a camera-controlled video-to-video world model: given source video and a target camera trajectory it re-renders the scene along the new viewpoint path. WorldFoundry ships the official source and loads the Jinjing713/Spatia checkpoint, released under Apache-2.0.'
  overview_zh: Spatia 是相机控制的 video-to-video 世界模型：给定源视频与目标相机轨迹，沿新视角路径重新渲染场景。WorldFoundry 自带官方源码，加载以 Apache-2.0 许可发布的 Jinjing713/Spatia checkpoint。
  architecture: Spatia builds on Wan2.2-TI2V-5B and uses MapAnything to reconstruct the source scene. A dense world-to-camera (W2C) trajectory supplies per-frame camera extrinsics that drive the re-rendering.
  architecture_zh: Spatia 基于 Wan2.2-TI2V-5B，并用 MapAnything 重建源场景。稠密 world-to-camera（W2C）轨迹提供逐帧相机外参，驱动重渲染。
  usage_notes: 'Provide a source image or video, camera intrinsics, and a dense per-frame W2C camera trajectory. Optional mask_path passes one foreground mask matching the original source-frame size to reconstruction; set force_rebuild_intermediate when changing cached inputs. Validated with the released checkpoint: an image-input run generates 17 frames at 832x480 with 40 steps.'
  usage_notes_zh: 提供源图像或视频、相机内参及逐帧稠密 W2C 相机轨迹。可选 mask_path 将一张与原始源帧尺寸一致的前景掩码传入重建阶段；改变缓存输入时设置 force_rebuild_intermediate。已用发布的 checkpoint 验证：图像输入运行以 40 步生成 832x480 的 17 帧视频。
  limitations:
  - Official PyTorch3D renderer parity and camera-control accuracy are not verified.
  - Requires dense per-frame camera trajectories, not sparse keyframe poses.
  - The default MapAnything checkpoint has a non-commercial license.
  limitations_zh:
  - 官方 PyTorch3D 渲染器一致性及相机控制精度尚未验证。
  - 需要逐帧稠密相机轨迹，而非稀疏关键帧位姿。
  - 默认 MapAnything 权重使用非商业许可。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-trajectory adherence for controlled re-rendering.
    reason_zh: 相机轨迹跟随与受控重渲染质量。
