docs:
  publisher: University of Massachusetts Amherst (Embodied AGI Lab)
  publisher_kind: university
  publisher_zh: 马萨诸塞大学阿默斯特分校（Embodied AGI 实验室）
  overview: 'TesserAct is an embodied 4D world model for robotics: it predicts action-conditioned video of manipulation scenes with temporally consistent geometry. It is one of the WorldArena open-source world models; weights are published as anyeZHY/tesseract on Hugging Face.'
  overview_zh: TesserAct 是面向机器人的具身 4D 世界模型：预测操作场景的动作条件视频，并保持时序一致的几何。它是 WorldArena 收录的开源世界模型之一；权重发布在 Hugging Face 的 anyeZHY/tesseract。
  architecture: The pipeline runs the official RGB-depth-normal SFT transformer (anyeZHY/tesseract) on a local CogVideoX-5b-I2V base model through the official inference entrypoint.
  architecture_zh: pipeline 通过官方推理入口，在本地 CogVideoX-5b-I2V 基座上运行官方 RGB-深度-法线 SFT transformer（anyeZHY/tesseract）。
  usage_notes: Stage anyeZHY/tesseract, THUDM/CogVideoX-5b-I2V, and the embodied task assets locally; until they are staged, the pipeline returns diagnostics that list what is missing.
  usage_notes_zh: 先在本地准备 anyeZHY/tesseract、THUDM/CogVideoX-5b-I2V 与具身任务资产；在它们就位前，pipeline 只返回列出缺失项的诊断信息。
  limitations:
  - The built-in synthetic-gradient depth/normal mode is only a demo path; supply official depth/normal conditioning files for meaningful output.
  limitations_zh:
  - 内置的合成梯度深度/法线模式只是 demo 路径；需要有意义的输出时请提供官方深度/法线条件文件。
  recommended_benchmarks:
  - id: ewmbench
    reason: Embodied manipulation world-model quality.
    reason_zh: 具身操作世界模型质量。
  - id: worldarena
    reason: Listed among WorldArena open-source world models.
    reason_zh: WorldArena 开源世界模型榜单收录。
