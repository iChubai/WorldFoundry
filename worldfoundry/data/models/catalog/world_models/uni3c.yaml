integration:
  kind: pipeline_runner
  status: runtime_ported
  notes:
  - The official camera-only and unified camera-plus-human stage-two inference paths are vendored in-tree.
  - Pre-rendered control bundles stay explicit runtime inputs; preprocessing is not silently substituted.
runtime_profile: runtime-profile:uni3c
pipeline_binding: uni3c
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
runner_parity:
  status: checkpoint_gpu_validated
  notes:
  - Static compilation, route resolution, local asset wiring, and offline command planning are covered locally.
  - The default PCDController camera route completed real H100 Workspace inference with the official Uni3C controller and Wan2.1-I2V-14B checkpoints.
  - A full 81-frame H.264 camera run at 688x512 and 16 FPS decoded completely using a real toy photograph and a verified 15-degree input-control trajectory. The generated view moved smoothly; output angle was not calibrated.
  - Input point-cloud controls used WorldFoundry's Torch renderer because the installed PyTorch3D extension was incompatible; official DepthPro, Tracer, camera construction, and Uni3C stage-two inference were used.
  - The unified camera-plus-human route remains outside this checkpoint-backed validation claim.
output_artifacts:
- generated_video
catalog_category: world_models
catalog_scope: World-model catalog entries with in-tree inference runtimes.
docs:
  publisher: Alibaba DAMO Academy
  publisher_kind: company
  publisher_zh: 阿里巴巴达摩院
  overview: 'Uni3C from Alibaba DAMO Academy unifies camera control and human-motion control for image-to-video generation: the PCDController stage steers the camera while the unified stage combines camera plus human motion (RealisDance-DiT). WorldFoundry runs both official stage-two inference paths with public Apache-2.0 checkpoints (ewrfcas/Uni3C, theFoxofSky/RealisDance-DiT) on top of the Wan2.1-I2V-14B-720P base.'
  overview_zh: 阿里巴巴达摩院的 Uni3C 将相机控制与人体动作控制统一到图生视频中：PCDController 阶段负责相机操控，统一阶段结合相机与人体动作（RealisDance-DiT）。WorldFoundry 运行两条官方第二阶段推理路径，使用公开的 Apache-2.0 checkpoint（ewrfcas/Uni3C、theFoxofSky/RealisDance-DiT），构建在 Wan2.1-I2V-14B-720P 基座之上。
  architecture: 'Three checkpoints are used: ewrfcas/Uni3C as the PCDController, Wan-AI/Wan2.1-I2V-14B-720P-Diffusers as the camera base, and theFoxofSky/RealisDance-DiT as the unified camera-plus-human model. Pre-rendered control bundles are explicit runtime inputs.'
  architecture_zh: 使用三个 checkpoint：ewrfcas/Uni3C 为 PCDController，Wan-AI/Wan2.1-I2V-14B-720P-Diffusers 为相机基座，theFoxofSky/RealisDance-DiT 为相机+人体统一模型。预渲染控制包作为显式运行时输入。
  usage_notes: 'Choose the camera-only or unified camera-plus-human route and provide the matching pre-rendered control bundle. Validated on an H100 with the released checkpoints: the default PCDController camera route runs end to end.'
  usage_notes_zh: 按需选择仅相机或相机+人体统一路线，并提供匹配的预渲染控制包。已在 H100 上用官方 checkpoint 验证：默认 PCDController 相机路线可端到端运行。
  limitations:
  - GPU validation covers only the default PCDController camera route; the unified camera-plus-human route is not validated.
  - Control bundles must be pre-rendered; the pipeline does not generate them.
  limitations_zh:
  - GPU 验证仅覆盖默认 PCDController 相机路线，相机+人体统一路线尚未验证。
  - 控制包需预先渲染；pipeline 不代为生成。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-trajectory adherence under explicit control.
    reason_zh: 显式控制下的相机轨迹跟随。
