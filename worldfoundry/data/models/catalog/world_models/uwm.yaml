docs:
  publisher: University of Washington (WEIRD Lab)
  publisher_kind: university
  publisher_zh: 华盛顿大学（WEIRD 实验室）
  overview: Unified World Models (UWM) from the University of Washington's WEIRD Lab couples video prediction and action diffusion in one robot world model, with variants for LIBERO-90 (uwm-libero90) and DROID (uwm-droid). WorldFoundry runs the official evaluation route; checkpoints and datasets must be staged before generation.
  overview_zh: 华盛顿大学 WEIRD 实验室的 Unified World Models（UWM）将视频预测与动作扩散耦合进同一个机器人世界模型，提供 LIBERO-90（uwm-libero90）与 DROID（uwm-droid）两个变体。WorldFoundry 运行官方评测路由；生成前需就位 checkpoint 与数据集。
  architecture: 'UWM is a video-action diffusion design: one diffusion process jointly models future observations and robot actions, so the same network serves prediction and policy roles.'
  architecture_zh: UWM 是视频-动作扩散设计：单个扩散过程联合建模未来观测与机器人动作，同一网络兼任预测与策略角色。
  usage_notes: Pick the LIBERO-90 or DROID variant to match your evaluation suite. Until the required checkpoints and assets are staged, a run outputs a runtime plan that lists the missing assets instead of generating.
  usage_notes_zh: 请按评测套件选择 LIBERO-90 或 DROID 变体。所需 checkpoint 与资产就位前，运行只会输出列出缺失资产的运行时计划，而不会生成结果。
  limitations:
  - Checkpoints and datasets are not bundled and must be staged before running.
  limitations_zh:
  - checkpoint 与数据集不随附，运行前需自行就位。
  recommended_benchmarks:
  - id: libero
    reason: The uwm-libero90 variant targets LIBERO tasks.
    reason_zh: uwm-libero90 变体面向 LIBERO 任务。
  - id: ewmbench
    reason: Robot world-model rollout quality.
    reason_zh: 机器人世界模型滚动生成质量。
