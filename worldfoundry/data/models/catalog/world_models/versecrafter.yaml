provider: Tencent ARC
source:
  status: open_source
  official_repo_url: https://github.com/TencentARC/VerseCrafter
  license: research-only-non-commercial-not-eu
checkpoint: TencentARC/VerseCrafter
runtime_profile: runtime-profile:versecrafter
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: versecrafter
official_sources:
  project_page: https://sixiaozheng.github.io/VerseCrafter_page/
  paper: https://arxiv.org/abs/2601.05138
integration:
  status: integrated
  notes:
  - Official source is vendored at revision 008693b52aa74367afb34d183046fecf88100bdc.
  - The exact VideoX-Fun submodule is vendored at revision 246a0e3a22485b1f48647583f764c7fe16caa93b.
  - Upstream license is research-only, non-commercial, and excludes intended EU use.
runner_parity:
  status: verified_inference_only
  notes:
  - The public pipeline generated 17 decodable 832x480 frames at 30 steps with local
    VerseCrafter, Wan2.1-14B, and MoGe-v2 weights after the default camera-basis fix.
  - Late disocclusion artifacts remain visible; precise camera-path adherence and
    official output parity have not been measured.
catalog_category: world_models
docs:
  publisher: Tencent ARC Lab
  publisher_kind: company
  publisher_zh: 腾讯 ARC 实验室
  overview: 'VerseCrafter from Tencent ARC is a camera-controlled image-to-video world model built on 4D control: a geometry-aware rendering stage produces 4D control signals that guide the diffusion stage along the requested camera path. It runs with the TencentARC/VerseCrafter checkpoint plus Wan-AI/Wan2.1-T2V-14B and Ruicheng/moge-2-vitl-normal.'
  overview_zh: 腾讯 ARC 的 VerseCrafter 是基于 4D 控制的相机可控图生视频世界模型：几何感知渲染阶段产出 4D 控制信号，引导扩散阶段沿指定相机路径生成。运行需要 TencentARC/VerseCrafter checkpoint，以及 Wan-AI/Wan2.1-T2V-14B 与 Ruicheng/moge-2-vitl-normal。
  architecture: 'Two stages: camera-only 4D-control rendering, followed by a diffusion stage whose backbone comes from VideoX-Fun.'
  architecture_zh: 两个阶段：仅相机的 4D 控制渲染，随后是扩散阶段，其扩散骨干来自 VideoX-Fun。
  usage_notes: 'Validated with the released checkpoint: a short camera-controlled video generates end to end, with visible artifacts in late frames.'
  usage_notes_zh: 已用发布权重验证：可端到端生成相机可控短视频，后段帧有可见伪影。
  limitations:
  - Research-only, non-commercial license that excludes intended EU use.
  - The short GPU run has late-frame disocclusion artifacts; camera-path accuracy and official output parity remain unmeasured.
  limitations_zh:
  - 仅研究、非商用许可，且排除面向欧盟的使用。
  - 短片 GPU 运行后段存在遮挡解除伪影；相机路径精度和官方输出一致性尚未测量。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-path adherence for 4D-controlled generation.
    reason_zh: 4D 控制生成的相机路径跟随。
