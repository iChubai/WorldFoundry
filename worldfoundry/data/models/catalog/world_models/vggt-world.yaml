id: vggt-world
name: VGGT-World
tasks:
- world-model
- 3d-scene-understanding
- video-generation
output_artifacts:
- generated_world
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/SimonSun0810/VGGT-World
  license: manual_review:missing_root_license
official_sources:
  paper: https://arxiv.org/pdf/2603.12655
  github:
    url: https://github.com/SimonSun0810/VGGT-World
    revision: c90f5ee289036277fe75a69aa96418c04ccd5cc7
    head_sha: c90f5ee289036277fe75a69aa96418c04ccd5cc7
runtime_profile: runtime-profile:vggt-world
integration:
  status: runtime_ported
  notes:
  - VGGT-World official source route is registered; checkpoints/assets are runtime-gated.
runner_parity:
  status: implemented_checkpoint_pending
  notes:
  - resolve_model_zoo_config and pipeline import are expected to pass; real generation
    emits a runtime plan until required checkpoints/assets are staged.
catalog_category: world_models
catalog_scope: World-model catalog entries. Integrated entries expose in-tree WorldFoundry
  runtimes; blocked entries retain upstream provenance without runnable backends.
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: vggt-world
docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'VGGT-World builds a world model on top of VGGT-style 3D scene understanding: it couples geometry-grounded scene perception with video generation so rollouts stay consistent with the underlying 3D structure. WorldFoundry binds the official source (paper: arXiv 2603.12655); generation needs the checkpoints and assets staged locally.'
  overview_zh: VGGT-World 在 VGGT 式 3D 场景理解之上构建世界模型：将几何锚定的场景感知与视频生成耦合，使滚动生成与底层 3D 结构保持一致。WorldFoundry 接入官方源码（论文：arXiv 2603.12655）；生成前需在本地就位 checkpoint 与资产。
  architecture: Per the paper (arXiv 2603.12655), VGGT is turned into an autoregressive geometry world model.
  architecture_zh: 按论文（arXiv 2603.12655），VGGT 被改造为自回归几何世界模型。
  usage_notes: Stage the required checkpoints and assets first. Until they are in place, a run writes `vggt_world_runtime_plan.json` listing the missing assets instead of generating a world.
  usage_notes_zh: 先就位所需 checkpoint 与资产。资产就位前，运行只写出列出缺失资产的 `vggt_world_runtime_plan.json`，不会生成世界。
  limitations:
  - 'The upstream repository has no root license: legal review is required before use.'
  limitations_zh:
  - 上游仓库缺少根许可文件：使用前需要法律审查。
  recommended_benchmarks:
  - id: worldscore
    reason: Unified world-generation quality across 3D-grounded rollouts.
    reason_zh: 3D 锚定滚动生成的统一世界生成质量。
