docs:
  publisher: Tsinghua University (THUML)
  publisher_kind: university
  publisher_zh: 清华大学（THUML 机器学习组）
  overview: "Vid2World from Tsinghua's THUML group turns pretrained video diffusion models into interactive world models: it adapts a passive video generator into an action-conditioned, autoregressive predictor. WorldFoundry runs the official evaluation route."
  overview_zh: 清华大学 THUML 组的 Vid2World 将预训练视频扩散模型改造为交互式世界模型：把被动的视频生成器适配成动作条件的自回归预测器。WorldFoundry 运行官方评测路由。
  architecture: 'The core idea is video-diffusion adaptation: converting a full-sequence diffusion model into a causal, action-conditioned rollout. Official code: thuml/Vid2World.'
  architecture_zh: 核心思想是视频扩散适配：把全序列扩散模型改造成因果、动作条件的滚动生成。官方代码：thuml/Vid2World。
  usage_notes: Until the required checkpoints and config assets are staged, generation returns a runtime plan that lists the missing assets.
  usage_notes_zh: 在所需 checkpoint 与配置资产就位前，生成会返回列出缺失资产的运行时计划。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-conditioned interactive rollout quality.
    reason_zh: 动作条件交互滚动生成质量。
