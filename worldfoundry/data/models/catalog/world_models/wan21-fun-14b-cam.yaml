  publisher_zh: 阿里云 PAI（VideoX-Fun）
  overview: "Wan2.1-Fun V1.1 14B Control Camera is Alibaba PAI's largest Wan2.1-generation camera-control checkpoint in the VideoX-Fun family: image-to-video generation steered by explicit camera pose sequences. WorldFoundry bundles VideoX-Fun (revision 403f1f7b) and runs the alibaba-pai/Wan2.1-Fun-V1.1-14B-Control-Camera checkpoint, released under Apache-2.0."
  overview_zh: Wan2.1-Fun V1.1 14B Control Camera 是阿里云 PAI 在 VideoX-Fun 家族中 Wan2.1 世代最大的相机控制 checkpoint：由显式相机位姿序列操控的图生视频。WorldFoundry 内置 VideoX-Fun（revision 403f1f7b），运行 alibaba-pai/Wan2.1-Fun-V1.1-14B-Control-Camera checkpoint，Apache-2.0 许可。
  architecture: 'A 14B-parameter Wan2.1 diffusion transformer with the VideoX-Fun Control-Camera conditioning pathway: camera extrinsics are injected as control signals alongside the image condition.'
  architecture_zh: 14B 参数的 Wan2.1 扩散 Transformer，叠加 VideoX-Fun Control-Camera 条件通路：相机外参作为控制信号与图像条件一同注入。
  usage_notes: Camera pose sequences must be supplied explicitly. The sibling wan21-fun-1p3b-cam runs the same route at 1.3B scale and is GPU-validated; use it as a reference.
  usage_notes_zh: 相机位姿序列需显式提供。同路由的 1.3B 版本（wan21-fun-1p3b-cam）已通过 GPU 验证，可作参照。
  limitations:
  - The 14B checkpoint has not yet been validated on GPU.
  - 14B scale implies materially higher VRAM needs than the 1.3B variant.
  limitations_zh:
  - 14B checkpoint 尚未在 GPU 上验证。
  - 14B 规模意味着显存需求远高于 1.3B 变体。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-pose adherence for controlled i2v generation.
    reason_zh: 受控图生视频的相机位姿跟随。
