docs:
  publisher: Alibaba PAI (VideoX-Fun)
  publisher_kind: company
  publisher_zh: 阿里云 PAI（VideoX-Fun）
  overview: 'Wan2.1-Fun V1.1 1.3B Control Camera is the 1.3B camera-control model of the VideoX-Fun family: it generates video from an image along explicit camera poses. Validated with the released checkpoint: the official pose-conditioned route generates nine coherent H.264 frames at 672x384 after four denoising steps.'
  overview_zh: Wan2.1-Fun V1.1 1.3B Control Camera 是 VideoX-Fun 家族的 1.3B 相机控制模型：按显式相机位姿从图像生成视频。已用发布的 checkpoint 验证：官方位姿条件路由经四步去噪生成 672x384 的九帧连贯 H.264 视频。
  architecture: A 1.3B-parameter Wan2.1 diffusion transformer with the VideoX-Fun Control+i2v camera conditioning pathway.
  architecture_zh: 1.3B 参数的 Wan2.1 扩散 Transformer，叠加 VideoX-Fun Control+i2v 相机条件通路。
  usage_notes: 'This is the recommended starting point for VideoX-Fun camera control: smallest footprint and the only VideoX-Fun camera variant validated on GPU. Supply explicit camera pose sequences; scale up to the 14B/Wan2.2 variants once your pipeline works here.'
  usage_notes_zh: 这是 VideoX-Fun 相机控制的推荐起点：占用最小，且是 VideoX-Fun 相机变体中唯一已在 GPU 上验证的。需显式提供相机位姿序列；流程跑通后再升级到 14B/Wan2.2 变体。
  limitations:
  - 1.3B scale trades visual fidelity for speed relative to the 14B/A14B variants.
  limitations_zh:
  - 相对 14B/A14B 变体，1.3B 规模以画质换速度。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-pose adherence for controlled i2v generation.
    reason_zh: 受控图生视频的相机位姿跟随。
