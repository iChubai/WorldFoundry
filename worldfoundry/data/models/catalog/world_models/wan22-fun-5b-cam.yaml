  publisher_zh: 阿里云 PAI（VideoX-Fun）
  overview: 'Wan2.2-Fun 5B Control Camera brings the VideoX-Fun camera-control pathway to the Wan2.2 generation at 5B scale: image-to-video steered by explicit camera poses, with an upstream native profile of 121 frames at 24 FPS. Weights: alibaba-pai/Wan2.2-Fun-5B-Control-Camera (Apache-2.0).'
  overview_zh: Wan2.2-Fun 5B Control Camera 将 VideoX-Fun 相机控制通路带入 Wan2.2 世代的 5B 规模：由显式相机位姿操控的图生视频，上游原生规格为 121 帧、24 FPS。权重：alibaba-pai/Wan2.2-Fun-5B-Control-Camera（Apache-2.0）。
  architecture: A 5B-parameter Wan2.2 diffusion transformer with the VideoX-Fun Control-Camera conditioning pathway.
  architecture_zh: 5B 参数的 Wan2.2 扩散 Transformer，叠加 VideoX-Fun Control-Camera 条件通路。
  usage_notes: The upstream native profile is 121 frames at 24 FPS; WRBench requests pass explicit values, so set frame count and FPS deliberately rather than relying on defaults.
  usage_notes_zh: 上游原生规格为 121 帧、24 FPS；WRBench 请求会显式传值，请主动设置帧数与 FPS，而非依赖默认值。
  limitations:
  - Not yet validated on GPU; wan21-fun-1p3b-cam is the GPU-validated camera-control model in this family.
  limitations_zh:
  - 尚未经过 GPU 验证；本家族中已通过 GPU 验证的相机控制模型是 wan21-fun-1p3b-cam。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-pose adherence for controlled i2v generation.
    reason_zh: 受控图生视频的相机位姿跟随。
  - id: wrbench
    reason: Native 121-frame/24FPS profile suits WRBench-style requests.
    reason_zh: 原生 121 帧/24FPS 规格适配 WRBench 式请求。
