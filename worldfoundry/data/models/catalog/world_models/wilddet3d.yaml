docs:
  publisher: Allen Institute for AI (AI2)
  publisher_kind: lab
  publisher_zh: 艾伦人工智能研究所（AI2）
  overview: WildDet3D from the Allen Institute for AI recovers 3D object boxes from unconstrained RGB imagery. WorldFoundry runs the pinned official detector and writes its detections and depth map to a NumPy archive.
  overview_zh: 艾伦人工智能研究所（AI2）的 WildDet3D 从真实 RGB 图像中恢复物体的三维框。WorldFoundry 运行固定版本的官方检测器，将检测框和深度图保存为 NumPy 文件。
  architecture: The official model combines SAM3 image features and LingBot-Depth geometry; upstream source and submodules are loaded from a pinned external checkout.
  architecture_zh: 官方模型结合 SAM3 图像特征与 LingBot-Depth 几何信息；源码和子模块从仓库外的固定版本检出加载。
  usage_notes: 'Provide image_path and comma-separated classes in the prompt; optionally provide intrinsics_path for a finite 3x3 .npy matrix. Stage the full allenai/WildDet3D checkpoint, robbyant/lingbot-depth-postrain-dc-vitl14/model.pt, and pinned official checkout with submodules. The upstream source uses the SAM License.'
  usage_notes_zh: '传入 image_path，并用英文逗号分隔 prompt 中的检测类别；可选传入 3x3 的 intrinsics_path（.npy）。需要完整的 allenai/WildDet3D checkpoint、robbyant/lingbot-depth-postrain-dc-vitl14/model.pt，以及含子模块的官方固定版本源码。上游源码使用 SAM License。'
  limitations:
  - 'Perception-only: no video or world generation output.'
  - The upstream source uses the SAM License; review it before commercial use.
  limitations_zh:
  - 仅感知：不产出视频或世界生成结果。
  - 上游源码使用 SAM License；商用前请审查。
