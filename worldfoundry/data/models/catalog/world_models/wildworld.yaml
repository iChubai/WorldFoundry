  overview: 'WildWorld is a benchmark and dataset rather than a generative model: it evaluates world models on in-the-wild footage and produces evaluation reports. WorldFoundry runs the official source (ShandaAI/WildWorld); stage the benchmark and dataset assets before running.'
  overview_zh: WildWorld 是基准与数据集，而非生成模型：在野外真实素材上评测世界模型并产出评测报告。WorldFoundry 运行官方源码（ShandaAI/WildWorld）；运行前请就位基准与数据集资产。
  architecture: As an evaluation pipeline its output artifact is an evaluation_report.
  architecture_zh: 作为评测 pipeline，其输出产物为 evaluation_report。
  usage_notes: Until the required checkpoints and assets are staged, a run emits a runtime plan that lists the missing assets instead of evaluating.
  usage_notes_zh: 在所需 checkpoint 与资产就位前，运行会输出运行时计划并列出缺失资产，而不执行评测。
  limitations:
