docs:
  publisher: KAIST / Adobe Research / MAUM AI
  publisher_kind: university
  publisher_zh: KAIST（韩国科学技术院）/ Adobe Research / MAUM AI
  overview: WorldCam, from KAIST's CV Lab with Adobe Research and MAUM AI, is an interactive world model with camera-pose control for long-horizon game video. WorldFoundry runs the official-style conditioning-video demo in the unified environment, and load_model=False plans a run without loading weights.
  overview_zh: WorldCam 由 KAIST CV Lab 联合 Adobe Research 与 MAUM AI 发布，是支持相机位姿控制的交互式世界模型，面向长时程游戏视频。WorldFoundry 在统一环境中运行官方风格的条件视频 demo；load_model=False 可在不加载权重时规划一次运行。
  architecture: The runner follows the official conditioning-video path and consumes WorldCam and Wan assets, indicating a Wan-based diffusion backbone with camera-pose conditioning.
  architecture_zh: runner 遵循官方条件视频路径，使用 WorldCam 与 Wan 资产，表明其为基于 Wan 的扩散骨干加相机位姿条件。
  usage_notes: The release is code-only, so stage the WorldCam and Wan2.1-T2V-1.3B assets locally yourself; the wrapper's load_model=False mode lets you check planning without weights.
  usage_notes_zh: 该发布为 code-only，需自行在本地就位 WorldCam 与 Wan2.1-T2V-1.3B 资产；wrapper 的 load_model=False 模式可在无权重时检查规划。
  limitations:
  - 'Code-only release: official checkpoints are not confirmed.'
  limitations_zh:
  - code-only 发布：官方 checkpoint 尚未确认。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-pose-controlled rollout adherence.
    reason_zh: 相机位姿控制的滚动生成跟随度。
  - id: worldmodelbench
    reason: Long-horizon interactive world quality.
    reason_zh: 长时程交互世界质量。
