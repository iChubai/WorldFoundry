docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'WorldGrow generates worlds by expansion: starting from a seed scene it progressively grows coherent 3D world blocks, targeting interactive world generation and scene extension. The UranusITS/WorldGrow checkpoint is published on Hugging Face; WorldFoundry runs the official source and needs the checkpoint and TRELLIS assets staged locally.'
  overview_zh: WorldGrow 以扩张方式生成世界：从种子场景出发逐步生长出连贯的 3D 世界块，面向交互式世界生成与场景扩展。UranusITS/WorldGrow checkpoint 发布在 Hugging Face 上；WorldFoundry 运行官方源码，需要在本地就位 checkpoint 与 TRELLIS 资产。
  architecture: The dependency on TRELLIS assets indicates a structured-3D-latent generation backbone extended with block-wise scene growth. The official source is world-grow/WorldGrow, pinned at 1f2ac49c.
  architecture_zh: 对 TRELLIS 资产的依赖表明其以结构化 3D 隐变量生成为骨干、叠加分块场景生长。官方源码为 world-grow/WorldGrow，固定在 1f2ac49c。
  usage_notes: Stage both the WorldGrow checkpoint and the TRELLIS assets before running; until they are staged, a run returns a plan that lists the missing assets.
  usage_notes_zh: 运行前需同时就位 WorldGrow checkpoint 与 TRELLIS 资产；就位前运行只会返回一份列出缺失资产的计划。
  limitations:
  - The upstream repository has no root license file; review licensing before use.
  limitations_zh:
  - 上游仓库缺少根 LICENSE 文件；使用前请自行确认许可。
  recommended_benchmarks:
  - id: worldscore
    reason: Growable 3D world coherence and quality.
    reason_zh: 可生长 3D 世界的连贯性与质量。
