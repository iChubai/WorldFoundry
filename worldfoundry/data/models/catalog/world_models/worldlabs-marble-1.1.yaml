docs:
  publisher: World Labs
  publisher_kind: company
  publisher_zh: World Labs（世界实验室）
  overview: 'World Labs Marble 1.1 is a commercial API for 3D world generation: it produces explorable 3D worlds from prompts, accessed through api.worldlabs.ai. WorldFoundry calls it through the WorldLabs API pipeline with the marble-1.1 model id; there are no local weights.'
  overview_zh: World Labs Marble 1.1 是 3D 世界生成的商业 API：从提示生成可探索的 3D 世界，经 api.worldlabs.ai 访问。WorldFoundry 通过 WorldLabs API pipeline 以 marble-1.1 模型 id 调用它，没有本地权重。
  architecture: Closed API service; architecture details are not public. The official sources are the release notes and the API endpoint.
  architecture_zh: 闭源 API 服务，架构细节未公开。官方来源为发布说明与 API 端点。
  usage_notes: Requires World Labs API credentials; requests go through the WorldLabs API pipeline using model id marble-1.1.
  usage_notes_zh: 需要 World Labs API 凭证；请求经 WorldLabs API pipeline 发出，模型 id 为 marble-1.1。
  limitations:
  - 'API-only: closed weights, closed architecture, external service dependency.'
  limitations_zh:
  - 仅 API：权重与架构均闭源，依赖外部服务。
  recommended_benchmarks:
  - id: worldscore
    reason: Explorable 3D world generation quality.
    reason_zh: 可探索 3D 世界生成质量。
