docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'WorldMem targets the core weakness of interactive world models — forgetting: it equips a Minecraft-style interactive world model with an explicit memory so revisited places stay consistent over long horizons (paper: arXiv 2504.12369). WorldFoundry runs the route in-tree; the upstream inference model and data assets must be staged before generation.'
  overview_zh: WorldMem 针对交互式世界模型的核心弱点——遗忘：为 Minecraft 式交互世界模型加装显式记忆，使重访地点在长时程下保持一致（论文：arXiv 2504.12369）。WorldFoundry 在树内运行该路径；生成前需就位上游推理模型与数据资产。
  architecture: 'The design theme is long-term consistency via memory: past observations are stored and retrieved to condition future rollouts.'
  architecture_zh: 设计主题是基于记忆的长期一致性：存储并检索历史观测以条件化后续滚动生成。
  usage_notes: Until the upstream inference model and data assets are staged, a run returns a runtime plan that lists the missing assets instead of generating.
  usage_notes_zh: 上游推理模型与数据资产就位前，运行只输出列出缺失资产的运行时计划，不会生成内容。
  recommended_benchmarks:
  - id: memobench
    reason: Long-term memory consistency of world rollouts.
    reason_zh: 世界滚动生成的长期记忆一致性。
  - id: worldmodelbench
    reason: Action-conditioned interactive rollout quality.
    reason_zh: 动作条件交互滚动生成质量。
