integration:
  status: runtime_ported
  notes:
  - The WoW Wan route loads its trained transformer through the canonical Wan loader
    and reuses the shared conditioner, VAE, scheduler, and staged runner.
  - The released 1.3B transformer graph matches the native model exactly for all
    825 tensors and uses VAE-only first-frame conditioning.
  - The WoW DiT 2B checkpoint is a transformer override on the canonical Cosmos Predict2
    recipe and is selected through runtime_backend=dit2b; no private Cosmos runtime remains.
  - The pinned DiT 2B Hub snapshot does not expose wow_dit_2b.pt, so local checkpoint
    graph validation and a native CUDA artifact remain pending.
  - Wan demo defaults are steps=50, seed=42, tiled=true, num_frames=41, output_fps=15.
  - DiT 2B demo defaults are resolution=720, fps=16, num_conditional_frames=1, guidance=7, seed=42, guardrail/refiner disabled.
runtime_profile: runtime-profile:wow
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: wow
runner_parity:
  status: implemented_pending_native_gpu_parity
  notes:
  - The recorded Wan 14B Workspace artifact predates the native cutover and remains
    historical source/checkpoint evidence, not native artifact parity.
  - The current native route has exact checkpoint structure coverage; a fresh
    checkpoint-backed CUDA artifact is still required.
  - The DiT 2B native route remains checkpoint-gated and should record its own artifact
    evidence before promotion.
catalog_category: world_models
catalog_scope: World-model catalog entries. Integrated entries expose in-tree WorldFoundry runtimes; blocked entries retain
  upstream provenance without runnable backends.
docs:
  publisher: X-Humanoid (Beijing Humanoid Robot Innovation Center)
  publisher_kind: company
  publisher_zh: X-Humanoid（北京人形机器人创新中心）
  overview: "WoW is X-Humanoid's embodied world model family for action-conditioned image-to-video, with four checkpoint lines: Wan 1.3B-2M (MIT), Wan 14B-600k (official demo default), Wan 14B-2M (official recommendation), and a DiT 2B development line. Validated: the released Wan 1.3B-2M checkpoint loads into the native Wan model with an exact structural match."
  overview_zh: WoW 是 X-Humanoid 的具身世界模型家族，面向动作条件图生视频，包含四条 checkpoint 线：Wan 1.3B-2M（MIT）、Wan 14B-600k（官方 demo 默认）、Wan 14B-2M（官方推荐），以及 DiT 2B 开发线。已验证：发布的 Wan 1.3B-2M checkpoint 可加载到原生 Wan 模型，结构完全匹配。
  architecture: 'The Wan line uses VAE-only first-frame conditioning on Wan diffusion backbones. The DiT 2B line is a transformer override on the Cosmos Predict2 recipe, selected via runtime_backend=dit2b. Official demo defaults: Wan uses steps=50, seed=42, tiled, 41 frames at 15 fps; DiT 2B uses 720p, 16 fps, guidance=7.'
  architecture_zh: Wan 线在 Wan 扩散骨干上采用仅 VAE 的首帧条件。DiT 2B 线是 Cosmos Predict2 配方上的 transformer 覆盖，经 runtime_backend=dit2b 选择。官方 demo 默认值：Wan 为 steps=50、seed=42、tiled、41 帧、15 fps；DiT 2B 为 720p、16 fps、guidance=7。
  usage_notes: Start with the Wan 1.3B-2M (MIT) checkpoint; the official recommendation is Wan 14B-2M.
  usage_notes_zh: 建议从 Wan 1.3B-2M（MIT）checkpoint 起步；官方推荐为 Wan 14B-2M。
  limitations:
  - The pinned DiT 2B Hub snapshot does not include wow_dit_2b.pt, so the DiT 2B line has not been validated.
  limitations_zh:
  - 锁定的 DiT 2B Hub 快照不包含 wow_dit_2b.pt，因此 DiT 2B 线尚未验证。
  recommended_benchmarks:
  - id: ewmbench
    reason: Embodied action-conditioned world-model quality.
    reason_zh: 具身动作条件世界模型质量。
  - id: worldarena
    reason: Listed among WorldArena open-source world models.
    reason_zh: WorldArena 开源世界模型榜单收录。
