schema_version: 2
model_id: hyperflow
env_name: hyperflow
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
python: '3.11'
cuda_profile: cu128
conda_packages: [python=3.11, pip, ffmpeg]
pip_extra_index_url: https://download.pytorch.org/whl/cu128
pip_packages:
- torch==2.11.0+cu128
- torchvision==0.26.0+cu128
- torchaudio==2.11.0+cu128
- diffusers==0.40.0
- transformers==5.12.1
- accelerate
- safetensors>=0.8
- pillow
- av
- numpy
- scipy
- einops
- msgspec
validation_imports: [torch, diffusers, transformers, av, worldfoundry.synthesis.visual_generation.hyperflow.pipeline]
notes:
- In-tree HyperFlow reuses canonical MiniMax-H3 components. Generation uses local weights and performs no clone, installation or weight download.
- Diffusers supplies automatic CPU eviction and selected attention dispatch utilities only; model, VAE and scheduler forwards are canonical WorldFoundry code.
- Sol-Attn and FlashAttention-3 are optional installations; the default backend is PyTorch SDPA.
