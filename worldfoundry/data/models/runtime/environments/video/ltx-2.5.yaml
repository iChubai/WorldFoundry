schema_version: 2
model_id: ltx-2.5
env_name: ltx-2.5
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
python: '3.11'
cuda_profile: cu128
driver_status: compatible
conda_packages:
- python=3.11
- pip>=25
- ffmpeg>=6
pip_extra_index_url: https://download.pytorch.org/whl/cu128
pip_packages:
# Keep the local H100/driver tier on CUDA 12.x. With unconstrained versions,
# pip prefers the newer PyPI CUDA 13 wheel over this manifest's cu128 extra
# index, producing an environment that imports but cannot initialize CUDA.
- torch==2.11.0+cu128
- torchaudio==2.11.0+cu128
- torchvision==0.26.0+cu128
- transformers>=5.8.0,<5.15
- accelerate>=1.10
- safetensors>=0.6
- einops>=0.8
- numpy>=2.0
- scipy>=1.14
- av>=14
- tqdm>=4.66
- pillow>=10
validation_imports:
- torch
- torchaudio
- torchvision
- transformers
- accelerate
- safetensors
- einops
- numpy
- scipy
- av
- PIL
notes:
- NativeDiffusionPipeline runs the ltx-2.5 joint-multistage recipe in-process in this environment.
  Canonical components live in worldfoundry/base_models/diffusion_model; shared loading, offload,
  quantization and SDR H.264/AAC media encoding live in worldfoundry/core.
- PyTorch is pinned to an explicit cu128 build so PyPI cannot silently replace the requested CUDA tier with a newer CUDA 13 wheel.
- The recorded upstream revision pins its own uv CUDA 13.2 indexes; this manifest retains the repository's broadly deployable CUDA 12.8 environment tier.
- Diffusion VAE natten acceleration and the Blackwell ltx-kernels build are deployment-specific.
  NVFP4 modes require ltx-kernels; unquantized execution and control-plane imports do not.
- CPU random-checkpoint tensor parity is validated. Released-checkpoint GPU/MPS, quantization,
  offload and complete encoded-artifact parity remain pending.
