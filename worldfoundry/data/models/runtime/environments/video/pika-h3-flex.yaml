schema_version: 2
model_id: pika-h3-flex
env_name: worldfoundry-unified-cu128
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
python: '3.11'
cuda_profile: cu128
conda_packages: [python=3.11, pip, ffmpeg]
pip_extra_index_url: https://download.pytorch.org/whl/cu128
pip_packages:
- torch
- torchvision
- torchaudio
- transformers
- diffusers
- accelerate
- safetensors
- av
- pillow
- pyyaml
validation_imports: [torch, transformers, diffusers, safetensors, av, PIL]
notes:
- Pika H3 Flex runs in-tree over the canonical MiniMax-H3 components; no upstream runtime package is installed.
- Checkpoints and both task adapters stay outside Git and are injected through the runtime profile.
