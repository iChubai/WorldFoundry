schema_version: 2
model_id: dvlt
display_name: Déjà View Looping Transformer
checkpoints:
- local_dir: ${WORLDFOUNDRY_HFD_ROOT}/nvidia--dvlt
  repo_id: nvidia/dvlt
  role: official_dvlt_checkpoint
input_schema:
  actions:
  - view_sequence
  - reference_frame
  - reconstruction_options
  image: true
  prompt: false
  video: true
artifact_kind: generated_3d_asset
artifact_filename: dvlt_reconstruction.glb
execution:
  backend_stage: externalized_runtime
  runtime_status: externalized_runtime_gpu_parity_pending
  integration_status: integrated
integration:
  status: integrated
notes:
- WorldFoundry keeps DVLT runner glue in-tree, but the upstream source runtime is
  externalized from the public release tree.
- The nvidia/dvlt checkpoint remains an external asset under the NVIDIA non-commercial
  research/evaluation license.
- DVLTSynthesis fails fast on missing prerequisites and uses the external DVLT inference
  and GLB export helpers when CUDA, dependencies, inputs, source, and weights are
  staged locally.
