notes:
- In-tree HyperFlow reuses canonical MiniMax-H3 DiT, refiner, Qwen3-VL feature encoder and video/audio VAEs.
- The H3 variant owns two-time conditioning, unmerged LoRA, Sol-Attn policy and the fixed eight-step grid.
- Local base-model shards and adapter weights are required; inference runs offline.
- T2VA, first/last-frame FL2VA and ordered image/video/audio Ref2VA retain joint audio-video output.
- Single GPU CPU offload is the default; 2 or 4 GPUs use core Ulysses collectives. Diffusers is retained for automatic CPU eviction and selected attention dispatch utilities only.
- Released-key mappings are bijective and tiny FP32 components and all workflow denoising paths match the pinned reference exactly.
- CUDA kernels, distributed execution, offload placement and released-weight output parity require GPU validation.
- Source code is Apache-2.0; adapter and base weights use the MiniMax H3 Community License.
