schema_version: 2
model_id: lingbot-map
display_name: LingBot-Map
task_family: three_dimension
checkpoints:
- repo_id: robbyant/lingbot-map
  role: official_lingbot_map_checkpoint
  filenames:
  - lingbot-map-long.pt
  - lingbot-map.pt
  - lingbot-map-stage1.pt
input_schema:
  actions:
  - streaming_reconstruction
  - windowed_reconstruction
  image: true
  prompt: false
  video: true
artifact_kind: generated_3d_asset
artifact_filename: lingbot_map_predictions.npz
execution:
  backend_stage: in_tree_runtime
  runtime_status: in_tree_lingbot_map_runtime_checkpoint_and_gpu_parity_pending
  integration_status: integrated
integration:
  status: integrated
notes:
- WorldFoundry vendors the official LingBot-Map GCTStream runtime under worldfoundry/base_models/three_dimensions/point_clouds/lingbot_map.
- Checkpoints remain external cache assets from robbyant/lingbot-map; LingBotMapPipeline
  accepts a checkpoint file or local Hugging Face snapshot directory.
- The wrapper defaults to SDPA to avoid requiring FlashInfer for baseline execution;
  users can pass use_sdpa=false when FlashInfer is available.
verification_status: import_and_dispatch_integrated
