notes:
- Native ltx-2.3-v2v uses the distilled checkpoint with its version-matched control IC-LoRA.
- The input video must encode Canny, depth, or body-pose control; arbitrary RGB footage is not an equivalent conditioning
  signal.
- Execution uses the ltx-2.5 environment (Torch 2.11, Transformers 5.x) for the canonical split-Gemma loader. T2V/I2V
  remain on unified.
- Stage 1 applies IC-LoRA and reference-video tokens; stage 2 uses clean base weights. skip_stage_2 returns half-resolution
  output.
- Released-key mapping and tiny FP32 denoise/decode parity against a95ab856 are exact. Released-weight GPU replay
  and output quality remain pending.
