notes:
- Pika H3 Flex uses the canonical WorldFoundry MiniMax-H3 transformer, text encoder, geometry, codecs and MP4 writer.
- The fl2va and ref2va PEFT adapters are converted into the fused native QKV/SwiGLU layout at load time.
- Use adapter_task=fl2va for t2va/i2va/l2va/fl2va and adapter_task=ref2va for ref2va.
- The adapter release uses a six-knot re-noising ladder, 24 fps and synchronized stereo audio.
- Local image references are supported; video/audio references, full bucket parity and real-weight replay remain pending.
