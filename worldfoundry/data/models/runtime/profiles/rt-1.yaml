notes:
- RT-1/Robotics Transformer is modeled as a language-conditioned robot policy.
- The profile expects an RT-1 TensorFlow SavedModel directory at ${WORLDFOUNDRY_CKPT_DIR}/embodied_action/rt-1/rt1main.
- Pass a checkpoint-compatible 512-D language_embedding with each inference request;
  the released SavedModel does not encode prompt strings, and text-only calls fail
  explicitly.
- The profile emits action_trace artifacts; benchmark wrappers are responsible for
  environment replay and success metrics.
- The in-tree RT-1 SavedModel adapter completed offline GPU action inference with
  rt1main, rt1multirobot, and rt1simreal official checkpoints and supplied embeddings.
verification_status: checkpoint_backed_action_inference_embedding_required
