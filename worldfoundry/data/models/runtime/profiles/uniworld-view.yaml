integration: {status: integrated}
notes:
- The adapter runs the vendored official inference entry point as a package module in a separate Python environment.
- WorldFoundry dispatch stays in the unified environment; UNIWORLD_VIEW_PYTHON selects the separate upstream process.
- Official inference uses BLIP2 captioning; its --prompt flag is ignored by the current upstream inference path.
- The upstream default hybrid renderer requires PyTorch3D and at least 60 GB GPU memory is recommended.
- Dynamic view also requires STream3R weights; MoSca is an optional precomputed geometry alternative.
- The official default keeps the source aspect ratio at an approximate height/width token budget; set keep_aspect_ratio=false to request exact output dimensions.
- The vendored runtime loads STream3R for dynamic_view, saves the final single_view video at the requested fps and seeds the diffusion call with the requested seed; the pinned upstream revision leaves setup_stream3r empty, omits that fps and hard-codes seed 42.
